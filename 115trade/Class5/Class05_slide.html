<p><strong>Economic growth</strong> refers to an increase in a country's <code>productive capacity</code> and real output <code>over time</code>, typically measured by the growth rate of Gross Domestic Product (GDP).</p>
<h6 id="sources-of-economic-growth">Sources of Economic Growth:</h6>
<ul>
<li><strong>Factor accumulation</strong>: Increases in labor force, physical capital, human capital, or natural resources</li>
<li><strong>Technological progress</strong>: Improvements in productivity and efficiency</li>
<li><strong>Institutional improvements</strong>: Better governance, property rights, and market efficiency</li>
</ul>
<h6 id="types-of-growth">Types of Growth:</h6>
<ul>
<li><strong>Balanced growth</strong>: All sectors expand <code>proportionally</code>.</li>
<li><strong>Biased (unbalanced) growth</strong>: Some sectors grow faster than others due to factor-specific increases or sector-biased technological change</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="effect-of-economic-growth-on-trade">Effect of Economic Growth on Trade</h4>

<p>Economic growth affects international trade through <code>two</code> main channels:</p>
<h6 id="a-production-effect">A. Production Effect</h6>
<p>Growth changes a country's <code>production possibilities</code>:</p>
<ul>
<li>Expands the Production Possibility Frontier (PPF), alters the composition of output depending on which sector receives the <code>growth impulse</code>. Changes export supply and import-competing production.</li>
</ul>
<h6 id="b-consumption-effect">B. Consumption Effect</h6>
<p>Growth increases <code>national income</code>, which affects:</p>
<ul>
<li>Overall consumption levels, Demand for imports (typically rises with income). Consumption patterns (depending on income elasticity of demand)</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-UWYitkZK="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h6 id="net-effect-on-trade-volume">Net Effect on Trade Volume:</h6>

<ul>
<li><strong>Trade expands</strong> when production and consumption effects <code>reinforce</code> each other</li>
<li><strong>Trade may contract</strong> if growth is strongly biased toward <code>import substitution</code></li>
</ul>
<h6 id="effect-on-terms-of-trade">Effect on Terms of Trade:</h6>
<p>For a <strong>large country</strong> (one that can influence world prices):</p>
<ul>
<li><strong>Export-biased growth</strong> → Increased export supply → May <strong>worsen</strong> terms of trade</li>
<li><strong>Import-biased growth</strong> → Reduced import demand → May <strong>improve</strong> terms of trade</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="main-mechanism">Main Mechanism</h4>

<p>The Rybczynski Theorem assumes the country is a <strong>&quot;small country&quot;</strong>—meaning its production changes are too small to affect world market prices. Therefore, the <strong>relative price of goods remains constant</strong>.</p>
<h6 id="economic-growth-if-factor-accumulation">Economic Growth (if Factor Accumulation)</h6>
<p>Suppose the country experiences economic growth specifically through an <strong>increase in its Labor force (L)</strong>, while Capital (K) remains constant.</p>
<h6 id="the-biased-shift-of-the-ppf">The Biased Shift of the PPF</h6>

<h6 id="constant--price-assumption">Constant- Price Assumption?</h6>

<p>The <code>constant-price assumption</code> is useful for <strong>isolating</strong> the production effect, but <code>in reality</code>, if a country is large enough, a massive increase in its exports will flood the world market and <strong>change the relative price (Terms of Trade)</strong>. Following the Rybczynski shift, the country is now producing a massive surplus of <code>Cloth</code> (its <code>export good</code>) and <code>less Food</code> (its <code>import good</code>).</p>
<ul>
<li>The increased global supply of Cloth drives <code>down</code> its price.</li>
<li>The decreased domestic supply of Food increases the demand for imported Food, <code>driving up</code> its price.</li>
<li><strong>Result:</strong> The relative price of Cloth falls. The Terms of Trade (TOT) deteriorate. The new price line (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>) is <strong>flatter</strong> than <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>.</li>

<h6 id="moving-along-the-new-ppf">Moving Along the New PPF</h6>

<p>The economy is no longer at the <code>pure Rybczynski tangency point</code>. Because the relative price of Cloth has fallen, Cloth becomes relatively less profitable to produce.</p>

<li><strong>Production Adjustment:</strong> The production of Cloth <code>decreases slightly</code> from its pure Rybczynski peak, and the production of Food <code>increases</code> from its Rybczynski trough.</li>
<li><strong>Key Takeaway:</strong> The change in relative prices <strong>dampens (mitigates) the pure Rybczynski effect</strong>. The output of the expanding good doesn't grow quite as much, and the output of the contracting good doesn't fall quite as much.</li>
</ul>

<h4 id="offer-curves-in-general-equilibrium">Offer Curves in General Equilibrium</h4>

<p><strong>Key Concepts:</strong></p>
<ol>
<li><strong>Offer Curve</strong>: Shows a country's <code>desired trade (exports and imports)</code> at different relative prices</li>
<li><strong>Exports</strong> = <code>Excess supply</code> of the export good and <strong>Imports</strong> = <code>Excess demand</code> for the import good</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h6 id="graphical-representation-of-the-offer-curve">Graphical Representation of the Offer Curve</h6>

<p>Consider a country producing and consuming two goods:</p>
<ul>
<li><strong>Cloth (C)</strong>: The <code>export good</code>, <strong>Food (F)</strong>: The <code>import good</code></li>
</ul>
<p><strong>Axes:</strong></p>
<ul>
<li>X-axis: <code>Exports of Cloth</code> (or Excess Supply of Cloth, Production of Cloth − Consumption of Cloth)</li>
<li>Y-axis: <code>Imports of Food</code> (or Excess Demand for Food, Consumption of Food − Production of Food)</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="economic-growth-benefit-the-country">Economic Growth Benefit the Country?</h4>

<p><strong>In a Closed Economy (Autarky):</strong> Economic growth is <strong>always</strong> beneficial. Because the country cannot trade, its consumption possibilities are strictly limited by its production possibilities.</p>
<ul>
<li>When the Production Possibility Frontier (PPF) shifts outward due to growth, the country simply moves to a <strong>higher Community Indifference Curve</strong>. There are no external markets to distort the outcome; more physical goods always mean <strong>higher welfare</strong>.</li>
</ul>
<p><strong>In an Open Economy:</strong> The introduction of international trade adds a crucial new variable:</p>
<ul>
<li><strong>The Terms of Trade (Relative Prices)</strong>. If a country is <strong>large</strong> (meaning its production volume is big enough to influence world prices), its <strong>growth affects the global market</strong>. If the growth is <code>heavily</code> biased toward the <code>country's export sector</code>, the massive increase in export supply <code>crashes</code> the global price of those exports.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/5-6.jpg&quot;);background-size:70%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="22" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>

</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="color:#000;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-xMB1uTel="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<ul>
<li>When a country experiences <code>economic growth</code>, its Production Possibility Frontier <code>(PPF) shifts</code> outward. How this growth affects international trade depends entirely on the <strong>bias of the growth</strong> (driven by the Rybczynski Theorem). This bias determines how the country's <strong>Offer Curve (OC)</strong> shifts, which in turn determines the new equilibrium <strong>Terms of Trade (TOT)</strong> and the ultimate impact on national welfare (consumption).</li>
<li>Here are the <strong>three distinct cases</strong> of economic growth and their effects on production, terms of trade, and consumption.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-SNzMdYd3="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="24" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="the-mechanism">The Mechanism:</h4>

<p>Before diving into the cases, we must understand how the Offer Curve shifts:</p>
<ul>
<li><strong>Export-Biased Growth:</strong> Growth favors the <code>export sector</code> (e.g., a massive increase in the labor force in a labor-abundant country exporting textiles). The country wants to <code>export more</code> at any given price. <strong>The OC shifts outward ( OH --&gt; OH1 to the right).</strong> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container> <code>flatter</code>)</li>
<li><strong>Import-Biased Growth:</strong> Growth favors the import-competing sector (e.g., a massive increase in capital in a labor-abundant country, boosting machinery production). The country needs <code>fewer imports</code>. <strong>The OC shifts inward (OH--&gt;OH2 to the left).</strong> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> <code>steeper</code>)</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/5-7.jpg&quot;);background-size:60%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="25" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="color:#000;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-1THRHRbR="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="case-1-the-all-good-scenario-import-biased-growth">Case 1: The &quot;All Good&quot; Scenario (Import-Biased Growth)</h4>

<p><em>Production increases, Terms of Trade improve, and Consumption (Welfare) increases.</em></p>
<h6 id="the-setup">The Setup</h6>
<p>The <code>Home country</code> experiences economic growth that is biased toward its <strong>import-competing sector</strong> (e.g., <code>Food</code>). According to the Rybczynski theorem, the production of <strong>Food</strong> <code>expands significantly</code>, while the production of <strong>Cloth</strong> (exports) may even <code>contract</code>.</p>
<h6 id="the-offer-curve-shift">The Offer Curve Shift</h6>
<p>Because the Home country is now producing more of the good it used to import, its demand for imports <code>falls</code> at every relative price.</p>
<ul>
<li><strong>Result:</strong> Home’s Offer Curve shifts <strong>inward (to the left)</strong>.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-TYHOFRD9="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="the-economic-outcome">The Economic Outcome</h4>

<ol>
<li><strong>Production:</strong> The physical capacity of the economy has grown (<strong>PPF shifted out</strong>).</li>
<li><strong>Terms of Trade (TOT):</strong> The inward shift of Home's OC intersects Foreign's OC at a new equilibrium where the <code>relative price</code> of Home's exports has risen. <strong>Home's TOT improves.</strong> (Home gets <code>more imports</code> for every unit of exports).</li>
<li><strong>Consumption/Welfare:</strong> The country benefits from a <strong>double dividend</strong>. It has more physical goods to consume, <em>and</em> its purchasing power in the global market has increased. The country reaches a <code>higher</code> community indifference curve. <strong>Welfare unambiguously increases.</strong></li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/5-8.jpg&quot;);background-size:65%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="28" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="color:#000;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-gqTTMPDc="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="case-2-the-mixed-scenario-moderate-export-biased-growth">Case 2: The &quot;Mixed&quot; Scenario (Moderate Export-Biased Growth)</h4>

<p><em>Production increases, Terms of Trade deteriorate, but Consumption (Welfare) still increases.</em></p>
<h6 id="the-setup-1">The Setup</h6>
<p>The Home country experiences economic growth that is <strong>biased toward its export sector</strong> (e.g., <code>Cloth</code>). This is the <strong>most common</strong> real-world scenario for <strong>developing economies</strong>. The Rybczynski effect causes a massive <code>expansion</code> in <code>Cloth production</code>.</p>
<h6 id="the-offer-curve-shift-1">The Offer Curve Shift</h6>
<p>The Home country now has a much larger surplus of Cloth to sell to the world. At any given price, it is willing to <strong>export more Cloth</strong> in exchange for Food.</p>
<ul>
<li><strong>Result:</strong> Home’s Offer Curve shifts <strong>outward (to the right)</strong>.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-2qMRi6cN="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="30" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="the-economic-outcome-1">The Economic Outcome</h4>

<ol>
<li><strong>Production:</strong> The physical output of the economy has grown.</li>
<li><strong>Terms of Trade (TOT):</strong> Because Home is a <code>large country</code>, flooding the world market with extra Cloth drives down the global price of Cloth. The new intersection of the OCs occurs at a <code>flatter price</code> line. <strong>Home's TOT deteriorates.</strong> (Home must export more Cloth to get the same amount of Food).</li>
<li><strong>Consumption/Welfare:</strong> This is the crucial <code>trade-off</code>. The deterioration in TOT acts as a &quot;tax&quot; on the country's growth. However, in this moderate case, the physical gain in production is larger than the loss in purchasing power. The outward shift of the consumption possibilities frontier outweighs the flatter price line. The country reaches a higher indifference curve. Welfare increases, but by less than it would have if the TOT had remained constant.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-aCeRTBmA="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="31" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="case-3-immiserizing-growth-extreme-export-biased-growth">Case 3: Immiserizing Growth (Extreme Export-Biased Growth)</h4>

<p>First discovered by <strong>F.Y. Edgeworth</strong> (1894), rediscovered, named, and formalized by <strong>Jagdish N. Bhagwati</strong> (1958), with algebraic generalizations by <strong>Harry G. Johnson</strong> (1958).</p>
<h6 id="the-setup-2">The Setup</h6>
<p>This is the <code>paradoxical worst-case scenario</code>, first formalized by Jagdish Bhagwati (1958). The Home country experiences <strong>extreme, highly biased growth in its export sector</strong>, and the country is <code>large enough</code> to influence world prices. Furthermore, the Foreign country's demand for these exports is highly <strong>inelastic</strong> (Foreign's Offer Curve is very steep/bent backward).</p>
<h6 id="the-offer-curve-shift-2">The Offer Curve Shift</h6>
<p>Home’s massive export boom causes its Offer Curve to shift <strong>drastically outward</strong>.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-K5syUUiW="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="32" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="the-economic-outcome-2">The Economic Outcome</h4>

<ol>
<li><strong>Production:</strong> The physical output of the export sector has surged.</li>
<li><strong>Terms of Trade (TOT):</strong> The massive increase in export supply crashes the global price of the export good. Because Foreign demand is inelastic, Foreign is only willing to buy this massive extra quantity if the price drops precipitously. <strong>Home's TOT deteriorates severely.</strong></li>
<li><strong>Consumption/Welfare:</strong> The loss in purchasing power is so <strong>catastrophic</strong> that it completely swamps the physical gains in production. The new, <strong>drastically flatter</strong> price line means the country's consumption possibilities have actually shrunk. The country is forced to trade a massive amount of exports for very few imports. The country ends up on a <strong>lower community indifference curve</strong>. <strong>Welfare decreases.</strong> The country is literally <code>immiserized</code> (made poorer) by its own economic growth.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="33" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/5-9.jpg&quot;);background-size:60%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="33" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="33" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="33" style="color:#000;" data-marpit-pagination-total="43" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-Ss9snTD1="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="34" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="conditions-required-for-immiserizing-growth">Conditions Required for Immiserizing Growth:</h4>

<p>For this paradox to occur, three strict conditions must be met simultaneously:</p>
<ol>
<li><strong>Large Country:</strong> The country must be <code>large enough</code> to affect world prices.</li>
<li><strong>Export-Biased Growth:</strong> The growth must heavily favor the export sector (strong Rybczynski effect).</li>
<li><strong>Inelastic Foreign Demand:</strong> The rest of the world must have a very low income elasticity of demand for the country's exports (Foreign's Offer Curve must be inelastic).</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-izI8gHuy="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="35" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<ul>
<li><strong>The Positive Effect:</strong> The country produces more <strong>physical goods (Quantity effect)</strong>.</li>
<li><strong>The Negative Effect:</strong> The country's exports are now <strong>worth less</strong> on the global market, meaning it can buy fewer imports <strong>(Price/Terms of Trade effect)</strong>.</li>
</ul>
<p><code>Core Idea:</code></p>
<ul>
<li><strong>Closed Economy:</strong> Growth = Unambiguous Welfare Gain.</li>
<li><strong>Open Economy:</strong> Growth = Welfare Gain <em>minus</em> the Terms of Trade effect.</li>
</ul>
<p>If the negative price effect is <code>severe enough</code>, it completely wipes out the positive quantity effect, leaving the country poorer than before it grew.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-47umuyOm="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="36" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-3AgFCsGB="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="37" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="the-takeaway">The Takeaway</h4>

<p>Economic growth is not an automatic guarantee of higher living standards in an open economy. While the <strong>Rybczynski Theorem</strong> dictates how physical production changes, the <strong>Offer Curve</strong> framework reveals that a country's ultimate welfare depends on the <strong>Terms of Trade</strong>. If a country grows by producing exactly what the rest of the world already has in abundance, it can inadvertently destroy its own purchasing power.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-afgg0ULc="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="38" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h4 id="mathematical-derivation">Mathematical Derivation</h4>

<p>A country's welfare depends on its <strong>Real Income</strong> (its purchasing power in the global market). Real Income is simply the value of what it produces and exports.</p>
<p>Let’s define our variables:</p>
<ul>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>  = Quantity of Exports produced.</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.699ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 751 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g></g></g></svg></mjx-container>  = Price of Exports (in terms of Imports). <em>This is the Terms of Trade.</em></li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.14ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 504 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43C" d="M43 1Q26 1 26 10Q26 12 29 24Q34 43 39 45Q42 46 54 46H60Q120 46 136 53Q137 53 138 54Q143 56 149 77T198 273Q210 318 216 344Q286 624 286 626Q284 630 284 631Q274 637 213 637H193Q184 643 189 662Q193 677 195 680T209 683H213Q285 681 359 681Q481 681 487 683H497Q504 676 504 672T501 655T494 639Q491 637 471 637Q440 637 407 634Q393 631 388 623Q381 609 337 432Q326 385 315 341Q245 65 245 59Q245 52 255 50T307 46H339Q345 38 345 37T342 19Q338 6 332 0H316Q279 2 179 2Q143 2 113 2T65 2T43 1Z"></path></g></g></g></svg></mjx-container>  = Real Income (Purchasing Power).</li>
</ul>
<p>Therefore, the basic equation for a country's purchasing power is: <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="9.544ex" height="1.731ex" role="img" focusable="false" viewBox="0 -683 4218.6 765"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43C" d="M43 1Q26 1 26 10Q26 12 29 24Q34 43 39 45Q42 46 54 46H60Q120 46 136 53Q137 53 138 54Q143 56 149 77T198 273Q210 318 216 344Q286 624 286 626Q284 630 284 631Q274 637 213 637H193Q184 643 189 662Q193 677 195 680T209 683H213Q285 681 359 681Q481 681 487 683H497Q504 676 504 672T501 655T494 639Q491 637 471 637Q440 637 407 634Q393 631 388 623Q381 609 337 432Q326 385 315 341Q245 65 245 59Q245 52 255 50T307 46H339Q345 38 345 37T342 19Q338 6 332 0H316Q279 2 179 2Q143 2 113 2T65 2T43 1Z"></path></g><g data-mml-node="mo" transform="translate(781.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mi" transform="translate(1837.6,0)"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mi" transform="translate(2588.6,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 1 <footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-wIaxi3NI="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="39" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="43" data-size="16:9">
<h6 id="step-1-the-effect-of-economic-growth">Step 1: The Effect of Economic Growth</h6>

<p>When the country experiences economic growth, <code>two things</code> happen simultaneously:</p>
<ol>

<ol>
<li><strong>Growth makes you produce more</strong> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="3.812ex" height="1.62ex" role="img" focusable="false" viewBox="0 -716 1685 716"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6E5" d="M574 715L582 716Q589 716 595 716Q612 716 616 714Q621 712 621 709Q622 707 705 359T788 8Q786 5 785 3L781 0H416Q52 0 50 2T48 6Q48 9 305 358T567 711Q572 712 574 715ZM599 346L538 602L442 474Q347 345 252 217T157 87T409 86T661 88L654 120Q646 151 629 220T599 346Z"></path></g><g data-mml-node="mi" transform="translate(833,0)"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container> is positive). This is good.</li>
<li><strong>Producing more crashes the price</strong> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="3.584ex" height="1.62ex" role="img" focusable="false" viewBox="0 -716 1584 716"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6E5" d="M574 715L582 716Q589 716 595 716Q612 716 616 714Q621 712 621 709Q622 707 705 359T788 8Q786 5 785 3L781 0H416Q52 0 50 2T48 6Q48 9 305 358T567 711Q572 712 574 715ZM599 346L538 602L442 474Q347 345 252 217T157 87T409 86T661 88L654 120Q646 151 629 220T599 346Z"></path></g><g data-mml-node="mi" transform="translate(833,0)"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g></g></g></svg></mjx-container> is negative). This is bad.</li>
