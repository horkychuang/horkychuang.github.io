<h2 id="product-life-cycle-plc-theory">Product Life Cycle (PLC) Theory</h2>

<p>Raymond Vernon’s <strong>Product Life Cycle (PLC) Theory of International Trade</strong>, introduced in 1966, is a groundbreaking framework that explains how the trade patterns of a specific good change over time as the product matures.</p>
<p>Before Vernon, trade theories (like Ricardo and Heckscher-Ohlin) treated <strong>comparative advantage as static</strong>. Vernon argued that comparative advantage is <strong>dynamic</strong>: a country might have a comparative advantage in producing a good when it is first invented, but lose that advantage as the product ages and becomes standardized.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

ound_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>

</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="color:#000;" data-marpit-pagination-total="29" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-ptytMqr2="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">
<h4 id="three-stages-of-the-product-life-cycle">Three Stages of the Product Life Cycle</h4>

<p>Vernon originally developed this theory to explain the post-WWII trade behavior of the United States, using manufactured goods like consumer electronics, chemicals, and pharmaceuticals as examples. The cycle is divided into three distinct stages:</p>
<h6 id="stage-1-the-new-product-introduction">Stage 1: The New Product (Introduction)</h6>
<ul>
<li><strong>Location of Production:</strong> The innovating, high-income country (historically, the United States).</li>
<li><strong>Characteristics:</strong> The product is new, unstandardized, and requires highly skilled labor and heavy R&amp;D. Production processes are not yet fully defined, so manufacturing must be located close to the home market to allow for quick feedback from consumers and rapid design changes.</li>
<li><strong>Trade Pattern:</strong> The innovating country exports the product to other high-income countries. Demand in the home country is highly inelastic (consumers are willing to pay a premium for the new tech), while foreign demand is just beginning to grow.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-0MDd6FMn="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">
<h6 id="stage-2-the-maturing-product-growth">Stage 2: The Maturing Product (Growth)</h6>

<ul>
<li><strong>Location of Production:</strong> Begins to shift to other developed nations (e.g., Europe, Japan).</li>
<li><strong>Characteristics:</strong> The product design becomes more standardized. Demand in foreign markets grows rapidly. Competitors in other developed nations begin to emerge and figure out how to produce the good.</li>
<li><strong>Trade Pattern:</strong> Exports from the innovating country peak and then begin to decline. To maintain market share and avoid tariff barriers, firms from the innovating country start engaging in <strong>Foreign Direct Investment (FDI)</strong>, setting up assembly plants in foreign markets.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-DxLEVk90="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">
<h4 id="stage-3-the-standardized-product-maturitydecline">Stage 3: The Standardized Product (Maturity/Decline)</h4>

<ul>
<li><strong>Location of Production:</strong> Shifts entirely to developing, low-wage countries.</li>
<li><strong>Characteristics:</strong> The product is now a fully standardized commodity (e.g., a basic calculator or a standard t-shirt). Technology is widely known. The primary basis of competition is no longer innovation or quality, but <strong>price</strong>.</li>
<li><strong>Trade Pattern:</strong> Production moves to developing nations to take advantage of cheap, unskilled labor. The original innovating country (the US) shuts down its domestic factories and becomes a <strong>net importer</strong> of the very product it invented.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-gffYn6Lv="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">
<h4 id="limitations-in-the-modern-globalized-economy">Limitations in the Modern Globalized Economy</h4>

<p>While highly influential, the strict Vernon model is less applicable to the 21st-century global economy for several reasons:</p>
<ul>
<li><strong>Simultaneous Global Launches:</strong> Today, products like the iPhone or modern pharmaceuticals are launched globally on day one. Companies do not wait for a &quot;maturing&quot; stage to enter foreign markets.</li>
<li><strong>Global Supply Chains (Modular Production):</strong> Products are no longer made entirely in one country and then moved. A single product (like a car or smartphone) is fragmented. R&amp;D happens in the US, components are made in South Korea and Japan, and final assembly occurs in China. The product is in multiple &quot;stages&quot; of its life cycle simultaneously across different borders.</li>
<li><strong>Reverse Innovation:</strong> Innovation is no longer the exclusive domain of the West. Multinational corporations now frequently develop new, low-cost products in emerging markets (like India or China) and later introduce them to developed markets (e.g., GE's portable ECG machines developed in India).</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-pLYEBkOU="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">
<h2 id="gravity-model">Gravity Model</h2>

<p>The <strong>Gravity Model</strong>, Developed by Jan Tinbergen (1962),  is one of the most successful empirical models in international economics for predicting bilateral trade flows between countries. It draws an analogy to <strong>Newton's law of gravitation</strong>, suggesting that trade between two countries is proportional to their economic sizes and inversely proportional to the distance between them.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-IxEwzTa8="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">
<h4 id="1-basic-intuition">1. Basic Intuition</h4>

<p>Just as <code>gravitational force</code> between two objects increases with their <code>mass</code> and decreases with <code>distance</code>, trade between two countries increases with their economic sizes and decreases with trade barriers (distance, tariffs, language differences, etc.).</p>
<h5 id="core-variables">Core Variables:</h5>
<ol>
<li>Economic Size (GDP): Larger economies trade more. Positive relationship with trade flows</li>
<li>Distance
<ul>
<li><code>Geographic distance</code> between economic centers</li>
<li>Proxy for <code>transportation costs</code> and <code>information barriers</code></li>
<li>Negative relationship with trade flows</li>
</ul>
</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-bsvAJodW="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="11" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="29" data-size="16:9">

<h5 id="what-is-multilateral-resistancemr">What Is Multilateral Resistance(MR) ?</h5>

<p>In the real world, bilateral trade between countries <em>i</em> and <em>j</em> does <strong>not</strong> depend only on their <code>direct</code> bilateral trade costs (e.g., distance, tariffs, language). It also depends on <code>how easy or difficult</code> it is for <em>i</em> to trade with <strong>all other countries</strong> and for <em>j</em> to source from <strong>all other suppliers</strong>.</p>
<ul>
<li>
<p><strong>Outward Multilateral Resistance (Πᵢ)</strong>: Measures the <code>average trade barriers</code> that exporters from country <em>i</em> face when selling to the <strong>rest of the world</strong>. If <em>i</em> has low barriers to many markets, its outward MR is low → it exports more easily everywhere (including to <em>j</em>).</p>

<li>

<p>These terms act as <strong>general equilibrium price indices</strong> that capture the <code>relative competitiveness</code> and <code>market</code> access in a multi-country world. Ignoring multilateral resistance(MR) leads to the &quot;Gold Medal Mistake&quot; (Baldwin &amp; Taglioni): biased estimates of bilateral effects (e.g., over- or under-estimating the impact of RTAs, distance, or policies).</p>

<p>Suppose Country i signs a trade agreement with Country j (lowers <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.666ex;" xmlns="http://www.w3.org/2000/svg" width="2.216ex" height="2.082ex" role="img" focusable="false" viewBox="0 -626 979.3 920.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 317 385H210L174 240Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z"></path></g><g data-mml-node="TeXAtom" transform="translate(394,-150) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mi" transform="translate(345,0)"><path data-c="1D457" d="M297 596Q297 627 318 644T361 661Q378 661 389 651T403 623Q403 595 384 576T340 557Q322 557 310 567T297 596ZM288 376Q288 405 262 405Q240 405 220 393T185 362T161 325T144 293L137 279Q135 278 121 278H107Q101 284 101 286T105 299Q126 348 164 391T252 441Q253 441 260 441T272 442Q296 441 316 432Q341 418 354 401 <h6 id="how-to-handle-mr-in-estimation">How to Handle MR in Estimation</h6>

<ol>
<li><strong>Country fixed effects</strong> (importer and exporter dummies) — Most common practical solution. They absorb the unobserved MR terms.</li>
<li><strong>Iterative solving</strong> (Anderson &amp; van Wincoop method) — Computes MR explicitly but is computationally intensive.</li>
<li><strong>Approximations</strong> (remoteness indices) — Older, less accurate method.</li>
<li><strong>PPML estimator</strong> — Preferred for handling zeros and heteroskedasticity, combined with fixed effects.</li>
</ol>
<p>In panel data (common for services/digital trade), <strong>exporter-time and importer-time fixed effects</strong> are typically used to control for time-varying MR.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="key-empirical-findings">Key Empirical Findings</h4>

<ul>
<li>Distance elasticity is typically around <strong>-0.7 to -1.0</strong> (trade falls sharply with distance).</li>
<li>Trade agreements (FTAs) increase trade by 50–200%.</li>
<li>Border effect: Countries trade much more domestically than internationally (“home bias”).</li>
<li>The model explains <strong>60–80%</strong> of variation in bilateral trade flows.</li>
</ul>

<h4 id="modern-extensions">Modern Extensions</h4>

<ul>
<li><strong>Zero Trade Flows</strong>: Use Poisson Pseudo-Maximum Likelihood (PPML) estimator instead of OLS.</li>
<li><strong>Firm Heterogeneity</strong>: Incorporating Melitz-type selection.</li>
<li><strong>Global Value Chains</strong>: Using value-added trade instead of gross trade.</li>
<li><strong>Dynamic Gravity</strong>: Panel data with fixed effects.</li>
<li><strong>General Equilibrium Effects</strong>: Solving for multilateral resistance terms.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
