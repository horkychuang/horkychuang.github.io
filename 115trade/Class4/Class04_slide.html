<p>The <strong>Heckscher-Ohlin Model</strong> (developed by Eli Heckscher, 1919 and Bertil Ohlin, 1924) is a <code>general equilibrium model</code> that explains international trade based on <strong>differences in factor endowments</strong> between countries.</p>
<p>The Heckscher-Ohlin model extends the Ricardian comparative advantage framework by explaining the <em>source</em> of comparative advantage: Differences in <strong>relative factor endowments</strong> (e.g., capital vs. labor) <code>across countries</code>, combined with differences in <strong>factor intensities</strong> of <code>goods</code>.  It assumes <code>identical technologies</code> across countries, so trade patterns arise purely from <code>endowment differences</code>.</p>
<p><strong>Core Idea</strong>: Countries export goods that intensively use their <strong>abundant factor</strong> and import goods that intensively use their <strong>scarce factor</strong>.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="key-related-theorems-in-h-o">Key Related Theorems in H-O</h4>

<ol>
<li><strong>Rybczynski Theorem</strong>: At constant prices, an increase in <code>one factor endowment</code> increases output of the intensive good more than proportionally and decreases output of the other good.</li>
<li><strong>Stolper-Samuelson Theorem</strong>: An increase in the <code>relative price of a good</code> raises the real <code>return</code> to the intensive factor and lowers the real return to the other factor.</li>
<li><strong>Factor Price Equalization (FPE)</strong>: Under certain conditions (no specialization, etc.), free trade equalizes <code>relative factor prices (w/r)</code> across countries.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="core-assumptions-2%C3%972%C3%972-model">Core Assumptions (2×2×2 Model)</h4>

<table>
<thead>
<tr>
<th>Assumption</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>Two countries, Two goods, Two factors</td>
<td>Standard 2×2×2 model</td>
</tr>
<tr>
<td><code>Perfect Competition</code></td>
<td>In both goods and factor markets</td>
</tr>
<tr>
<td>Constant Returns to Scale (CRS)</td>
<td>Production functions are homogeneous of degree 1</td>
</tr>
<tr>
<td>Identical Homothetic Preferences</td>
<td>Same tastes across countries</td>
</tr>
<tr>
<td>Technology</td>
<td>Same technology in both countries</td>
</tr>
<tr>
<td>Factors mobile within country</td>
<td>Labor and Capital mobile between sectors</td>
</tr>
<tr>
<td>Factors immobile between countries</td>
<td>No international factor mobility</td>
</tr>
<tr>
<td>No transport costs / trade barriers</td>
<td>Free trade</td>
</tr>
<tr>
<td>Full employment</td>
<td>All factors are fully utilized</td>
</tr>
</tbody>
</table>

</section>

<h3 id="heckscher-ohlin-theorem">Heckscher-Ohlin Theorem</h3>

<blockquote>
<p>A country will <strong>export</strong> the goods that <strong>intensively uses</strong> its <strong>relatively abundant factor</strong>, and <strong>import</strong> the goods that intensively uses its <strong>relatively scarce factor</strong>.</p>
</blockquote>
<p><strong>Example</strong>:</p>
<ul>
<li>China (labor-abundant) → exports labor-intensive goods (textiles, electronics assembly)</li>
<li>Germany (capital-abundant) → exports capital-intensive goods (machinery, cars)</li>
</ul>

<ol start="4">
<li>
<p><code>Equilibrium World Price</code>:</p>
<ul>
<li>
<p>The world relative price will settle <strong>between</strong> the <code>two autarky price ratios</code>.</p>
</li>
<li>
<p>Labor-abundant country will export the labor-intensive good (negative excess demand = excess supply), while Capital-abundant country will export the capital-intensive good.</p>
</li>
</ul>
</li>
</ol>
<p><strong>Intuition</strong>:</p>
<ul>
<li><code>Autarky price</code> in labor-abundant country is <code>lower</code> for labor-intensive good. When trade opens, the world price lies in between → labor-abundant country exports labor-intensive good.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-9DF63J6f="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="economic-intuition">Economic Intuition</h4>

<ol>
<li><strong>Endowment → Output</strong>: More capital relative to labor forces the economy to use its abundant factor intensively → produces more Y relative to X at any given price.</li>
<li><strong>Output → Price</strong>: Higher relative supply of Y meets downward-sloping demand → autarky price of Y falls.</li>
<li><strong>Price → Trade</strong>: When borders open, the country with the lower autarky price of Y sells it abroad → exports the good that uses its abundant factor.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<p><strong>Conclusion</strong>: Trade flows are driven by differences in relative factor prices. <strong>Expensive factors are indirectly imported, while cheap factors are indirectly exported</strong>. This is precisely the pure, non-parametric expression of the Heckscher-Ohlin theorem, and it does not require assumptions of <code>identical technologies</code> across countries, <code>identical demand</code> structures, or explicit factor intensity rankings.</p>
