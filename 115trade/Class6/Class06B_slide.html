<p>The Melitz model (2003) is the <code>most influential extension</code> of New Trade Theory. It introduces <strong>firm heterogeneity</strong> in productivity and explains why only some firms export, why exporters are larger and more productive, and how trade causes important reallocation effects within industries.</p>
<p>Core Idea: Within this framework, the <strong>self-selection effect</strong> is one of the most important and empirically robust concepts. <strong>Only the most productive firms become exporters</strong></p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<li>Increasing returns to scale (fixed cost + constant marginal cost)</li>

</li>

<h4 id="2-core-structure-of-the-model">2. Core Structure of the Model</h4>
<h6 id="firm-revenue-and-profit">Firm Revenue and Profit</h6>

<p>A firm with productivity <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.348ex" height="2.034ex" role="img" focusable="false" viewBox="0 -694 596 899"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D719" d="M409 688Q413 694 421 694H429H442Q448 688 448 686Q448 679 418 563Q411 535 404 504T392 458L388 442Q388 441 397 441T429 435T477 418Q521 397 550 357T579 260T548 151T471 65T374 11T279 -10H275L251 -105Q245 -128 238 -160Q230 -192 227 -198T215 -205H209Q189 -205 189 -198Q189 -193 211 -103L234 -11Q234 -10 226 -10Q221 -10 206 -8T161 6T107 36T62 89T43 171Q43 231 76 284T157 370T254 422T342 441Q347 441 348 445L378 567Q409 686 409 688ZM122 150Q122 116 134 91T167 53T203 35T237 27H244L337 404Q333 404 326 403T297 395T255 379T211 350T170 304Q152 276 137 237Q122 191 122 150ZM500 282Q500 320 484 347T444 385T405 400T381 404H378L332 217L284 29Q284 27 285 27Q293 27 317 33T357 47Q400 66 431 100T475 170T494 234T500 282Z"></path></g></g></g></svg></mjx-container> has:</p>

<h5 id="6-gains-from-trade-in-melitz-model">6. Gains from Trade in Melitz Model</h5>

<p>Trade generates <strong>three types of gains</strong>:</p>
<ol>
<li><strong>Variety gains</strong> (same as Krugman)</li>
<li><strong>Pro-competitive gains</strong> (lower markups due to more competition)</li>
<li><strong>Reallocation / Selection gains</strong> — most important new channel</li>
</ol>
<p>When trade opens:</p>
<ul>
