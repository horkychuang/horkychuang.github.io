<h2 id="new-trade-theory">New Trade Theory</h2>
<p><strong>Wen-Bin Chuang</strong><br />
<strong>2026-09-14</strong></p>
<footer>Designed by Wen-Bin 2026-09-05</footer>

<p><strong>New Trade Theory</strong> (primarily developed by Paul Krugman in 1979–1980) explains why countries trade even when they have <code>similar factor endowments and technologies</code>. It shifts focus from comparative advantage to <strong>economies of scale</strong> (increasing returns to scale) and <strong>imperfect competition</strong>.</p>
<p>This theory successfully explains <strong>intra-industry trade</strong> — countries both exporting and importing <code>similar products</code> (e.g., cars, smartphones, wine).</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="inter-industry-trade">Inter-Industry Trade</h4>

<ul>
<li><code>Inter-industry trade</code> is the exchange of <strong>completely different types of goods</strong> between countries. It involves trading products from <code>one industry</code> for products from a completely <code>different industry</code>.
<ul>
<li><strong>The Core Driver:</strong> <strong>Comparative Advantage</strong>. Countries export goods that they can produce <code>efficiently</code> (or have an abundance of resources for) and import goods that are costly for them to produce.</li>
<li>Its impact on <code>income distribution</code> is dramatic, polarizing, and creates clear &quot;winners&quot; and &quot;losers.&quot;</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-zJjpfdvo="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="color:#000;" data-marpit-pagination-total="40" data-size="16:9" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-kKLrsYAY="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h5 id="intra-industry-trade">Intra-Industry Trade</h5>

<p><code>Intra-industry</code> trade is the exchange of <strong>similar products within the same industry</strong> between countries. Instead of trading different categories of goods, countries trade varieties of the <code>same category</code>.</p>
<ul>
<li>
<p><strong>The Core Driver:</strong> <strong>Economies of Scale</strong> and <strong>Product Differentiation</strong>. Consumers <code>love variety</code>, and companies need massive markets to produce goods at a low cost. Instead of every country trying to build its own car industry from scratch, countries specialize in <strong>specific types</strong> of cars and trade them.</p>
</li>
<li>
<p>Historically, economists thought intra-industry trade was mostly <code>win-win</code> with few distributional consequences.</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="1-key-assumptions">1. Key Assumptions</h4>

<li><strong>Increasing Returns to Scale</strong> (Economies of Scale): Average cost falls as output increases.</li>
<li><strong>Monopolistic Competition</strong>: Many firms, differentiated products, free entry/exit.</li>
<li><strong>Love of Variety</strong>: Consumers prefer variety (<code>Dixit-Stiglitz</code> preferences).</li>
<li>Countries can have <code>identical technologies</code> and <code>factor endowments</code>.</li>
<li>No trade costs initially (can be added later).</li>
</ul>

<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -1.991ex; display: block; width: 100%; height: auto; max-height: 5.059ex;" xmlns="http://www.w3.org/2000/svg" width="9.123ex" height="5.059ex" role="img" focusable="false" viewBox="0 -1356 4032.6 2236"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z"></path></g><g data-mml-node="mi" transform="translate(750,0)"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g><g data-mml-node="mo" transform="translate(1787.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mfrac" transform="translate(2843.6,0)"><g data-mml-node="mi" transform="translate(220,676)"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 <ul>
<li><code>Larger scale</code> → lower average cost → firms want to <code>produce more</code>.</li>
</ul>
<p>When <code>trade opens</code>:</p>
<ul>
<li><code>Market size increases</code> → firms can sell more → they can lower prices.</li>
<li><code>More varieties</code> become available to consumers.</li>
<li>Some firms exit, survivors produce at larger scale (more efficient).</li>
</ul>

<h5 id="opening-to-trade-%E2%80%93-main-results">Opening to Trade – Main Results</h5>

<p>When <code>two identical countries</code> open to trade. Total number of varieties (firms) in the world increases with trade because the integrated market supports more firms, each producing at larger scale.</p>
<ol>
<li><strong>Market Size Effect</strong>: Each firm now faces a larger market (<code>2L</code> instead of L).</li>
<li><strong>Selection &amp; Scale</strong>: Some firms exit, surviving firms produce the same <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.041ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 460 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45E" d="M33 157Q33 258 109 349T280 441Q340 441 372 389Q373 390 377 395T388 406T404 418Q438 442 450 442Q454 442 457 439T460 434Q460 425 391 149Q320 -135 320 -139Q320 -147 365 -148H390Q396 -156 396 -157T393 -175Q389 -188 383 -194H370Q339 -192 262 -192Q234 -192 211 -192T174 -192T157 -193Q143 -193 143 -185Q143 -182 145 -170Q149 -154 152 -151T172 -148Q220 -148 230 -141Q238 -136 258 -53T279 32Q279 33 272 29Q224 -10 172 -10Q117 -10 75 30T33 157ZM352 326Q329 405 277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q233 26 290 98L298 109L352 326Z"></path></g></g></g></svg></mjx-container> but sell to a bigger market.</li>
<li><strong>Variety Expansion</strong>: Consumers in each country now access <strong>twice</strong> as many varieties (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.489ex" height="1.532ex" role="img" focusable="false" viewBox="0 -666 1100 677"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g><g data-mml-node="mi" transform="translate(500,0)"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> instead of  <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 </ol>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-W3uGU0IQ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h6 id="the-home-market-effect-important-prediction">The Home Market Effect (Important Prediction)</h6>

<p>When countries are <strong>not the same size</strong>:</p>
<ul>
<li>The <strong>larger country</strong> will export more than proportionate share of varieties.</li>
<li>It becomes a net exporter of differentiated goods.</li>
</ul>
<p><strong>Intuition</strong>: <code>Larger</code> domestic market allows firms to <code>cover fixed costs more easily</code> → they become more competitive in exports. This explains why big economies (USA, China, Germany) tend to be major exporters in many manufacturing sectors.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-efrELrWc="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h5 id="4-main-predictions-of-new-trade-theory">4. Main Predictions of New Trade Theory</h5>

<table>
<thead>
<tr>
<th>Prediction</th>
<th>Explanation</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Intra-industry</code> Trade</td>
<td>Countries trade similar goods</td>
</tr>
<tr>
<td><code>Home Market</code> Effect</td>
<td>Larger country exports more varieties</td>
</tr>
<tr>
<td>Trade increases <code>variety</code></td>
<td>Consumers gain from more product varieties</td>
</tr>
<tr>
<td>Gains from Trade</td>
<td>Even <code>without comparative advantage</code></td>
</tr>
<tr>
<td>Possible agglomeration</td>
<td>Firms cluster in larger markets</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-iDDIZVE6="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="16" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h6 id="5-types-of-gains-from-trade">5. Types of Gains from Trade</h6>

<ol>
<li><strong>Variety Gains</strong> — Consumers access more varieties.</li>
<li><strong>Efficiency Gains</strong> — Surviving firms produce at larger scale (lower AC).</li>
<li><strong>Pro-competitive Effect</strong> — Increased competition lowers markups.</li>
<li><strong>Selection Effect</strong> (in heterogeneous firm models) — Only most productive firms survive.</li>
</ol>
<p>These gains are in addition to traditional comparative advantage gains. Even without comparative advantage or differences in factor endowments, trade is mutually beneficial.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-87fvzR6S="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">

<h5 id="7-policy-implications">7. Policy Implications</h5>

<ul>
<li><code>Trade liberalization</code> is generally welfare-enhancing even between <code>similar</code> countries.</li>
<li><code>Large countries</code> have an advantage (Home Market Effect).</li>
<li><code>Protectionism</code> can be strategically used in some cases (strategic trade policy), but risky.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-4BRDDeoL="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<p><strong>Krugman’s theory</strong> remains highly relevant because:</p>

<ul>
<li>Most trade between OECD countries is <strong>intra-industry</strong>.</li>
<li>Global Value Chains combine New Trade Theory (scale + variety) with <code>traditional comparative advantage</code>.</li>
<li>Explains success of export-oriented industrialization in East Asia.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-Dcq1YFh4="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">

<h6 id="consumer-preferences-dixit-stiglitz-utility">Consumer Preferences (Dixit-Stiglitz Utility)</h6>

<h4 id="home-market-effect-hme-%E2%80%93-krugmans-new-trade-theory-ii">Home Market Effect (HME) – Krugman’s New Trade Theory II</h4>

<p>The <strong>Home Market Effect</strong> is one of the most important predictions of <strong>Krugman’s model.</strong> It states that:</p>
<blockquote>
<p>In the presence of economies of scale and <code>trade costs</code>, the <strong>larger country</strong> will export a <strong>more than proportionate</strong> share of differentiated goods relative to its size.</p>
</blockquote>
<p>The country with the <code>larger domestic market</code> tends to become a <strong>net exporter</strong> of manufactured (differentiated) goods.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-wqTJCkYz="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="32" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="1-intuition">1. Intuition</h4>

<ul>
<li>Firms prefer to locate production in the larger market to <code>minimize transport/trade costs</code>.</li>
<li>This gives firms in the large country a <code>cost advantag</code>e (they sell more domestically without trade costs).</li>
<li>As a result, the large country attracts more firms and becomes a net exporter.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h5 id="zero-profit-condition">Zero-Profit Condition</h5>

<p>Then the model typically predicts that Home hosts <strong>more than 60%</strong> of all firms (e.g., 65–70%), making it a clear net exporter. This is called the <strong>magnification effect</strong> — small differences in country size lead to larger differences in industrial location and trade patterns.</p>

<h4 id="6-policy-and-empirical-implications">6. Policy and Empirical Implications</h4>

<ul>
<li>
<p>Explains why big countries (USA, China, Germany) tend to be major exporters in differentiated products.</p>
</li>
<li>
<p>Justifies <strong>industrial policy</strong> and clustering strategies.</p>
</li>
<li>
<p>Stronger when trade costs are moderate (not too high, not zero).</p>
</li>
<li>
<p>One of the foundations of <strong>New Economic Geography</strong> (Krugman, 1991).</p>
</li>
</ul>
