<p>The <strong>Specific Factors Model</strong> (also known as the <strong>Ricardo-Viner model</strong>, developed by Jacob Viner's (1930s) extensions of Ricardo; formally developed by Ronald Jones (1971) and Peter Neary (1978)) bridges the gap between short-run reality and long-run trade theory.  While the Heckscher-Ohlin model assumes all factors are perfectly mobile across sectors, the Specific Factors model recognizes that in the short-to-medium run, capital, land, and specialized equipment are often <code>stuck</code> in particular industries. Only labor (or broadly defined &quot;mobile factors&quot;) can reallocate freely.</p>
<p>The Specific-Factor Model explains why owners of sector-specific capital (e.g., factory owners, farmers, miners) often have strong opinions about trade policy — they gain or lose heavily depending on whether their sector <code>expands</code> or <code>contracts</code>. This shift fundamentally changes trade's <code>distributional politics</code>: winners and losers are determined by sector, not by factor type.</p>

<h4 id="core-assumptions">Core Assumptions</h4>

<table>
<thead>
<tr>
<th>Assumption</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>Two goods (X and Y)</td>
<td>e.g., Manufacturing and Agriculture</td>
</tr>
<tr>
<td><strong>Three factors</strong></td>
<td>Labor (L) + Specific Capital in X (Kx) + Specific Capital in Y (Ky)</td>
</tr>
<tr>
<td>Labor is <strong>mobile</strong> between sectors</td>
<td>Workers can move from one industry to another</td>
</tr>
<tr>
<td>Capital is <strong>specific</strong> (immobile)</td>
<td>Capital is stuck in its sector in the short run</td>
</tr>
<tr>
<td>Constant Returns to Scale</td>
<td>In each sector</td>
</tr>
<tr>
<td>Perfect Competition</td>
<td>In goods and labor markets</td>
</tr>
<tr>
<td>Diminishing Marginal Returns</td>
<td>To labor in each sector (due to fixed specific capital)</td>
</tr>
<tr>
<td>Full employment of all factors</td>
<td>Labor and both specific capitals</td>
</tr>
</tbody>
</table>
<p>Most Important Feature: Labor is the <code>mobile factor</code>, while capital is <code>sector-specific</code>.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="main-mechanism">Main Mechanism</h4>

<h6 id="goods-price-%E2%86%92-factor-price-relationship">Goods Price → Factor Price Relationship</h6>
<ul>
<li>An increase in the <strong>price of a good</strong> benefits the <strong>specific factor</strong> used in that sector <strong>strongly</strong>.</li>
<li>It benefits <strong>labor</strong> (mobile factor) <strong>moderately</strong>, while it <strong>hurts</strong> the specific factor in the <strong>other sector</strong>.</li>
</ul>

<h5 id="key-theorems--policy-implications">Key Theorems &amp; Policy Implications</h5>

<table>
<thead>
<tr>
<th>Result</th>
<th>Implication</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sectoral Distribution</strong></td>
<td>Trade creates winners/losers by industry, not by factor class</td>
</tr>
<tr>
<td><strong>Ambiguous Labor Effect</strong></td>
<td>Workers gain purchasing power for imported goods, lose for exported goods</td>
</tr>
<tr>
<td><strong>Compensation Principle</strong></td>
<td>Aggregate national income rises; gainers could theoretically compensate losers</td>
</tr>
<tr>
<td><strong>Tariff Protection</strong></td>
<td>Shields sector-specific assets from foreign competition; explains industry lobbying</td>
</tr>
<tr>
<td><strong>Short vs Long Run</strong></td>
<td>Short run: specific factors dominate politics. Long run: capital becomes mobile ⇒⇒ H-O/S-S logic applies</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="political-economy-insight">Political Economy Insight:</h4>

<p>The model explains why trade politics often align with <strong>sectoral coalitions</strong> (e.g., steelworkers + steel owners vs. auto workers + auto owners) rather than class-based factor alliances (labor vs. capital). This matches empirical lobbying patterns in the US, EU.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
