<h4 id="key-takeaway">Key Takeaway</h4>

<p>In standard trade theory, <strong>an export subsidy is universally bad for the country that implements it.</strong> It artificially misallocates domestic resources and forces domestic consumers to subsidize foreign buyers.</p>
<p>However, for a <strong>Large Country</strong>, the policy is economically disastrous because it inflicts an extra penalty on itself via the <strong>Terms of Trade effect</strong>. Ironically, while the policy is meant to &quot;help&quot; domestic industries compete globally, it ends up transferring wealth from the subsidizing country's taxpayers directly to foreign consumers who get to buy the good at a discounted world price.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-kJrh8wUE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="41" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h2 id="voluntary-export-restraint">Voluntary Export Restraint</h2>

<p>A <strong>Voluntary Export Restraint (VER)</strong> is a trade restriction where an exporting country <code>voluntarily</code> agrees to <strong>limit the quantity</strong> of a specific good it exports to an importing country.</p>
<ul>
<li><strong>The &quot;Voluntary&quot; Fiction</strong>: It is called <code>voluntary</code> only in a diplomatic sense. In reality, it is almost always imposed under the explicit or implicit threat of harsher, more damaging trade barriers (like punitive tariffs, anti-dumping duties, or strict import quotas) by the importing country. It is a political compromise to avoid a trade war.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-D7eMQAlK="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="42" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="how-it-works-the-mechanism">How It Works (The Mechanism)</h4>

<ol>
<li>The importing country’s domestic industry complains about a surge in imports causing <code>material injury.</code></li>
<li>The importing government threatens to impose strict tariffs or import quotas.</li>
<li>To avoid these harsher measures (and the resulting political friction), the exporting country’s government or industry association agrees to cap its export volume to that specific country.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="43" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/9-6.jpg&quot;);background-size:55%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="43" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="43" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="43" style="color:#000;" data-marpit-pagination-total="61" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-scope-05sTdFvf="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="44" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="economic-impact--welfare-analysis">Economic Impact &amp; Welfare Analysis</h4>

<p>To understand a VER, it is best to compare it to a standard <strong>Import Quota</strong>. Both restrict the quantity of goods, raise the domestic price in the importing country, and protect domestic producers. However, there is one massive economic difference: <strong>Who gets the &quot;Quota Rent&quot;?</strong></p>
<ul>
<li><strong>Quota Rent</strong>: The extra profit made because the restricted supply drives the price up above the free-market world price.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-PxAfJufS="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="45" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<table>
<thead>
<tr>
<th style="text-align:left">Feature</th>
<th style="text-align:left">Standard Import Quota</th>
<th style="text-align:left">Voluntary Export Restraint (VER)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Who restricts the quantity?</strong></td>
<td style="text-align:left">The <strong>importing</strong> country's government.</td>
<td style="text-align:left">The <strong>exporting</strong> country's government/firms.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Who captures the Quota Rent?</strong></td>
<td style="text-align:left">The <strong>importing</strong> country (via auctioning import licenses, or domestic importers who buy low and sell high).</td>
<td style="text-align:left">The <strong>exporting</strong> country's firms/government. They sell fewer units, but at a much higher price, keeping the extra profit.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Impact on Importing Country Welfare</strong></td>
<td style="text-align:left"><strong>Net Loss</strong> (Consumer loss &gt; Producer gain + Gov revenue).</td>
<td style="text-align:left"><strong>Larger Net Loss</strong> (Consumer loss &gt; Producer gain + <em>Zero</em> Gov revenue).</td>
</tr>
<tr>
<td style="text-align:left"><strong>Impact on Exporting Country</strong></td>
<td style="text-align:left">Generally negative (they lose market share and get no rent).</td>
<td style="text-align:left"><strong>Potentially Positive</strong> for exporters (they lose volume but gain massive profit margins per unit due to the higher price and captured rent).</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-scope-F0bYHzNj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="46" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="summary-of-welfare">Summary of Welfare:</h4>

<ul>
<li><strong>Importing Country Consumers</strong>: Lose (pay higher prices).</li>
<li><strong>Importing Country Producers</strong>: Gain (face less competition, can raise their own prices).</li>
<li><strong>Importing Country Government</strong>: Gets <strong>zero revenue</strong> (unlike a tariff).</li>
<li><strong>Exporting Country Producers</strong>: Often <strong>gain</strong> because the higher price more than compensates for the lower volume, and they capture the quota rent.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-vPsHI3H7="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="47" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h6 id="the-classic-real-world-case-study-us-japan-auto-ver-1981%E2%80%931994">The Classic Real-World Case Study: US-Japan Auto VER (1981–1994)</h6>

<ul>
<li>
<p><strong>The Context</strong>: In the late 1970s and early 1980s, fuel-efficient Japanese cars flooded the US market, threatening the &quot;Big Three&quot; US automakers (GM, Ford, Chrysler) and causing massive job losses in the US Midwest.</p>
</li>
<li>
<p><strong>The VER</strong>: Under pressure from the US government, Japan <code>voluntarily</code> agreed in 1981 to limit its automobile exports to the US to 1.68 million vehicles per year.</p>
</li>
<li>
<p>The Unintended Consequences:</p>
<ol>
<li><strong>Quota Rents</strong>: Japanese automakers (Toyota, Honda, Nissan) simply raised the prices of the cars they <em>did</em> export. They made record profits per vehicle, capturing the quota rent.</li>
<li><strong>Moving Upmarket</strong>: Since they could only sell a limited number of cars, they shifted their export mix from cheap, low-margin economy cars to expensive, high-margin luxury cars (this directly led to the creation of Acura, Lexus, and Infiniti).</li>
<li><strong>Foreign Direct Investment (FDI)</strong>: To bypass the export limit entirely, Japanese companies built massive manufacturing plants <em>inside</em> the United States (e.g., Honda in Ohio, Toyota in Kentucky), creating US jobs but permanently altering the US auto landscape.</li>
</ol>
</li>
<li>
<p><strong>The Result</strong>: The VER failed to save the US auto industry in the long run, enriched Japanese automakers, and accelerated the globalization of car manufacturing</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-marpit-scope-Umqo8l4O="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="48" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h5 id="key-takeaways-1">Key Takeaways</h5>

<ol>
<li>A VER is a <strong>quantity restriction</strong> disguised as a cooperative agreement.</li>
<li>It is economically <strong>worse for the importing country</strong> than a tariff, because the importing government collects no revenue; the extra profit (quota rent) is handed directly to the foreign exporter.</li>
<li>It often triggers <strong>strategic responses</strong> from exporters, such as upgrading product quality (moving up the value chain) or building factories inside the importing country (FDI) to bypass the restriction.</li>
<li>They are now <strong>prohibited under WTO rules</strong>, having been replaced by more transparent (though still controversial) safeguard mechanisms.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-scope-nC6Nxaby="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="49" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h2 id="local-content-requirement">Local Content Requirement</h2>

<p>A <strong>Local Content Requirement</strong> is a trade and investment policy that mandates a specific percentage of a product’s value, weight, or components must be sourced, manufactured, or assembled <strong>domestically</strong> within the importing country. It is a classic form of <strong>&quot;New Protectionism&quot;</strong> and a &quot;behind-the-border&quot; measure. Instead of taxing imports at the border (like a tariff), it dictates <em>how</em> and <em>where</em> a product must be made to qualify for market access or government benefits.</p>
<p><strong>Example</strong>: A government might rule that to be sold as a <code>domestic</code> vehicle, or to qualify for a government subsidy, at least 60% of the car's components (by value) must be manufactured within the country's borders.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-scope-CohFgXzQ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="50" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<p>Governments implement LCRs to achieve <code>specific industrial and political goals</code>:</p>

<ol>
<li><strong>Job Creation</strong>: Forcing foreign companies to build factories and hire local workers.</li>
<li><strong>Technology Transfer</strong>: Compelling foreign firms to partner with local suppliers, theoretically helping domestic firms learn advanced manufacturing techniques.</li>
<li><strong>Supply Chain Resilience / National Security</strong>: Reducing reliance on foreign suppliers for critical goods (e.g., semiconductors, pharmaceuticals, green energy tech).</li>
<li><strong>Infant Industry Protection</strong>: Giving nascent domestic industries a guaranteed customer base so they can achieve economies of scale and eventually compete globally.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-scope-TBP5ozo7="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="51" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="economic-impact--welfare-analysis-1">Economic Impact &amp; Welfare Analysis</h4>

<p>While LCRs benefit specific domestic industries, economists generally view them as highly inefficient. They distort global supply chains and create <strong>Deadweight Loss (DWL)</strong>.</p>
<ul>
<li><strong>Domestic Component Suppliers</strong>: <strong>Win</strong>. They gain a guaranteed, protected market and can often charge higher prices because foreign competition is artificially restricted.</li>
<li><strong>Downstream Domestic Industries (e.g., automakers, solar installers)</strong>: <strong>Lose</strong>. They are forced to buy more expensive or lower-quality local inputs instead of cheaper, better global alternatives. This makes their final products less competitive globally.</li>
<li><strong>Domestic Consumers</strong>: <strong>Lose</strong>. They face higher prices for final goods (e.g., more expensive cars or electronics) due to the inflated cost of local inputs.</li>
<li><strong>Foreign Exporters</strong>: <strong>Lose</strong>. They lose market share unless they make the costly decision to relocate their production facilities (Foreign Direct Investment) to the host country.</li>
<li><strong>Net National Welfare</strong>: <strong>Decreases</strong>. The gains to the protected domestic suppliers are outweighed by the losses to downstream industries, consumers, and the overall efficiency of the economy.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-marpit-scope-URUlpspJ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="52" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="case-1-the-us-inflation-reduction-act-ira-and-evs-2022%E2%80%93present">Case 1: The US Inflation Reduction Act (IRA) and EVs (2022–Present)</h4>

<ul>
<li><strong>The Policy</strong>: To qualify for the $7,500 federal tax credit for Electric Vehicles (EVs), the vehicle must undergo final assembly in North America, and an increasing percentage of the battery’s critical minerals and components must be extracted, processed, or manufactured in the US or a US free-trade partner.</li>
<li><strong>The Impact</strong>: This acts as a massive <em>de facto</em> LCR. It has triggered a boom in domestic battery plant construction (e.g., by Hyundai, LG, Panasonic). However, it has also drawn complaints from the EU and South Korea, who argue it discriminates against their established battery supply chains and violates the spirit of free trade.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-marpit-scope-9eKTDTjE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="53" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="case-2-indias-solar-power-mission">Case 2: India’s Solar Power Mission</h4>

<ul>
<li><strong>The Policy</strong>: India has periodically mandated that government-backed solar power projects must use solar cells and modules manufactured domestically.</li>
<li><strong>The Impact</strong>: While it helped build a local solar manufacturing base, it initially slowed down India’s renewable energy deployment because domestic panels were more expensive and less efficient than imported Chinese panels. The US successfully challenged an earlier version of this policy at the WTO, arguing it violated the TRIMs agreement.</li>
</ul>
<h4 id="case-3-buy-american-acts">Case 3: &quot;Buy American&quot; Acts</h4>
<ul>
<li><strong>The Policy</strong>: US federal law requires that a certain percentage of the cost of components for goods purchased by the US government must be of US origin (currently phased up to 75% by 2029).</li>
<li><strong>The Impact</strong>: This guarantees a market for US manufacturers in public procurement (infrastructure, defense, government vehicles), but it raises the cost of public projects for taxpayers.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-marpit-scope-2bCO08jL="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="54" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="key-takeaways-2">Key Takeaways</h4>

<ol>
<li><strong>LCRs are a tool of Industrial Policy</strong>: They are less about &quot;protecting&quot; an industry from imports and more about actively &quot;building&quot; a domestic supply chain from scratch.</li>
<li><strong>They are economically inefficient</strong>: They force companies to prioritize <em>geography</em> over <em>efficiency</em>, leading to higher costs and lower-quality goods for consumers and downstream industries.</li>
<li><strong>They provoke retaliation</strong>: Because they explicitly discriminate against foreign goods, they frequently trigger WTO disputes or retaliatory subsidies from trading partners (e.g., the EU’s response to the US IRA with its own Green Deal Industrial Plan).</li>
<li><strong>They represent the shift to &quot;New Protectionism&quot;</strong>: As traditional tariffs have fallen, LCRs and domestic subsidies have become the primary way governments shape global trade flows to serve national security and geopolitical goals.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-scope-HpmwKvj7="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="55" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h2 id="carbon-border-adjustment-mechanism-cbam">Carbon Border Adjustment Mechanism (CBAM)</h2>

<p>The <strong>Carbon Border Adjustment Mechanism (CBAM)</strong> is a climate-trade policy tool introduced by the <strong>European Union</strong>. It puts a carbon price on imports of carbon-intensive goods to prevent <strong>carbon leakage</strong> — where companies move production to countries with weaker climate policies or where high-carbon imports undercut EU producers who pay for emissions under the EU Emissions Trading System (ETS).</p>
<ul>
<li>Transitional phase started October 2023; full implementation from 2026 onward.</li>
<li>Other countries (e.g., UK, Canada, US proposals) are considering similar mechanisms.</li>
</ul>
<p><strong>Rationale</strong>: Levels the playing field for climate policy and encourages global decarbonization.</p>
<p><strong>Criticism</strong>: Developing countries see it as &quot;green protectionism&quot; that penalizes nations with lower carbon prices.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-marpit-scope-vyYWNHgF="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="56" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="key-features">Key Features:</h4>

<ul>
<li>
<p>It is often described as a <strong>&quot;carbon border tax&quot;</strong>. Applies to specific sectors: cement, iron &amp; steel, aluminum, fertilizers, electricity, hydrogen (and some downstream products).</p>
</li>
<li>
<p><strong>Transitional phase</strong> (2023–2025): Only reporting of embedded emissions.</p>
</li>
<li>
<p><strong>Definitive regime</strong>: Started <strong>1 January 2026</strong> — importers must buy and surrender <strong>CBAM certificates</strong> for the embedded greenhouse gas emissions in imported goods.</p>
</li>
<li>
<p>tCO₂e (Tonnes of Carbon Dioxide Equivalent): A measure of carbon dioxide equivalent in tonnes. It includes not only carbon dioxide (CO₂) but also converts other greenhouse gases, such as methane (CH₄) and nitrous oxide (N₂O), into an equivalent weight of CO₂ based on their &quot;Global Warming Potential (GWP).&quot;</p>
<ul>
<li>tCO₂e (Tonnes of Carbon Dioxide Equivalent)：二氧化碳當量噸。它不僅包含二氧化碳（CO₂），還將甲烷（CH₄）、氧化亞氮（N₂O）等其他溫室氣體，根據其“全球變暖潛能值（GWP）”折算成等效的二氧化碳重量。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-marpit-scope-MQG899mu="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="57" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="main-goals">Main Goals:</h4>

<ol>
<li>Level the playing field between EU producers (who pay ETS carbon price) and foreign producers.</li>
<li>Encourage cleaner production methods globally.</li>
<li>Generate revenue for the EU (though not the primary goal).</li>
</ol>
<p><strong>How it Works</strong>: Importers report <strong>embedded emissions</strong> (direct + indirect) and purchase CBAM certificates at a price linked to the weekly/quarterly average <strong>EU ETS allowance price</strong>.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-scope-xKNVQfuZ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="58" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">

<h6 id="market-effects-partial-equilibrium">Market Effects (Partial Equilibrium):</h6>

<ul>
<li>Increases cost of high-carbon imports → shifts foreign supply curve upward.</li>
<li>Domestic price in EU may rise slightly.</li>
<li>Encourages foreign producers to decarbonize or invest in carbon pricing to reduce CBAM liability.</li>
</ul>
<h6 id="welfare--trade-effects">Welfare &amp; Trade Effects:</h6>
<ul>
<li><strong>Positive</strong>: Reduces carbon leakage, promotes global decarbonization.</li>
<li><strong>Negative</strong>: Increases costs for importers and downstream industries, potential trade tensions (especially with developing countries), possible retaliation.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
