<p><strong>Wen-Bin Chuang</strong><br />

<p><strong>Non-Tariff Measures (NTMs)</strong> are all policy measures <code>other than tariffs</code> that can affect international trade. They are now more important than tariffs in most developed and many developing countries.</p>
<h6 id="main-categories">Main Categories:</h6>
<h6 id="unctad-classification-of-non-tariff-measures-ntms-into-16-categories">UNCTAD classification of Non-Tariff Measures (NTMs) into 16 categories</h6>
<table>
<thead>
<tr>
<th>Group</th>
<th>Chapters</th>
<th>Simplified Content</th>
<th><strong>Direction</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>技術性貿易措施</strong> <em>(共 3 大類)</em></td>
<td><strong>A, B, C</strong></td>
<td><strong>A</strong>: 衛生與植物檢疫 (<code>SPS</code>) <strong>B</strong>: 技術性貿易障礙 (<code>TBT</code>) <strong>C</strong>: 裝船前檢驗及其他手續(<code>PSI</code>)</td>
<td>進口</td>
</tr>
<tr>
<td><strong>非技術性貿易措施</strong> <em>(共 12 大類)</em></td>
<td><strong>D ~ O</strong></td>
<td><strong>D</strong>: 貿易救濟 (如反傾銷) <strong>E</strong>: 許可、配額、禁止 <strong>F</strong>: 價格控制 <strong>G</strong>: 財務措施 <strong>H</strong>: 競爭措施 <strong>I</strong>: 投資相關措施 <strong>J</strong>: 分銷限制 <strong>K</strong>: 售後服務限制 <strong>L</strong>: 補貼 <strong>M</strong>: 政府採購 <strong>N</strong>: 智慧財產權 <strong>O</strong>: 原產地規則</td>
<td>進口</td>
</tr>
<tr>
<td><strong>與出口有關的措施</strong> <em>(共 1 大類)</em></td>
<td><strong>P</strong></td>
<td><strong>P</strong>: 出口措施 (如出口稅、出口限制)</td>
<td>出口</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>SPS</strong>: Must be based on scientific risk assessment; <strong>TBT</strong>: Must not be more trade-restrictive than necessary.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h2 id="import-quota">(Import) Quota</h2>

<p>An <strong>import quota</strong> is a <strong>direct quantitative restriction</strong> on the amount (or value) of a particular good that can be imported into a country during a specified period.</p>
<h3 id="types-of-quotas"><strong>Types of Quotas:</strong></h3>
<ol>
<li>
<p><strong>Absolute Quota</strong>: A <code>fixed limit</code> on the <code>quantity</code> of imports (e.g., &quot;only 1 million tons of sugar may be imported this year&quot;)</p>
</li>
<li>
<p><strong>Tariff-Rate Quota (TRQ)</strong>:</p>
<ul>
<li>A <code>lower tariff</code> is applied to imports up to a <code>specified quantity</code></li>
<li>A <code>higher tariff</code> is applied to imports <code>exceeding that quantity</code>
<ul>
<li>Example: First 10,000 tons imported at 5% tariff; anything above that at 50% tariff</li>
</ul>
</li>
</ul>
</li>
<li>
<p><strong>Voluntary Export Restraint (VER)</strong>: A quota imposed by the exporting country (discussed later)</p>
</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-n1hYo6jL="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h6 id="price-effect">Price Effect:</h6>
<ul>
<li>The restricted supply causes the <strong>domestic price to rise</strong> above the world price</li>
<li>The difference between domestic price (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>) and world price (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.32ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1467.6 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g><g data-mml-node="mo" transform="translate(1078.6,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container> is called the <strong>quota rent</strong></li>
</ul>
<h6 id="quantity-effect">Quantity Effect:</h6>
<ul>
<li><strong>Domestic production increases</strong> (protected producers supply more)</li>
<li><strong>Domestic consumption decreases</strong> (higher prices reduce demand)</li>
<li><strong>Imports are limited</strong> to the quota amount</li>
</ul>
<h6 id="welfare-effects">Welfare Effects:</h6>
<ul>
<li><strong>Consumer Surplus</strong>: ↓ Decreases (consumers pay higher prices)</li>
<li><strong>Producer Surplus</strong>: ↑ Increases (domestic producers benefit)</li>
<li><strong>Quota Rent</strong>: ? Depends on who receives it (see below)</li>
<li><strong>Net National Welfare</strong>: ↓ Decreases (deadweight loss)</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-cM9dmilX="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="the-small-country-case">The Small Country Case</h4>

<p>Imagine a <code>standard supply and demand</code> graph where the world price is <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.375ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.92ex" role="img" focusable="false" viewBox="0 -683 1078.6 848.6"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></g></svg></mjx-container>. When the <code>quota</code> is applied, the domestic price rises to a higher price, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>. The areas between these two price lines are divided into four sections: <strong>a, b, c, and d</strong>.</p>
<table>
<thead>
<tr>
<th>Group</th>
<th>Change in Surplus</th>
<th>Economic Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Consumers</strong> (The Losers)</td>
<td><strong>– (a + b + c + d)</strong></td>
<td>Pay higher prices and buy less. Total loss of consumer surplus.</td>
</tr>
<tr>
<td><strong>Domestic Producers</strong> (The Winners)</td>
<td><strong>+ a</strong></td>
<td>Sell more goods at the higher protected domestic price.</td>
</tr>
<tr>
<td><strong>Quota License Holders</strong> (The Winners)</td>
<td><strong>+ c</strong></td>
<td>Earn &quot;Quota Rents&quot; by buying at the low world price and selling at the high domestic price.</td>
</tr>
<tr>
<td><strong>Net National Welfare</strong> (The Society)</td>
<td><strong>– (b + d)</strong></td>
<td><strong>Deadweight Loss.</strong> • <strong>b</strong>: Production inefficiency (wasting resources on high-cost domestic production). • <strong>d</strong>: Consumption inefficiency (consumers priced out of the market).</td>
</tr>
</tbody>
</table>
<p><strong>Summary Equation:</strong><br />
Net Welfare = (Gain to Producers) + (Gain to License Holders) – (Loss to Consumers)<br />
Net Welfare = (+a) + (+c) – (a + b + c + d) = <strong>– (b + d)</strong></p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h6 id="what-do-the-deadweight-loss-areas-b--d-actually-mean">What do the Deadweight Loss areas (b + d) actually mean?</h6>

<ul>
<li><strong>Area (b) is the Production Distortion:</strong> This is the cost of <code>inefficient domestic production</code>. The country is forcing its <code>own high-cost producers</code> to make goods that could have been bought cheaper from the rest of the world. It is a waste of national resources.</li>
<li><strong>Area (d) is the Consumption Distortion:</strong> This is the loss of <code>consumer satisfaction</code>. Because the price is artificially high, consumers are buying less of the good than they actually want to at the true global price.</li>
</ul>
<p><strong>Summary:</strong> In a <code>small country</code>, an import quota simply transfers wealth <strong>from consumers to producers</strong> (<strong>a</strong>) and <strong>license holders</strong> (<strong>c</strong>), but it permanently destroys national wealth in the process (<strong>b + d</strong>).</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

er class="MathJax" jax="SVG"><svg style="vertical-align: -0.355ex;" xmlns="http://www.w3.org/2000/svg" width="2.472ex" height="1.901ex" role="img" focusable="false" viewBox="0 -683 1092.7 840.1"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mi" transform="translate(675,-150) scale(0.707)"><path data-c="1D451" d="M366 683Q367 683 438 688T511 694Q523 694 523 686Q523 679 450 384T375 83T374 68Q374 26 402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487H491Q506 153 506 145Q506 140 503 129Q490 79 473 48T445 8T417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157Q33 205 53 255T101 341Q148 398 195 420T280 442Q336 442 364 400Q369 394 369 396Q370 400 396 505T424 616Q424 629 417 632T378 637H357Q351 643 351 645T353 664Q358 683 366 683ZM352 326Q329 405 277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q233 26 290 98L298 109L352 326Z"></path></g></g></g></g></svg></mjx-container>). The difference is the Quota Rent (Area <strong>c</strong>).</td>

<tr>
<td><strong>Net National Welfare</strong></td>
<td><strong>c – b</strong></td>
<td><strong>Terms of Trade Gain (c)</strong> minus <strong>Deadweight Loss (b)</strong>.</td>

<p>To find the net effect on the <code>importing country</code>, we add the winners and subtract the losers:</p>
<ul>
<li><strong>Net Welfare</strong> = (Gain to Producers) + (Gain to License Holders) – (Loss to Consumers)</li>
<li><strong>Net Welfare</strong> = (+a) + (+c) – (a + b + c) = <strong>c – b</strong></li>
</ul>

<li><strong>Area (b) is the Deadweight Loss:</strong> The <code>efficiency loss</code> from consuming less than the free-trade amount (the triangle under <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="4.549ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 2010.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D437" d="M287 628Q287 635 230 637Q207 637 200 638T193 647Q193 655 197 667T204 682Q206 683 403 683Q570 682 590 682T630 676Q702 659 752 597T803 431Q803 275 696 151T444 3L430 1L236 0H125H72Q48 0 41 2T33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM703 469Q703 507 692 537T666 584T629 613T590 629T555 636Q553 636 541 636T512 636T479 637H436Q392 637 386 627Q384 623 313 339T242 52Q242 48 253 48T330 47Q335 47 349 47T373 46Q499 46 581 128Q617 164 640 212T683 339T703 469Z"></path></g><g data-mml-node="TeXAtom" transform="translate(861,-150) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D43C" d="M43 1Q26 1 26 10Q26 12 29 24Q34 43 39 45Q42 46 54 46H60Q120 46 136 53Q137 53 138 54Q143 56 149 77T198 273Q210 318 216 344Q286 624 286 626Q284 630 284 631Q274 637 213 637H193Q184 643 189 662Q193 677 195 680T209 683H213Q285 681 359 681Q481 681 487 683H497Q504 676 504 672T501 655T494 639Q491 637 471 637Q440 637 407 634Q393 631 388 623Q381 609 337 432Q326 385 315 341Q245 65 245 59Q245 52 255 50T307 46H339Q345 38 345 37T342 19Q338 6 332 0H316Q279 2 179 2Q143 2 113 2T65 2T43 1Z"></path></g><g data-mml-node="mi" transform="translate(504,0)"><path data-c="1D440" d="M289 629Q289 635 232 637Q208 637 201 638T194 648Q194 649 196 659Q197 662 198 666T199 671T201 676T203 679T207 681T212 683T220 683T232 684Q238 684 262 684T307 683Q386 683 398 683T414 678Q415 674 451 396L487 117L510 154Q534 190 574 254T662 394Q837 673 839 675Q840 676 842 678T846 681L852 683H948Q965 683 988 683T1017 684Q1051 684 1051 673Q1051 668 1048 656T1045 643Q1041 637 1008 637Q968 636 957 634T939 623Q936 618 867 340T797 59Q797 55 798 54T805 50T822 48T855 46H886Q892 37 892 35Q892 19 885 5Q880 0 869 0Q864 0 828 1T736 2Q675 2 644 2T609 1Q592 1 592 11Q592 13 594 25Q598 41 602 43T625 46Q652 46 685 49Q699 52 704 61Q706 65 742 207T813 490T848 631L654 322Q458 10 453 5Q451 4 449 3Q444 0 433 0Q418 0 415 7Q413 11 374 317L335 624L267 354Q200 88 200 79Q206 46 272 46H282Q288 41 289 37T286 19Q282 3 278 1Q274 0 267 0Q265 0 255 0T221 1T157 2Q127 2 95 1T58 0Q43 0 39 2T35 11Q35 13 38 25T43 40Q45 46 65 46Q135 46 154 86Q158 92 223 354T289 629Z"></path></g></g></g></g></g></svg></mjx-container> ).</li>
<li><strong>Area (c) is the Terms of Trade Gain:</strong> Because the <code>country is big</code>, it forced foreign exporters to lower their price from <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.375ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.92ex" role="img" focusable="false" viewBox="0 -683 1078.6 848.6"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></g></svg></mjx-container> to <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>. The country is now buying its imports cheaper on the global market.</li>
</ol>
<p><strong>The Final Verdict for the Big Country:</strong></p>
<ul>
<li>If <strong>c &gt; b</strong> (The <code>Terms of Trade Gain</code> is larger than the Deadweight Loss), the big country actually <strong>gains</strong> overall national welfare from the quota! (This is the logic behind the &quot;Optimal Tariff/Quota&quot; argument).</li>
<li>If <strong>b &gt; c</strong>, the country suffers a net loss.</li>
</ul>

<h4 id="the-equivalence-of-tariff-and-quota">The Equivalence of Tariff and Quota</h4>
<h6 id="the-key-theorem">The Key Theorem:</h6>

<p><strong>Under certain conditions, a tariff and a quota can be economically equivalent</strong> — meaning they produce <code>identical effects</code> on: <strong>Domestic price</strong>; <strong>Domestic production</strong>, <strong>Domestic consumption</strong>, <strong>Import volume</strong>, Overall welfare</p>
<h6 id="conditions-for-equivalence-a-tariff-and-quota-are-equivalent-when">Conditions for Equivalence: A tariff and quota are equivalent when:</h6>
<ol>
<li><strong>The importing government auctions the quota licenses</strong> to the highest bidders (rather than giving them away)</li>
<li><strong>Perfect competition</strong> exists in both domestic and import markets</li>
<li><strong>No uncertainty</strong> about market conditions (demand and supply are stable and known)</li>
<li><strong>The quota is set at the exact level</strong> that would be imported under the tariff</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-56NEgZw0="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h6 id="how-the-equivalence-works">How the Equivalence Works:</h6>

<p><strong>Scenario</strong>: World price = $100 per unit</p>
<h6 id="option-a-20-tariff">Option A: $20 Tariff</h6>
<ul>
<li>Domestic price = $120, Imports = 1 million units</li>
<li>Government revenue = $20 × 1 million = $20 million</li>
</ul>
<h6 id="option-b-1-million-unit-quota-with-auctioned-licenses">Option B: 1 Million Unit Quota (with auctioned licenses)</h6>
<ul>
<li>Restricted supply drives domestic price to $120</li>
<li>Imports = 1 million units (quota limit), Quota rent per unit = $120 - $100 = $20</li>
<li>Government revenue from auction = $20 × 1 million = $20 million</li>
</ul>
<p><strong>Result</strong>: <strong>Identical outcomes</strong> in price, quantity, and government revenue.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-iVHoqNeF="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="when-tariff-and-quota-are-not-equivalent">When Tariff and Quota Are NOT Equivalent</h4>

<p>The equivalence <strong>breaks down</strong> under several important conditions:</p>
<h4 id="1-who-gets-the-quota-rent">1. Who Gets the Quota Rent?</h4>
<table>
<thead>
<tr>
<th>Quota License Allocation</th>
<th>Who Gets the Rent?</th>
<th>Equivalence to Tariff?</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Government auctions licenses</strong></td>
<td>Government</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>YES</strong> (identical to tariff)</td>
</tr>
<tr>
<td><strong>Given to domestic importers</strong></td>
<td>Domestic importers</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>NO</strong> (importers gain, not government)</td>
</tr>
<tr>
<td><strong>Given to foreign exporters</strong> (VER)</td>
<td>Foreign exporters</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>NO</strong> (worst for importing country)</td>
</tr>
</tbody>
</table>
<p><strong>Key Point</strong>: Only when the government <code>captures the quota rent</code> through competitive auction does the quota equal a tariff.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-rzTC7Sdw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="2-market-structure-monopoly-vs-competition">2. Market Structure: Monopoly vs. Competition</h4>

<p><strong>Under Monopoly:</strong></p>
<ul>
<li><strong>Tariff</strong>: The monopolist still faces competition from imports at <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.357ex;" xmlns="http://www.w3.org/2000/svg" width="2.786ex" height="1.902ex" role="img" focusable="false" viewBox="0 -683 1231.3 840.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mi" transform="translate(675,-150) scale(0.707)"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g></g></g></g></svg></mjx-container> + tariff, limiting their pricing power</li>
<li><strong>Quota</strong>: The monopolist faces a fixed import quantity, giving them <strong>more market power</strong> to raise prices above the tariff-equivalent level</li>
</ul>
<p><strong>Result</strong>: <strong>Quota is more restrictive</strong> than an equivalent tariff under monopoly conditions.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-ZzZbZLNK="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="3-uncertainty-and-market-fluctuations">3. Uncertainty and Market Fluctuations</h4>

<p><strong>Under a Tariff:</strong></p>
<ul>
<li>If domestic demand increases → <strong>Imports increase</strong> (price stays at <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.357ex;" xmlns="http://www.w3.org/2000/svg" width="2.786ex" height="1.902ex" role="img" focusable="false" viewBox="0 -683 1231.3 840.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mi" transform="translate(675,-150) scale(0.707)"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g></g></g></g></svg></mjx-container> + tariff)</li>
<li>The tariff provides <strong>price certainty</strong> but <strong>quantity flexibility</strong></li>
</ul>
<p><strong>Under a Quota:</strong></p>
<ul>
<li>If domestic demand increases → <strong>Domestic price rises</strong> (imports stay fixed at quota)</li>
<li>The quota provides <strong>quantity certainty</strong> but <strong>price volatility</strong></li>
</ul>
<p><strong>Example</strong>:</p>
<ul>
<li>Demand surge: Under a quota, prices can spike dramatically because imports cannot increase</li>
<li>Demand collapse: Under a quota, prices may fall less because the quota prevents import competition from increasing.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-rNpxHAU3="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="4-administrative-differences">4. Administrative Differences</h4>

<table>
<thead>
<tr>
<th>Feature</th>
<th>Tariff</th>
<th>Quota</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Administration</strong></td>
<td>Simple (collect at border)</td>
<td>Complex (allocate licenses, monitor compliance)</td>
</tr>
<tr>
<td><strong>Transparency</strong></td>
<td>Clear and visible</td>
<td>Often opaque, subject to corruption</td>
</tr>
<tr>
<td><strong>Revenue</strong></td>
<td>Automatic government revenue</td>
<td>Only if licenses are auctioned</td>
</tr>
<tr>
<td><strong>Flexibility</strong></td>
<td>Easy to adjust rates</td>
<td>Difficult to change quota levels</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-hZcD7gxw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="key-takeaways">Key Takeaways</h4>

<ol>
<li>
<p><strong>Equivalence Condition</strong>: A tariff and quota are economically equivalent <strong>only if</strong> the government <code>auctions the quota licenses</code> and captures the quota rent.</p>
</li>
<li>
<p><strong>Quota Rent Matters</strong>: Who receives the quota rent determines whether the quota is better or worse than a tariff for the importing country.</p>
</li>
<li>
<p>Flexibility vs. Certainty:</p>
<ul>
<li>Tariffs provide <strong>price certainty</strong> but <strong>quantity flexibility</strong></li>
<li>Quotas provide <strong>quantity certainty</strong> but <strong>price volatility</strong></li>
</ul>
</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-lRyIibRD="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<ol start="4">
<li>
<p><strong>Market Structure</strong>: Quotas are more restrictive than tariffs under monopoly conditions.</p>
</li>
<li>
<p><strong>VERs Are Worst</strong>: When quota rents go to foreign exporters (VER), the importing country suffers the maximum welfare loss.</p>
</li>
<li>
<p>Policy Preference: Economists generally prefer tariffs over quotas  because they are:</p>
<ul>
<li>More transparent, Easier to administer, Generate automatic government revenue</li>
<li>Allow market flexibility, Less prone to corruption</li>
</ul>
</li>
<li>
<p><strong>WTO Rules</strong>: Quotas are generally prohibited under WTO rules (except in specific circumstances), while tariffs are the preferred and legal form of protection.</p>
</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-C6spxA53="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="24" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h2 id="dumping-and-anti-dumping">Dumping and Anti-Dumping</h2>

<p><strong>Dumping</strong> occurs when a company exports a product to a foreign country at a price that is <strong>lower than its &quot;normal value.&quot;</strong> <code>Normal value</code> usually means either:</p>
<ul>
<li>The price the company charges for the same product in its own home market, <code>OR</code></li>
<li>The actual cost of producing the product.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-MNT86CZw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="why-do-companies-do-it">Why do companies do it?</h4>

<ul>
<li><strong>To clear inventory:</strong> Selling off excess stock abroad without lowering prices at home.</li>
<li><strong>To gain market share:</strong> Offering a temporarily low price to attract foreign customers.</li>
<li><strong>Predatory pricing (The harmful kind):</strong> Selling below cost to drive local competitors out of business, with the intention of raising prices later once a monopoly is established.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/9-3.jpg&quot;);background-size:85%;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="26" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9" data-marpit-advanced-background="content"><footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="color:#000;" data-marpit-pagination-total="61" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-YEES8zoO="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<p><strong>Anti-dumping (AD)</strong> is the legal response by a government to <code>protect its domestic industries</code> from the harmful effects of dumping. If a country proves that dumping is happening, it can impose an <strong>Anti-Dumping Duty</strong>—which is essentially an extra, <code>punitive tariff</code> on that <code>specific</code> imported product. The goal is to <code>raise the import price</code> back to its <strong>fair level</strong>, leveling the playing field for domestic producers. Under World Trade Organization (WTO) rules, a government cannot just slap an anti-dumping tariff on a whim. It must prove <strong>all three</strong> of the following conditions:</p>
<ol>
<li><strong>Proof of Dumping:</strong> The government must calculate a <code>dumping margin</code> (the difference between the export price and the normal home-market price or cost of production).</li>
<li><strong>Proof of Material Injury:</strong> The domestic industry must show it is suffering real harm (e.g., lost sales, shrinking market share, factory closures, or job losses).</li>
<li><strong>Causal Link:</strong> The government must prove that the <em>dumping</em> is the direct cause of the <em>injury</em>. (If the domestic industry is failing due to bad management or a recession, anti-dumping duties are not allowed).</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-7Mwksomx="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="the-big-controversy-fair-defense-or-disguised-protectionism">The Big Controversy: Fair Defense or Disguised Protectionism?</h4>

<p>While anti-dumping rules were designed to stop unfair corporate trade behavior, they are now the <strong>most frequently used tool of &quot;New Protectionism.&quot;</strong></p>
<ul>
<li><strong>The Criticism:</strong> Anti-dumping investigations are complex, expensive, and easily manipulated. Domestic industries often use them as a weapon to <code>block foreign competition</code>, even when the foreign country is just naturally more efficient.</li>
<li><strong>The Collateral Damage:</strong> While anti-dumping duties might save jobs in one industry (e.g., domestic steel producers), they raise costs for downstream industries that rely on those materials (e.g., domestic car manufacturers or construction companies), and they force local consumers to pay higher prices.</li>
</ul>
<p><strong>In short:</strong> Dumping is a corporate pricing strategy. Anti-dumping is the government's regulatory shield against it, though that shield is often used as a sword for modern protectionism.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-sDp0CJu6="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h2 id="export-subsidy-trade-policy">Export-Subsidy Trade Policy</h2>

<p>An <strong>export subsidy</strong> is a payment (usually <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.023ex;" xmlns="http://www.w3.org/2000/svg" width="1.061ex" height="1.023ex" role="img" focusable="false" viewBox="0 -442 469 452"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D460" d="M131 289Q131 321 147 354T203 415T300 442Q362 442 390 415T419 355Q419 323 402 308T364 292Q351 292 340 300T328 326Q328 342 337 354T354 372T367 378Q368 378 368 379Q368 382 361 388T336 399T297 405Q249 405 227 379T204 326Q204 301 223 291T278 274T330 259Q396 230 396 163Q396 135 385 107T352 51T289 7T195 -10Q118 -10 86 19T53 87Q53 126 74 143T118 160Q133 160 146 151T160 120Q160 94 142 76T111 58Q109 57 108 57T107 55Q108 52 115 47T146 34T201 27Q237 27 263 38T301 66T318 97T323 122Q323 150 302 164T254 181T195 196T148 231Q131 256 131 289Z"></path></g></g></g></svg></mjx-container> per unit) given by the government to a firm for every unit of a good it <code>exports</code>. To understand the impact, we must first look at the <strong>Arbitrage Condition</strong>: A producer will only sell a good in the domestic market if the domestic price (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>) is at least as high as the price they can get by exporting it (the World Price, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.375ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.92ex" role="img" focusable="false" viewBox="0 -683 1078.6 848.6"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></g></svg></mjx-container>, plus the subsidy, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.023ex;" xmlns="http://www.w3.org/2000/svg" width="1.061ex" height="1.023ex" role="img" focusable="false" viewBox="0 -442 469 452"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D460" d="M131 289Q131 321 147 354T203 415T300 442Q362 442 390 415T419 355Q419 323 402 308T364 292Q351 292 340 300T328 326Q328 342 337 354T354 372T367 378Q368 378 368 379Q368 382 361 388T336 399T297 405Q249 405 227 379T204 326Q204 301 223 291T278 274T330 259Q396 230 396 163Q396 135 385 107T352 51T289 7T195 -10Q118 -10 86 19T53 87Q53 126 74 143T118 160Q133 160 146 151T160 120Q160 94 142 76T111 58Q109 57 108 57T107 55Q108 52 115 47T146 34T201 27Q237 27 263 38T301 66T318 97T323 122Q323 150 302 164T254 181T195 196T148 231Q131 256 131 289Z"></path></g></g></g></svg></mjx-container>). Therefore, an export subsidy always drives the domestic price up: <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="11.724ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 5182.1 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g><g data-mml-node="mo" transform="translate(1356.3,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="msub" transform="translate(2412.1,0)"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g><g data-mml-node="mo" transform="translate(3712.9,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g><g data-mml-node="mi" transform="translate(4713.1,0)"><path data-c="1D460" d="M131 289Q131 321 147 354T203 415T300 442Q362 442 390 415T419 355Q419 323 402 308T364 292Q351 292 340 300T328 326Q328 342 337 354T354 372T367 378Q368 378 368 379Q368 382 361 388T336 399T297 405Q249 405 227 379T204 326Q204 301 223 291T278 274T330 259Q396 230 396 163Q396 135 385 107T352 51T289 7T195 -10Q118 -10 86 19T53 87Q53 126 74 143T118 160Q133 160 146 151T160 120Q160 94 142 76T111 58Q109 57 108 57T107 55Q108 52 115 47T146 34T201 27Q237 27 263 38T301 66T318 97T323 122Q323 150 302 164T254 181T195 196T148 231Q131 256 131 289Z"></path></g></g></g></svg></mjx-container> .</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-JYJ8r8HT="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="30" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="the-small-country-case-1">The Small Country Case</h4>

<p><strong>Core Assumption:</strong> A small country is a <strong>&quot;price taker.&quot;</strong> Its production and consumption volumes are so small relative to the global market that its trade policies cannot affect the world price (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.885ex" role="img" focusable="false" viewBox="0 -683 1078.6 833"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>). The world price remains fixed.</p>
<h6 id="price-effect-1">Price Effect</h6>
<ul>

<h6 id="quantity-effect-1">Quantity Effect</h6>

<h4 id="net-national-welfare-b--d">Net National Welfare: b + d</h4>
<h5 id="decreases-net-loss">Decreases (Net Loss)</h5>

<ul>
<li>The gains to producers are entirely wiped out by the losses to consumers and the massive cost to the government.</li>
<li>The country suffers a <code>Deadweight Loss (DWL)</code>  consisting of two parts:
<ol>
<li><strong>Production Distortion:</strong> Resources are <code>inefficiently pulled into</code> the subsidized industry where the country does not have a comparative advantage.</li>
<li><strong>Consumption Distortion:</strong> Domestic consumers are priced out of the market and consume less than they optimally should.</li>
</ol>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-rRW6UTyZ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="34" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="the-large-country-case-1">The Large Country Case</h4>

<p><strong>Core Assumption:</strong> A large country is a <strong>&quot;price maker&quot; (or price influencer).</strong> Its economy is so large that when it alters its export volumes, it shifts the global supply curve and <strong>changes the world price</strong>.</p>
<h6 id="price-effect-2">Price Effect</h6>
<ul>
<li>The export subsidy encourages a massive surge in the country's exports. This flood of new supply on the global market drives the <strong>world price down</strong> (let's call the new, lower world price <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.375ex;" xmlns="http://www.w3.org/2000/svg" width="2.44ex" height="1.92ex" role="img" focusable="false" viewBox="0 -683 1078.6 848.6"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mn" transform="translate(675,-150) scale(0.707)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></svg></mjx-container>).</li>

<h4 id="terms-of-trade-tot-effect">Terms of Trade (ToT) Effect</h4>

<ul>
<li>This is the crucial difference. The <strong>Terms of Trade</strong> is the ratio of a country's export prices to its import prices. Because the large country's subsidy pushed the world price of its exports <em>down</em>, it is now getting less money (or fewer imports) for every unit it sells abroad. Its Terms of Trade have <strong>deteriorated</strong>.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-fZNC3amn="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="38" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="61" data-size="16:9">
<h4 id="welfare-analysis-the-economic-impact-1"><strong>Welfare Analysis (The Economic Impact)</strong></h4>

<ul>
<li><strong>Consumer Surplus:</strong> Decreases (domestic prices still went up).</li>
<li><strong>Producer Surplus:</strong> Increases (domestic prices still went up).</li>
<li><strong>Government Revenue:</strong> Decreases massively (the government is paying the subsidy on a huge volume of exports).</li>
<li>Net National Welfare: Decreases significantly (Larger Net Loss than the Small Country).
<ul>
<li>The large country <code>suffers</code> the same <strong>Deadweight Loss</strong> (production and consumption distortions) as the small country. <strong>PLUS</strong>, it suffers an additional <strong>Terms of Trade Loss</strong>.</li>
<li><em>Economic reality:</em> The large country is essentially taking money from its own taxpayers and using it to lower the price of goods for <em>foreign</em> consumers.</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
