<p><strong>Regional Economic Integration</strong> refers to <code>agreements</code> between countries in a <code>geographic region</code> to reduce or eliminate trade barriers among themselves, while possibly maintaining barriers against non-members. The main objective is to increase <code>economic efficiency</code>, <code>boost trade</code>, <code>attract investment</code>, and <code>enhance bargaining power</code> in global negotiations.</p>

<h3 id="levels-of-regional-economic-integration"><strong>Levels of Regional Economic Integration</strong></h3>

<table>
<thead>
<tr>
<th>Level</th>
<th>Description</th>
<th>Tariff on Members</th>
<th>Common External Tariff</th>
<th>Free Movement of Factors</th>
<th>Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Preferential Trade Agreement (PTA)</strong></td>
<td>Reduced tariffs on <code>selected goods</code></td>
<td>Reduced</td>
<td>No</td>
<td>No</td>
<td>Many developing country deals</td>
</tr>
<tr>
<td><strong>Free Trade Area (FTA)</strong></td>
<td>Elimination of tariffs on substantially <code>all</code> trade</td>
<td>Zero</td>
<td>No (each keeps own)</td>
<td>No</td>
<td>USMCA, ASEAN FTA, RCEP</td>
</tr>
<tr>
<td><strong>Customs Union (CU)</strong></td>
<td>FTA + Common <code>External</code> Tariff</td>
<td>Zero</td>
<td>Yes</td>
<td>No</td>
<td>Mercosur, Southern African CU</td>
</tr>
<tr>
<td><strong>Common Market</strong></td>
<td>Customs Union + <code>Free movement of labor &amp; capital</code></td>
<td>Zero</td>
<td>Yes</td>
<td>Yes</td>
<td>EU Single Market (earlier stage)</td>
</tr>
<tr>
<td><strong>Economic &amp; Monetary Union</strong></td>
<td>Common Market + <code>Common currency</code> + <code>coordinated policies</code></td>
<td>Zero</td>
<td>Yes</td>
<td>Yes</td>
<td>Eurozone (EU)</td>
</tr>
<tr>
<td><strong>Political Union</strong></td>
<td>Full integration with <code>Common Government</code></td>
<td>Zero</td>
<td>Yes</td>
<td>Yes</td>
<td>(Theoretical)</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="color:#000;" data-marpit-pagination-total="23" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-TZHBOLbm="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h3 id="static-vs-dynamic-effects"><strong>Static vs Dynamic Effects</strong></h3>

<table>
<thead>
<tr>
<th>Type</th>
<th>Effects</th>
<th>Usually More Important?</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Static Effects</strong></td>
<td>Trade creation, diversion, terms of trade</td>
<td>Short to medium term</td>
</tr>
<tr>
<td><strong>Dynamic Effects</strong></td>
<td>Economies of scale, competition, technology transfer, investment, innovation</td>
<td>Long term (often larger)</td>
</tr>
</tbody>
</table>
<p><strong>Dynamic Benefits</strong>:</p>
<ul>
<li>Larger market → economies of scale, Increased competition<br />
→ efficiency gains (X-efficiency)</li>
<li>Attracts Foreign Direct Investment (FDI), Better infrastructure and policy coordination.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-6oVbzZg3="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h3 id="pros-advantages-of-regional-integration"><strong>Pros (Advantages) of Regional Integration</strong></h3>

<table>
<thead>
<tr>
<th>Category</th>
<th>Advantages</th>
<th>Explanation</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Economic</strong></td>
<td><code>Trade Creation</code></td>
<td>Replaces high-cost domestic production with cheaper partner production</td>
</tr>
<tr>
<td></td>
<td>Economies of Scale</td>
<td>Larger regional market allows firms to produce more efficiently</td>
</tr>
<tr>
<td></td>
<td>Increased Competition</td>
<td>Forces domestic firms to become more efficient (&quot;X-efficiency&quot;)</td>
</tr>
<tr>
<td></td>
<td>Investment Attraction (FDI)</td>
<td>Larger market + policy stability attracts foreign investors</td>
</tr>
<tr>
<td></td>
<td>Technology Transfer &amp; Innovation</td>
<td>Easier movement of people, capital, and knowledge</td>
</tr>
<tr>
<td></td>
<td>Better Infrastructure &amp; Policy Coordination</td>
<td>Joint projects in transport, energy, standards</td>
</tr>
<tr>
<td><strong>Political</strong></td>
<td>Enhanced Bargaining Power</td>
<td>Larger bloc has more influence in WTO or with big powers (e.g., EU, ASEAN)</td>
</tr>
<tr>
<td></td>
<td>Peace and Stability (&quot;Peace Dividend&quot;)</td>
<td>Countries that trade intensively are less likely to fight (EU example)</td>
</tr>
<tr>
<td></td>
<td>Domestic Reform Anchor</td>
<td>International commitments help lock in difficult domestic reforms</td>
</tr>
<tr>
<td><strong>Strategic</strong></td>
<td>Supply Chain Resilience</td>
<td>Regional integration reduces dependence on distant suppliers</td>
</tr>
<tr>
<td></td>
<td>Geopolitical Influence</td>
<td>Creates counterweight to global powers</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-9Oif7gGd="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h3 id="cons-disadvantages"><strong>Cons (Disadvantages)</strong></h3>

<table>
<thead>
<tr>
<th>Category</th>
<th>Disadvantages</th>
<th>Explanation</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Economic</strong></td>
<td><code>Trade Diversion</code></td>
<td>May shift imports from efficient global producers to less efficient partners</td>
</tr>
<tr>
<td></td>
<td>Loss of Tariff Revenue</td>
<td>Important revenue source for many developing countries</td>
</tr>
<tr>
<td></td>
<td>Adjustment Costs &amp; Unemployment</td>
<td>Some industries contract, leading to job losses in the short term</td>
</tr>
<tr>
<td></td>
<td>Risk of &quot;Race to the Bottom&quot;</td>
<td>Pressure to lower taxes, labor, or environmental standards</td>
</tr>
<tr>
<td></td>
<td>Uneven Distribution of Gains</td>
<td>Some regions/industries benefit much more than others (e.g., core vs periphery)</td>
</tr>
<tr>
<td><strong>Sovereignty</strong></td>
<td>Loss of Policy Autonomy</td>
<td>Must follow common rules (tariffs, regulations, subsidies)</td>
</tr>
<tr>
<td></td>
<td>Harmonization Costs</td>
<td>Expensive to align standards, laws, and regulations</td>
</tr>
<tr>
<td><strong>Political</strong></td>
<td>Increased Complexity &amp; Bureaucracy</td>
<td>New institutions and decision-making processes</td>
</tr>
<tr>
<td></td>
<td>Risk of Domination by Larger Members</td>
<td>Smaller countries may lose influence (e.g., concerns in Mercosur, AfCFTA)</td>
</tr>
<tr>
<td><strong>Other</strong></td>
<td>Exclusion of Non-Members (&quot;Spaghetti Bowl&quot; effect)</td>
<td>Proliferation of overlapping FTAs creates complex rules of origin</td>
</tr>
<tr>
<td></td>
<td>Potential for Conflict</td>
<td>Disputes over rules, compensation, or external tariffs</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-W2dt8CjE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h3 id="major-regional-trade-agreements-2026"><strong>Major Regional Trade Agreements (2026)</strong></h3>

<ul>
<li><strong>EU</strong> — Deepest integration (Economic &amp; Monetary Union)</li>
<li><strong>USMCA</strong> — Modern FTA (USA, Mexico, Canada)</li>
<li><strong>RCEP</strong> — Largest by population (ASEAN + China, Japan, Korea, Australia, NZ)</li>
<li><strong>CPTPP</strong> — High-standard FTA (11 countries, including Japan, Vietnam, Canada)</li>
<li><strong>AfCFTA</strong> — African Continental Free Trade Area (ambitious but implementation ongoing)</li>
<li><strong>ASEAN Economic Community</strong></li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-hVpUWCJw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h3 id="key-economic-concepts"><strong>Key Economic Concepts</strong></h3>

<h4 id="trade-creation-vs-trade-diversion-jacob-viner-1950"><strong>Trade Creation vs Trade Diversion</strong> (Jacob Viner, 1950)</h4>
<ul>
<li>
<p><strong>Trade Creation</strong>: Replacement of <code>high-cost domestic production</code> with <code>lower-cost imports</code> from partner countries → <strong>Welfare Improving</strong>.</p>
</li>
<li>
<p><strong>Trade Diversion</strong>: Replacement of <code>low-cost imports</code> from the rest of the world with <code>higher-cost imports</code> from partner countries (due to preferences) → <strong>Welfare Reducing</strong>.</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-O7jWwHt9="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">

<ul>
<li><strong>Consumer Surplus Gain</strong> = Area <strong>(a + b + c + d)</strong>,</li>
<li><strong>Producer Surplus Loss</strong> = Area <strong>a</strong></li>

<ul>
<li>
<p><strong>Net Welfare Effect</strong> = (b+d)−e, Where:</p>
<ul>
<li>
<p><strong>Area b</strong> = <strong>Trade Creation Gain</strong> (production efficiency)</p>
</li>
<li>
<p><strong>Area d</strong> = <strong>Trade Creation Gain</strong> (consumption efficiency)</p>
</li>
<li>
<p><strong>Area e</strong> = <strong>Trade Diversion Loss</strong></p>
</li>
</ul>
</li>
</ul>
<p><strong>Interpretation</strong>:</p>
<ul>
<li>If <strong>(b + d) &gt; e</strong> → Net welfare <code>gain</code> from FTA;</li>
<li>If <strong>(b + d) &lt; e</strong> → Net welfare <code>loss</code> from FTA</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<table>
<thead>
<tr>
<th>Effect</th>
<th>Area</th>
<th>Welfare Impact</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td>Consumer Gain</td>
<td>a+b+c+d</td>
<td>Positive</td>
<td>Lower price</td>
</tr>
<tr>
<td>Producer Loss</td>
<td>-a</td>
<td>Negative</td>
<td>Reduced output</td>
</tr>
<tr>
<td>Lost Tariff Revenue</td>

</tr>
<tr>
<td><strong>Trade Creation</strong></td>
<td><strong>b+d</strong></td>
<td><strong>Positive</strong></td>
<td>Efficiency gain</td>
</tr>
<tr>
<td><strong>Trade Diversion</strong></td>
<td><strong>-e</strong></td>
<td><strong>Negative</strong></td>
<td>Inefficient source</td>
</tr>
<tr>

<h4 id="dynamic-gains-from-regional-economic-integration"><strong>Dynamic Gains from Regional Economic Integration</strong></h4>

<ul>
<li>
<p>While <strong>static effects</strong> (trade creation vs diversion) are one-time reallocations of resources,</p>
</li>
<li>
<p><strong>Dynamic gains</strong> are the long-term, ongoing benefits that drive <code>sustained economic growth</code>. These are generally considered much larger and more important than static effects.</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-JrLZvK1C="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="main-sources-of-dynamic-gains">Main Sources of Dynamic Gains</h4>

<table>
<thead>
<tr>
<th>Dynamic Gain</th>
<th>Mechanism</th>
<th>Expected Impact</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Economies of Scale</strong></td>
<td>Larger regional market allows firms to increase production scale</td>
<td>Lower average costs, higher competitiveness</td>
</tr>
<tr>
<td><strong>Increased Competition</strong></td>
<td>More foreign competitors force firms to reduce inefficiency (&quot;X-inefficiency&quot;)</td>
<td>Higher productivity, innovation</td>
</tr>
<tr>
<td><strong>Technology Transfer &amp; Spillovers</strong></td>
<td>FDI, imports of capital goods, movement of skilled workers</td>
<td>Faster technological progress</td>
</tr>
<tr>
<td><strong>Foreign Direct Investment (FDI)</strong></td>
<td>Bigger market + policy certainty attracts more investment</td>
<td>Capital inflow, job creation, knowledge transfer</td>
</tr>
<tr>
<td><strong>Product Variety &amp; Innovation</strong></td>
<td>Larger market supports more product differentiation</td>
<td>Consumer welfare + learning-by-doing</td>
</tr>
<tr>
<td><strong>Structural Transformation</strong></td>
<td>Shift of resources from low-productivity to high-productivity sectors</td>
<td>Long-term growth acceleration</td>
</tr>
<tr>
<td><strong>Policy Reform &amp; Credibility</strong></td>
<td>External commitments lock in better policies</td>
<td>Better institutions and governance</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-LtRRsr0q="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">

<h4 id="b-pro-competitive-effect--x-efficiency-leibenstein">B. Pro-Competitive Effect &amp; X-Efficiency (Leibenstein)</h4>
<p>Before integration: Protected firms operate with slack (inefficiency). After integration: Competition forces firms closer to the efficiency frontier.</p>

<ul>
<li>Knowledge spillovers; Returns to R&amp;D; Rate of innovation</li>
</ul>

<h4 id="numerical--illustrative-example">Numerical / Illustrative Example</h4>

<p><strong>Scenario</strong>: Country A has a domestic market of 10 million consumers. It forms an FTA with Country B (another 15 million).</p>
<ul>
<li>
<p>Before Integration:</p>
<ul>
<li>Firm produces 50,000 cars/year → Average Cost = $22,000</li>
<li>Limited competition → operates at 80% efficiency</li>
</ul>
</li>
<li>
<p>After Integration</p>
<p>(25 million combined market):</p>
<ul>
<li>Firm can sell 120,000 cars/year → Average Cost drops to <strong>$16,000</strong> (economies of scale)</li>
<li>Competition rises → efficiency rises to 95%</li>
<li>Productivity growth: +2.5% per year (instead of 0.8%)</li>
</ul>
</li>
</ul>
<p><strong>Cumulative Effect</strong> over 10 years: The dynamic gains can be <strong>3–5 times larger</strong> than one-time static gains.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="conditions-for-maximizing-dynamic-gains">Conditions for Maximizing Dynamic Gains</h4>

<p>Dynamic gains are <strong>not automatic</strong>. They depend on:</p>
<ol>
<li><strong>Complementary Policies</strong>: Education, infrastructure, flexible labor markets, good governance.</li>
<li><strong>Depth of Integration</strong>: Deeper agreements (Common Market &gt; FTA) generate larger dynamic effects.</li>
<li><strong>Initial Conditions</strong>: Countries with similar technological levels gain more from scale and competition.</li>
<li><strong>Openness to the World</strong>: Integration should be “open regionalism” rather than closed blocs.</li>
<li><strong>Adjustment Support</strong>: Retraining programs, social safety nets to manage short-term costs.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-dkJZIJ2D="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<p><strong>Key Takeaway</strong>:</p>

<ul>
<li>
<p>Most economists believe that <strong>dynamic gains</strong> from successful regional integration are the primary reason countries pursue it.</p>

<li>
