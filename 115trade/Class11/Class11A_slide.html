<h3 id="digital-trade">Digital Trade</h3>
<p><code>Digital trade</code> includes digitally ordered goods/services and especially digitally delivered services (e.g., <code>software</code>, <code>cloud computing</code>, <code>streaming</code>, e-commerce, data flows, ICT-enabled services). It includes cross-border data flows.</p>
<h4 id="main-categories-of-digital-trade"><strong>Main Categories of Digital Trade</strong></h4>
<table>
<thead>
<tr>
<th>Category</th>
<th>Examples</th>
<th>Importance</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Digitally Delivered Services</strong></td>
<td>Software, cloud computing, streaming, telemedicine, online education</td>
<td>Fastest growing</td>
</tr>
<tr>
<td><strong>Digital Products</strong></td>
<td>e-books, music, software downloads, 3D printing files</td>
<td>Fully digital</td>
</tr>
<tr>
<td><strong>E-commerce</strong></td>
<td>Cross-border online sales (Amazon, Shopee, Temu)</td>
<td>Goods + digital</td>
</tr>
<tr>
<td><strong>Data Flows</strong></td>
<td>Movement of personal, commercial, and government data</td>
<td>Backbone of digital economy</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-hU70duwl="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="key-economic-characteristics"><strong>Key Economic Characteristics</strong></h4>

<ul>
<li><strong>Near-zero marginal cost</strong>:
<ul>
<li>Once created, digital goods/services can be replicated and delivered at almost zero extra cost.</li>
</ul>
</li>
<li><strong>Network Effects</strong> and <strong>Platform Economies</strong> (winner-takes-most dynamics).</li>
<li><strong>Scalability</strong>: Global reach with minimal physical infrastructure.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-VsIyS7w8="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<p><strong>Main Economic Effects</strong>:</p>

<ul>
<li><strong>Trade Cost Reduction</strong>: Digital delivery dramatically lowers trade costs compared to physical goods.</li>
<li><strong>Services Trade Boom</strong>: Traditionally non-tradable services (e.g., consulting, education, healthcare) become tradable.</li>
<li><strong>Market Expansion for SMEs</strong>: Small firms can export directly via platforms (e.g., Etsy, Shopify, Temu).</li>
<li><strong>Data as a Factor of Production</strong>: Similar to how capital and labor drive growth.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-EBGLbysp="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="economic-models"><strong>Economic Models</strong></h4>

<ul>
<li><strong>Endogenous Growth Theory</strong>: Digital trade accelerates <code>idea flows</code> and innovation.</li>
<li><strong>Gravity Model Extensions</strong>: Digital trade reduces “distance” dramatically (time and cost).</li>
<li><strong>Baumol’s Cost Disease</strong>: Services that were non-tradable become tradable → productivity gains in services sector.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-vK4ET1WF="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="key-issues-in-digital-trade"><strong>Key Issues in Digital Trade</strong></h4>

<ul>
<li><strong>Cross-border Data Flows</strong> and localization requirements</li>
<li><strong>Data Privacy</strong> (GDPR in EU vs lighter rules elsewhere)</li>
<li><strong>Cybersecurity and National Security</strong></li>
<li><strong>Digital Taxation</strong> (e.g., Digital Services Taxes)</li>
<li><strong>Intellectual Property Protection</strong> (piracy, counterfeiting)</li>
<li><strong>Platform Regulation</strong> (Big Tech dominance)</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-2wmVTGbY="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="major-agreements"><strong>Major Agreements</strong></h4>

<ul>
<li><strong>CPTPP</strong> and <strong>DEPA</strong> (Digital Economy Partnership Agreement): High-standard digital rules</li>
<li><strong>USMCA</strong> (Chapter 19): Strong digital trade chapter</li>
<li><strong>EU</strong> approach: More regulatory (data protection first)</li>
<li><strong>WTO</strong> negotiations on e-commerce (ongoing)</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-m1uL3QOD="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h3 id="service-trade">Service Trade</h3>

<p><code>Services trade</code>  (e.g., finance, tourism, transport, professional services, telecom) differs significantly from goods trade. It was traditionally harder to measure and model than goods trade due to its <code>intangibility and regulatory barriers</code>.</p>
<ul>
<li><strong>Better fit than for goods</strong>: Kimura and Lee (2006) found that gravity equations explain services trade better than goods trade. Their adjusted R² values were notably higher for services (around 0.80) compared to goods (around 0.65).</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-3MYq9Wqj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<ul>
<li><strong>Core drivers</strong>:
<ul>
<li><strong>Economic size (GDP)</strong>: Strongly positive, as expected — larger economies trade more services.</li>
<li><strong>Common language</strong>: One of the most robust and important positive factors (often stronger than for goods, due to the personal/cultural nature of many services).</li>
<li><strong>Geographic distance</strong>: Frequently <strong>insignificant or weaker</strong> than in goods trade. This makes intuitive sense because many services (especially Mode 1 — cross-border supply via digital means) do not require physical transportation.</li>
</ul>
</li>
<li><strong>Other factors</strong>: Cultural proximity, colonial ties, common legal systems, and trade agreements boost services flows. Regulatory barriers have a strong negative impact.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-p9vh6h8F="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">

<h4 id="differences-from-goods-trade">Differences from Goods Trade</h4>

<table>
<thead>
<tr>
<th>Aspect</th>
<th>Goods Trade</th>
<th>Services Trade</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Distance effect</strong></td>
<td>Strong negative</td>
<td>Weaker or insignificant</td>
</tr>
<tr>
<td><strong>Language/Culture</strong></td>
<td>Important</td>
<td>Often more critical</td>
</tr>
<tr>
<td><strong>Main barriers</strong></td>
<td>Tariffs, transport costs, borders</td>
<td>Regulations, licensing, data rules, FDI restrictions</td>
</tr>
<tr>
<td><strong>Data quality</strong></td>
<td>Better measured</td>
<td>Patchy, missing values, harder to observe</td>
</tr>
<tr>
<td><strong>Model fit</strong></td>
<td>Good</td>
<td>Often better</td>
</tr>
<tr>
<td><strong>Modes of supply</strong></td>
<td>Mainly physical</td>
<td>GATS Modes 1-4 (cross-border, consumption abroad, commercial presence, movement of persons)</td>
</tr>
</tbody>
</table>
<ul>
<li>Services trade involves more &quot;dark costs&quot;
<ul>
<li>opaque regulations in sectors like professional services, finance, and telecom — compared to the more transparent tariffs on goods.</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-wPrFyVcg="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="key-findings-from-studies"><strong>Key findings from studies</strong>:</h4>

<ul>
<li><code>Economic size (GDPs)</code> remains the strongest positive driver.</li>
<li><code>Distance</code> has a significant negative effect (though sometimes weaker than for goods, due to lower physical transport needs).</li>
<li><code>Common language</code>, <code>cultural proximity</code>, and <code>institutional similarities</code> are particularly important.</li>
<li>Services trade restrictions (measured by indices like the OECD <code>STRI</code>) strongly reduce flows.</li>
<li>The model successfully explains why services trade is highly concentrated among high-income countries and is sensitive to regulatory barriers.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-VSEAw8UI="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="services-trade-restrictiveness-indexstri">Services Trade Restrictiveness Index(STRI)</h4>

<ul>
<li>
<p>The <strong>STRI (經合組織服務貿易限制指數)</strong>, developed by the OECD, is a groundbreaking tool because it quantifies what was historically unquantifiable: <strong>non-tariff regulatory barriers in services</strong>. Unlike goods, where tariffs are the primary barrier, services trade is restricted by domestic regulations (e.g., licensing, foreign equity limits, visa quotas)..</p>
</li>
<li>
<p>To understand its impact on trade, we must first understand what STRI measures. It scores countries from <strong>0 (completely open)</strong> to <strong>1 (completely closed)</strong> across 22 service sectors based on five policy dimensions:</p>
</li>
</ul>
<ol>
<li><strong>Foreign Ownership Restrictions:</strong> Limits on foreign equity, screening mechanisms, or bans on foreign land ownership.</li>
<li><strong>Movement of People:</strong> Visa quotas, economic needs tests, and lack of mutual recognition of professional qualifications.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-MmfDPv0g="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="16" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<ol start="3">
<li><strong>Other Discriminatory Measures:</strong> Subsidies only for domestic firms, public procurement restrictions, or forced technology transfer.</li>
<li><strong>Barriers to Competition:</strong> State-owned monopolies, exclusive licenses, or limits on the number of operating firms.</li>
<li><strong>Regulatory Transparency:</strong> Lack of public consultation, unclear licensing procedures, or lack of independent regulatory bodies.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-BNMoywjj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h5 id="integration-with-the-gravity-model">Integration with the Gravity Model</h5>

<ul>
<li>Because services don't face <code>border tariffs</code>, economists use STRI to calculate the <strong>Ad Valorem Equivalent (AVE)</strong>
<ul>
<li>
<p>Essentially translating a regulatory restriction into a &quot;tariff equivalent.&quot;</p>
</li>
<li>
<p><em>Example:</em> An OECD study found that in some highly restricted sectors (like certain <code>telecommunications</code> or <code>professional services</code>), the STRI score translates to an AVE of <strong>30% to over 100%</strong>. This means the domestic regulation acts exactly like a 100% tariff, severely choking trade.</p>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-IFqeCRM4="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">

rm="translate(18453.4,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g><g data-mml-node="mi" transform="translate(19453.7,0)"><path data-c="1D716" d="M227 -11Q149 -11 95 41T40 174Q40 262 87 322Q121 367 173 396T287 430Q289 431 329 431H367Q382 426 382 411Q382 385 341 385H325H312Q191 385 154 277L150 265H327Q340 256 340 246Q340 228 320 219H138V217Q128 187 128 143Q128 77 160 52T231 26Q258 26 284 36T326 57T343 68Q350 68 354 58T358 39Q358 36 357 35Q354 31 337 21T289 0T227 -11Z"></path></g></g></g></svg></mjx-container></p><p><strong>Empirical Findings:</strong></p>
<ul>
<li>
<p><strong>Elasticity:</strong> A 10% reduction in a country's STRI score is empirically shown to increase its services imports by roughly <strong>3% to 5%</strong>, depending on the sector.</p>
</li>
<li>
<p><strong>Symmetry:</strong> The STRI of <code>both</code> the exporting and importing country matters.</p>
<ul>
<li>If the exporter has high STRI (e.g., poor regulatory transparency), it raises costs for their firms, reducing their export competitiveness.</li>
</ul>
</li>
<li>
<p>Perhaps the most critical insight regarding STRI is that services restrictions do not just hurt services trade; they hurt manufacturing and the broader economy.</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-B8mLmsAT="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<ul>
<li>
<p>Interestingly, <code>Digital trade</code> often shows strong gravity patterns but with some nuances:</p>
<ul>
<li><code>Distance</code> matters less for purely digital delivery, while <code>regulatory alignment</code> (data privacy, cybersecurity, digital standards) and <code>digital readiness</code> become critical &quot;distance-like&quot; frictions.</li>
<li>That is to say, <code>Digital trade</code> (especially digitally delivered services) further weakens the role of physical distance.</li>
</ul>
</li>
<li>
<p>It adapts the classic framework to analyze trade in digitally ordered goods and especially digitally deliverable services (DDS), such as software, cloud computing, financial services, professional services, streaming content, telecom, and data-related flows.</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-Zt0HgK1B="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<p>The core structure remains the same:</p>
<ul>
<li><strong>Positive drivers</strong>:
<ul>
<li>Economic sizes (GDPs), digital readiness/connectivity.</li>
</ul>
</li>
<li><strong>Negative drivers</strong>:
<ul>
<li>Various forms of &quot;distance&quot; — geographic, regulatory, data localization rules, etc.</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-dw7yUyVd="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h6 id="differences-from-traditional-services-and-goods-trade">Differences from Traditional Services and Goods Trade</h6>

<table>
<thead>
<tr>
<th>Aspect</th>
<th>Goods Trade</th>
<th>Traditional Services</th>
<th>Digital Trade (DDS)</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Distance</strong></td>
<td>Strong negative</td>
<td>Weaker</td>
<td>Weakest (but regulatory distance strong)</td>
</tr>
<tr>
<td><strong>Key enablers</strong></td>
<td>Infrastructure, tariffs</td>
<td>Regulations, proximity</td>
<td>Digital connectivity, data rules</td>
</tr>
<tr>
<td><strong>Policy focus</strong></td>
<td>Tariffs, NTBs</td>
<td>STRI, licensing</td>
<td>E-commerce chapters, data flows</td>
</tr>
<tr>
<td><strong>Complementarities</strong></td>
<td>With services</td>
<td>With goods</td>
<td>Strong with ICT goods &amp; other services</td>
</tr>
<tr>
<td><strong>Data challenges</strong></td>
<td>Good</td>
<td>Patchy</td>
<td>Emerging but improving</td>
</tr>
</tbody>
</table>
<ul>
<li>Digital trade shows <strong>strong complementarities</strong>: Better digital infrastructure and ICT goods imports amplify services exports.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="the-digital-extension-dstri-digital-stri">The Digital Extension: DSTRI (Digital STRI)</h4>

<p>As trade digitized, the OECD recognized that traditional STRI didn't fully capture <code>digital barriers</code>. They introduced the <strong>Digital Services Trade Restrictiveness Index (DSTRI)</strong>.</p>
<h4 id="new-digital-barriers-measured"><strong>New Digital Barriers Measured:</strong></h4>
<ol>
<li><strong>Data Localization:</strong> Requirements that data generated domestically must be stored on domestic servers (massively increases costs for cloud and digital services).</li>
<li><strong>Source Code Disclosure:</strong> Forcing foreign software companies to hand over proprietary source code as a condition of market access.</li>
<li><strong>Digital Signatures &amp; E-contracts:</strong> Lack of legal recognition for cross-border electronic contracts.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-10TGGH64="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h5 id="impact-on-digital-trade"><strong>Impact on Digital Trade:</strong></h5>

<p>Using the Gravity Model with DSTRI, researchers found that data localization requirements alone can reduce digital trade flows by <strong>up to 10-15%</strong>. DSTRI is now crucial for understanding the trade of &quot;digitally deliverable services&quot; (e.g., software, streaming, cloud computing).</p>
