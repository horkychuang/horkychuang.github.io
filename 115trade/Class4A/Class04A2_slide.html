<h2 id="factor-price-equalization-fpe-theorem">Factor Price Equalization (FPE) Theorem</h2>

<p><strong>Factor Price Equalization</strong> (FPE) Theorem (developed by Paul Samuelson, 1948) argued that <strong>free trade in goods alone</strong> (without international factor mobility) will lead to complete equalization of <strong>real factor prices</strong> (wages and capital rents) <code>across countries</code>, even though factors themselves cannot move.</p>
<p><strong>Core Idea</strong>: free trade in goods can substitute for international factor mobility. In simple terms: <code>Trade in goods acts as a substitute for trade in factors</code>. However, because many strong assumptions are required, FPE <code>rarely holds</code> fully in practice.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-uTmoY3mb="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="core-assumptions-same-as-h-o-model">Core Assumptions (Same as H-O Model)</h4>

<table>
<thead>
<tr>
<th>Assumption</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>Two countries, Two goods, Two factors</td>
<td>Standard 2×2×2 model</td>
</tr>
<tr>
<td><code>Perfect Competition</code></td>
<td>In both goods and factor markets</td>
</tr>
<tr>
<td>Constant Returns to Scale (CRS)</td>
<td>Production functions are homogeneous of degree 1</td>
</tr>
<tr>
<td>Identical Homothetic Preferences</td>
<td>Same tastes across countries</td>
</tr>
<tr>
<td>Technology</td>
<td>Same technology in both countries</td>
</tr>
<tr>
<td>Factors mobile within country</td>
<td>Labor and Capital mobile between sectors</td>
</tr>
<tr>
<td>Factors immobile between countries</td>
<td>No international factor mobility</td>
</tr>
<tr>
<td>No transport costs / trade barriers</td>
<td>Free trade</td>
</tr>
<tr>
<td>Full employment</td>
<td>All factors are fully utilized</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-g8LXf04w="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="main-mechanism">Main Mechanism</h4>

<ol>
<li>
<p>Before trade <strong>(Autarky)</strong>:</p>
<ul>
<li>Labor-abundant country has <strong>low wage (w)</strong> and <strong>high rental rate (r)</strong>.</li>
<li>Capital-abundant country has <strong>high wage (w)</strong> and <strong>low rental rate (r)</strong>.</li>
</ul>
</li>
<li>
<p>When <strong>trade opens</strong>:</p>
<ul>
<li>Labor-abundant country exports labor-intensive good → increases demand for labor → <strong>w rises</strong>, <strong>r falls</strong>.</li>
<li>Capital-abundant country exports capital-intensive good → increases demand for capital → <strong>r rises</strong>, <strong>w falls</strong>.</li>
</ul>
</li>
<li>
<p><code>Goods prices</code> equalize across countries due to <code>free trade</code>.</p>
</li>
<li>
<p>Because <code>technology is identical</code> and <code>goods prices</code> are equal, cost minimization conditions</p>
<p>force:</p>
<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -1.577ex; display: block; width: 100%; height: auto; max-height: 4.672ex;" xmlns="http://www.w3.org/2000/svg" width="9.236ex" height="4.672ex" role="img" focusable="false" viewBox="0 -1367.8 4082.1 2064.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mfrac"><g data-mml-node="mi" transform="translate(220,676)"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g><g data-mml-node="mi" transform="translate(352.5,-686)"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q161 442 183 430T214 408T225 388Q227 382 228 382T236 389Q284 441 347 441H350Q398 441 422 400Q430 381 430 363Q430 333 417 315T391 292T366 288Q346 288 334 299T322 328Q322 376 378 392Q356 405 342 405Q286 405 239 331Q229 315 224 298T190 165Q156 25 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g><rect width="916" height="60" x="120" y="220"></rect></g><g data-mml-node="mo" transform="translate(1433.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 </li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-Iq9smRd5="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<ol>
<li>
<p><code>Before trade</code>: Different relative endowments → different relative factor prices (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.771ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1667 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(716,0)"><g data-mml-node="mo"><path data-c="2F" d="M423 750Q432 750 438 744T444 730Q444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z"></path></g></g><g data-mml-node="mi" transform="translate(1216,0)"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q161 442 183 430T214 408T225 388Q227 382 228 382T236 389Q284 441 347 441H350Q398 441 422 400Q430 381 430 363Q430 333 417 315T391 292T366 288Q346 288 334 299T322 328Q322 376 378 392Q356 405 342 405Q286 405 239 331Q229 315 224 298T190 165Q156 25 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> differs).</p>
</li>
<li>
<p><code>Trade</code> opens → countries export goods using their <code>abundant factor</code> → relative goods prices <code>converge</code>.</p>
</li>
<li>
<p>Goods price equalization → identical <code>zero-profit</code> lines in both countries.</p>
</li>
<li>
<p>Since the unit input requirements (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.666ex;" xmlns="http://www.w3.org/2000/svg" width="2.596ex" height="1.663ex" role="img" focusable="false" viewBox="0 -441 1147.3 735.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="TeXAtom" transform="translate(562,-150) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mi" transform="translate(345,0)"><path data-c="1D457" d="M297 596Q297 627 318 644T361 661Q378 661 389 651T403 623Q403 595 384 576T340 557Q322 557 310 567T297 596ZM288 376Q288 405 262 405Q240 405 220 393T185 362T161 325T144 293L137 279Q135 278 121 278H107Q101 284 101 286T105 299Q126 348 164 391T252 441Q253 441 260 441T272 442Q296 441 316 432Q341 418 354 401T367 348V332L318 133Q267 -67 264 -75Q246 -125 194 -164T75 -204Q25 -204 7 -183T-12 -137Q-12 -110 7 -91T53 -71Q70 -71 82 -81T95 -112Q95 -148 63 -167Q69 -168 77 -168Q111 -168 139 -140T182 -74L193 -32Q204 11 219 72T251 197T278 308T289 365Q289 372 288 376Z"></path></g></g></g></g></g></svg></mjx-container>) depend on factor prices, the only solution consistent with both equations is <strong>equal factor prices</strong></p>
</li>
</ol>
<p><strong>Key Insight</strong>: <strong>FPE</strong> is a <strong>price transmission result</strong>. Trade equalizes output prices; technology links output prices to input prices; thus, input prices equalize.</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-PNl9CGjY="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="important-implication">Important Implication</h4>

<ol>
<li><strong>Benchmark, Not Prediction</strong>: FPE serves as a <strong>theoretical baseline</strong> to diagnose why convergence fails (e.g., tech gaps, trade frictions, institutional barriers).</li>
<li><strong>Regional Integration</strong>: FPE holds more strongly within <code>integrated markets</code> (EU single market, US interstate trade, NAFTA/USMCA supply chains).</li>
<li><strong>Development Strategy</strong>: Highlights that trade alone <strong>cannot</strong> equalize <code>living standards</code> without technology transfer, human capital investment, and institutional reform.</li>
<li><strong>Global Value Chains</strong>: Task-based trade allows partial factor price convergence for specific skills/tasks, even if absolute wages diverge.</li>
<li><strong>Migration vs. Trade Policy</strong>: If FPE held perfectly, migration restrictions would be unnecessary. Its failure explains why labor mobility remains politically and economically relevant.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-R4lhuw0x="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="key-takeaways">Key Takeaways</h4>

<ol>
<li>FPE is a <strong>logical consequence</strong> of the H-O assumptions, not an empirical law.</li>
<li>It relies critically on <strong>incomplete specialization</strong> and the <strong>diversification cone</strong>.</li>
<li>The <strong>magnification effect</strong> (SS) and <strong>output reallocation</strong> (Rybczynski) are the adjustment mechanisms that enable FPE.</li>
<li>Empirical failure of FPE reveals the importance of technology, institutions, trade costs, and factor heterogeneity.</li>
<li>Modern trade theory uses FPE as a <strong>counterfactual benchmark</strong> to measure frictions, assess convergence, and design integration policies.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-ykEFGpkW="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="link-to-previous-theorems">Link to Previous Theorems</h4>

<table>
<thead>
<tr>
<th>Theorem</th>
<th>What Changes</th>
<th>What is Equalized / Affected</th>
<th>Direction</th>
</tr>
</thead>
<tbody>
<tr>
<td>Stolper-Samuelson</td>
<td>Goods prices</td>
<td>Factor prices (magnified)</td>
<td>Opposite directions</td>
</tr>
<tr>
<td>Rybczynski</td>
<td>Factor endowments</td>
<td>Outputs (magnified)</td>
<td>Opposite directions</td>
</tr>
<tr>
<td><strong>Factor Price Equalization</strong></td>
<td>Goods prices (via trade)</td>
<td><strong>Factor prices across countries</strong></td>
<td>Complete equalization</td>
</tr>
</tbody>
</table>
<ul>
<li>FPE is the <strong>international counterpart</strong> of Stolper-Samuelson: once goods prices are equalized, factor prices must also equalize.</li>
<li>It explains why trade can substitute for factor mobility.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-ox96yn4t="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h4 id="why-factor-price-equalization-often-fails-in-reality">Why Factor-Price Equalization Often Fails in Reality</h4>

<p>Here are the <strong>main reasons</strong> FPE does not hold in the real world:</p>
<table>
<thead>
<tr>
<th>Reason</th>
<th>Explanation</th>
<th>Effect on FPE</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Different Technology</strong></td>
<td>Countries have different production functions</td>
<td>FPE fails completely</td>
</tr>
<tr>
<td><strong>Factor Intensity Reversal</strong></td>
<td>Which good is labor-intensive changes with wage levels</td>
<td>FPE breaks down</td>
</tr>
<tr>
<td><strong>Transportation Costs &amp; Trade Barriers</strong></td>
<td>Goods prices do not fully equalize</td>
<td>Partial or no equalization</td>
</tr>
<tr>
<td><strong>More than Two Factors</strong></td>
<td>Skilled labor, unskilled labor, land, etc.</td>
<td>Makes equalization very difficult</td>
</tr>
<tr>
<td><strong>Specialization (Outside Cone)</strong></td>
<td>Countries completely specialize</td>
<td>FPE does not occur</td>
</tr>
<tr>
<td><strong>Non-homothetic Preferences</strong></td>
<td>Different demand patterns</td>
<td>Affects goods prices</td>
</tr>
<tr>
<td><strong>Imperfect Competition</strong></td>
<td>Monopolies, unions, minimum wages</td>
<td>Prevents factor price adjustment</td>
</tr>
<tr>
<td><strong>Political &amp; Institutional Factors</strong></td>
<td>Labor laws, unions, immigration restrictions</td>
<td>Blocks wage convergence</td>
</tr>
<tr>
<td><strong>Capital Mobility</strong></td>
<td>Capital moves easily, labor does not</td>
<td>Partial equalization only</td>
</tr>
</tbody>
</table>

<h6 id="conditions-required-for-fpe">Conditions Required for FPE</h6>

<ol>
<li><strong>Identical technologies</strong> across countries.</li>
<li><strong>No factor intensity reversals</strong> (factor intensity ranking remains the same at all factor prices).</li>
<li><strong>Both countries produce both goods</strong> (they remain in the <strong>cone of diversification</strong> — no complete specialization).</li>
<li><strong>Free trade</strong> with no transport costs or trade barriers.</li>
<li><strong>Perfect competition</strong> and constant returns to scale.</li>
<li>Same number of factors and goods (or at least as many goods as factors).</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-2wWRj7Aw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h6 id="conditions-for-fpe-to-hold">Conditions for FPE to Hold</h6>

<p><strong>FPE holds only if</strong>:</p>
<ul>
<li><code>Identical technology</code>; No factor intensity reversal</li>
<li>Both countries continue producing <strong>both goods</strong> (diversification)</li>
<li>Free trade with no transport costs; Same homothetic preferences</li>
</ul>
<p>In reality, <strong>most of these assumptions are violated</strong>, which is why we do <strong>not</strong> observe full equalization of wages and capital returns between rich and poor countries.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-Hz9OHrk0="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<p>Stolper-Samuelson and Rybczynski theorems examine <code>within-country</code> adjustments, FPE addresses <code>cross-country</code> convergence: it shows that, under strict conditions, free trade in <strong>goods</strong> can perfectly substitute for <strong>international factor mobility</strong>, equalizing wages and returns to capital across nations.</p>
<h4 id="historical-context--core-statement">Historical Context &amp; Core Statement</h4>
<ul>
<li><strong>Origin</strong>: Paul Samuelson (1948), <em>&quot;International Trade and the Equalization of Factor Prices&quot;</em> (Economic Journal).</li>
<li><strong>Purpose</strong>: To demonstrate the full general equilibrium implications of the H-O model when goods prices converge through trade.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-1QR7nzJP="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<h2 id="leontief-paradox">Leontief Paradox</h2>

<p>The <strong>Leontief Paradox（1953)</strong> is one of the most famous <code>empirical</code> challenges to the <strong>Heckscher-Ohlin (H-O) model</strong>. Wassily Leontief tested the H-O theorem using 1947 U.S. trade data. According to H-O, the United States — the most <strong>capital-abundant</strong> country in the world — should export <strong>capital-intensive</strong> goods and import <strong>labor-intensive</strong> goods. <strong>Empirical Result</strong>:</p>
<ul>
<li>U.S. <strong>exports</strong> were more <strong>labor-intensive</strong> than U.S. <strong>imports</strong>.</li>
<li>Specifically, U.S. imports were about <strong>30% more capital-intensive</strong> than U.S. exports.</li>
</ul>
<p><strong>Core Idea</strong>: It showed that reality is more complex than “countries export goods that intensively use their abundant factors.”</p>
<ul>
<li>It opened the door to richer theories that include <code>human capital</code>, <code>technology gaps</code>, and <code>increasing returns to scale</code>.  The empirical result was a <strong>direct contradiction</strong> of the H-O prediction → hence called a “paradox.”</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-9Rvrq8zT="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">

<h4 id="main-explanations-for-the-leontief-paradox">Main Explanations for the Leontief Paradox</h4>

<p>Several attempts have been made to resolve the paradox:</p>
<ol>
<li><code>Higher U.S. Labor Productivity</code>  (Leontief’s own explanation)
<ul>
<li>American workers were more productive (better technology, education, management).</li>
<li>When adjusted for <strong>productivity-equivalent labor</strong>, the paradox disappears.</li>
</ul>
</li>
<li><code>Factor Intensity Reversal</code>
<ul>
<li>The assumption that a good is always labor- or capital-intensive may not hold across countries.</li>
</ul>
</li>
<li><code>Human Capital / Skilled Labor</code>
<ul>
<li>U.S. exports are intensive in <strong>skilled labor</strong> (human capital), not raw labor. Standard H-O only considers unskilled labor and physical capital.</li>
</ul>
</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-IfFt3r2S="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="23" data-size="16:9">
<ol start="4">
<li><code>Natural Resources</code>
<ul>
<li>Many U.S. imports are resource-intensive (oil, minerals), which are capital-intensive to extract.</li>
</ul>
</li>
<li><code>Methodological Issues</code>
<ul>
<li>Leontief compared gross exports and imports instead of net trade.</li>
<li>Did not account for tariffs and trade barriers.</li>
</ul>
</li>
<li><code>Technology Differences</code>
<ul>
<li>H-O assumes identical technology across countries, which is unrealistic.</li>
</ul>
</li>
</ol>

<h4 id="current-status-modern-view">Current Status (Modern View)</h4>

<ul>
<li>The strict version of the H-O model is <strong>not strongly supported</strong> by empirical evidence.</li>
<li>The Leontief Paradox <strong>still appears</strong> in many studies, especially for the United States.</li>
<li>However, when researchers include <strong>human capital</strong>, <strong>technology differences</strong>, or use <strong>value-added trade</strong> data, the paradox is <strong>significantly reduced</strong> or disappears in many cases.</li>
<li>Modern trade theory has moved beyond simple H-O toward models that incorporate <strong>technology</strong>, <strong>economies of scale</strong>, <strong>product differentiation</strong>, and <strong>institutions</strong>.</li>
</ul>
