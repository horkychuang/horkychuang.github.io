<p><strong>Wen-Bin Chuang</strong><br />

<h2 id="stolper-samuelson-theorem">Stolper-Samuelson Theorem</h2>

<p>The <code>Stolper-Samuelson Theorem</code> (1941) is one of the most important results in the Heckscher-Ohlin model. It describes how <code>changes in goods prices</code> affect <code>real factor incomes</code>.</p>
<p><strong>Core Idea</strong>: An increase in the <code>relative price</code> of a good will raise the <code>real return</code> to the factor used intensively in that good and lower the real return to the other factor. In simpler terms:</p>
<ul>
<li>If the price of the <strong>labor-intensive</strong> good rises → <strong>Real wages rise</strong>, real return to capital falls.</li>
<li>If the price of the <strong>capital-intensive</strong> good rises → <strong>Real return to capital rises</strong>, real wages fall.</li>
</ul>
<p>“In the Heckscher-Ohlin world, trade <code>benefits the abundant factor</code> and hurts the scarce factor. This is the Stolper-Samuelson Theorem — one of the strongest and most politically relevant results in international trade theory.” In autarky, there is a <code>lower</code> relative price of the abundant factor; while the trade can raise the relative price. + S-S theorem, their real wages rise.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-54z7sQTW="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="core-assumptions-same-as-h-o-model">Core Assumptions (Same as H-O Model)</h4>

<table>
<thead>
<tr>
<th>Assumption</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>Two countries, Two goods, Two factors</td>
<td>Standard 2×2×2 model</td>
</tr>
<tr>

<td>In both goods and factor markets</td>
</tr>
<tr>
<td>Constant Returns to Scale (CRS)</td>
<td>Production functions are homogeneous of degree 1</td>
</tr>
<tr>
<td>Identical Homothetic Preferences</td>
<td>Same tastes across countries</td>
</tr>
<tr>
<td>Technology</td>
<td>Same technology in both countries</td>
</tr>
<tr>
<td>Factors mobile within country</td>
<td>Labor and Capital mobile between sectors</td>
</tr>
<tr>
<td>Factors immobile between countries</td>
<td>No international factor mobility</td>
</tr>
<tr>
<td>No transport costs / trade barriers</td>

</tr>

<h4 id="main-mechanism">Main Mechanism</h4>

<p>When a country <strong>opens to trade</strong>:</p>
<ul>
<li><strong>Labor-abundant country</strong> exports the <strong>labor-intensive</strong> good → price of labor-intensive good <strong>increases</strong> (relative to autarky).</li>
<li>According to Stolper-Samuelson:
<ul>
<li>Real wage of labor (<strong>abundant factor</strong>) <strong>rises</strong></li>
<li>Real return to capital (<strong>scarce factor</strong>) <strong>falls</strong></li>
</ul>
</li>
</ul>
<p>This happens because:</p>
<ul>
<li>Increased <code>demand</code> for the labor-intensive good → increased <code>demand</code> for labor → wages rise.</li>
<li>As resources move into the labor-intensive sector, capital becomes relatively <code>less demanded</code> → return to capital falls.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-HFfK3Y0V="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<ol>
<li><strong>Trade opens</strong> → World prices differ from autarky prices → Domestic relative goods price changes.</li>
<li>Firms in the sector with the rising price <code>expand production</code>; firms in the other sector <code>contract</code>.</li>
<li>Expanding sector demands more of its intensive factor; contracting sector releases factors.</li>
<li><strong>Factor markets clear</strong>: Total endowments are fixed, so factor prices must adjust to reallocate factors across sectors.</li>
<li>The factor used intensively in the expanding sector faces excess demand → its price rises.</li>
<li>The other factor faces excess supply → its price falls.</li>
<li><strong>Magnification</strong>: Factor price changes exceed output price changes, ensuring real returns move unambiguously.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-NHfMhcaZ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">

<table>
<thead>
<tr>
<th>Dimension</th>
<th>Prediction</th>
</tr>
</thead>

<tr>

<h4 id="empirical-evidence--testing-challenges">Empirical Evidence &amp; Testing Challenges</h4>

<ul>
<li><strong>Developing countries</strong>: <code>Trade liberalization</code> often raises demand for <code>unskilled labor (abundant factor)</code> → reduces wage inequality in some cases (e.g., Mexico post-NAFTA, though results are mixed).</li>
<li><strong>Advanced economies</strong>: Opening to low-wage country imports correlates with relative wage declines for low-skilled workers in manufacturing (consistent with SS if low-skilled labor is scarce relative to developing nations).</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>

<h4 id="testing-difficulties">Testing Difficulties:</h4>

<ol>
<li><strong>Simultaneity</strong>: Goods prices, technology, and endowments change simultaneously.</li>
<li><strong>Factor heterogeneity</strong>: &quot;Labor&quot; <code>isn't homogeneous</code>; skill, education, and region matter.</li>
<li><strong>Incomplete specialization</strong>: Many countries don't fully specialize, blurring price transmission.</li>
<li><strong>Trade vs. Technology</strong>: Skill-biased technological change often confounds SS predictions in advanced economies.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="modern-approaches">Modern Approaches:</h4>

<ul>
<li>Industry-level wage regressions controlling for technology and capital accumulation.</li>
<li>Natural experiments (e.g., tariff reductions, trade agreement implementations).</li>
<li>Structural estimation of H-O-SS systems (e.g., Hakura &amp; Rodrik, 1999; Goldberg &amp; Pavcnik, 2007).</li>
</ul>

<h4 id="key-takeaways">Key Takeaways</h4>

<ol>
<li><strong>Trade affects factor incomes, not just national income</strong>.</li>
<li><strong>Magnification effect</strong> ensures real returns move unambiguously for abundant/scarcity factors.</li>
<li><strong>Distributional consequences</strong> are central to trade policy design and political feasibility.</li>
<li>The theorem is a <strong>comparative static result</strong> about goods price → factor price transmission, applicable beyond trade (e.g., tariffs, subsidies, technological shocks).</li>
<li>While empirically nuanced, SS remains the foundational framework for understanding <strong>who wins and who loses from globalization</strong>.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h2 id="rybczynski-theorem-1955">Rybczynski Theorem (1955)</h2>

<p>The <code>Rybczynski Theorem</code> (1955) examines the effect of an increase in <code>factor endowment</code> on <code>output levels</code> at constant goods prices.  It explains how <code>economic growth</code> through factor accumulation leads to changes in the production structure — favoring the sector that uses the growing factor intensively. At <strong>constant relative goods prices</strong>, an increase in the endowment of one factor will:</p>
<ul>
<li>Increase the output of the good that <strong>intensively uses</strong> that factor (<strong>more than proportionally</strong>),</li>
<li>Decrease the output of the other good (<strong>absolute decline</strong> possible).</li>
</ul>
<p><strong>Core Idea</strong>: In simple terms: “If a country gets more of one factor (e.g., more labor), it will produce much more of the labor-intensive good and less of the capital-intensive good.” This is the <strong>supply-side dual</strong> of the Stolper-Samuelson theorem.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="main-mechanism-1">Main Mechanism</h4>

<p>Suppose <strong>Labor endowment increases</strong> while <code>goods prices remain constant</code>:</p>
<ol>
<li>At the initial wage-rental ratio (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.771ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1667 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(716,0)"><g data-mml-node="mo"><path data-c="2F" d="M423 750Q432 750 438 744T444 730Q444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z"></path></g></g><g data-mml-node="mi" transform="translate(1216,0)"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q161 442 183 430T214 408T225 388Q227 382 228 382T236 389Q284 441 347 441H350Q398 441 422 400Q430 381 430 363Q430 333 417 315T391 292T366 288Q346 288 334 299T322 328Q322 376 378 392Q356 405 342 405Q286 405 239 331Q229 315 224 298T190 165Q156 25 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container>), firms want to use <code>more labor</code>.</li>
<li>The <code>labor-intensive</code> sector (say Good <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container>) can absorb more labor profitably.</li>
<li>Resources (especially capital) are pulled away from the capital-intensive sector (Good <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.726ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 763 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44C" d="M66 637Q54 637 49 637T39 638T32 641T30 647T33 664T42 682Q44 683 56 683Q104 680 165 680Q288 680 306 683H316Q322 677 322 674T320 656Q316 643 310 637H298Q242 637 242 624Q242 619 292 477T343 333L346 336Q350 340 358 349T379 373T411 410T454 461Q546 568 561 587T577 618Q577 634 545 637Q528 637 528 647Q528 649 530 661Q533 676 535 679T549 683Q551 683 578 682T657 680Q684 680 713 681T746 682Q763 682 763 673Q763 669 760 657T755 643Q753 637 734 637Q662 632 617 587Q608 578 477 424L348 273L322 169Q295 62 295 57Q295 46 363 46Q379 46 384 45T390 35Q390 33 388 23Q384 6 382 4T366 1Q361 1 324 1T232 2Q170 2 138 2T102 1Q84 1 84 9Q84 14 87 24Q88 27 89 30T90 35T91 39T93 42T96 44T101 45T107 45T116 46T129 46Q168 47 180 50T198 63Q201 68 227 171L252 274L129 623Q128 624 127 625T125 627T122 629T118 631T113 633T105 634T96 635T83 636T66 637Z"></path></g></g></g></svg></mjx-container>).</li>
<li>Result:
<ul>
<li>Output of <strong>labor-intensive good (X)</strong> ↑ significantly</li>
<li>Output of <strong>capital-intensive good (Y)</strong> ↓</li>
</ul>
</li>
</ol>
<p>This is called the <strong>Rybczynski Effect</strong>.</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-mPvM9LNY="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">

<ul>
<li>Increase in labor shifts the box outward horizontally (more labor).</li>
<li>The efficiency locus (contract curve) shifts.</li>
<li>At constant factor prices (constant <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.771ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1667 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(716,0)"><g data-mml-node="mo"><path data-c="2F" d="M423 750Q432 750 438 744T444 730Q444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z"></path></g></g><g data-mml-node="mi" transform="translate(1216,0)"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q161 442 183 430T214 408T225 388Q227 382 228 382T236 389Q284 441 347 441H350Q398 441 422 400Q430 381 430 363Q430 333 417 315T391 292T366 288Q346 288 334 299T322 328Q322 376 378 392Q356 405 342 405Q286 405 239 331Q229 315 224 298T190 165Q156 25 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container>), the new equilibrium point moves such that:
<ul>

</li>

<ul>

<li><strong>At constant relative prices</strong>, production moves <strong>along the new PPF</strong> in a way that increases <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.928ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 852 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44B" d="M42 0H40Q26 0 26 11Q26 15 29 27Q33 41 36 43T55 46Q141 49 190 98Q200 108 306 224T411 342Q302 620 297 625Q288 636 234 637H206Q200 643 200 645T202 664Q206 677 212 683H226Q260 681 347 681Q380 681 408 681T453 682T473 682Q490 682 490 671Q490 670 488 658Q484 643 481 640T465 637Q434 634 411 620L488 426L541 485Q646 598 646 610Q646 628 622 635Q617 635 609 637Q594 637 594 648Q594 650 596 664Q600 677 606 683H618Q619 683 643 683T697 681T738 680Q828 680 837 683H845Q852 676 852 672Q850 647 840 637H824Q790 636 763 628T722 611T698 593L687 584Q687 585 592 480L505 384Q505 383 536 304T601 142T638 56Q648 47 699 46Q734 46 734 37Q734 35 732 23Q728 7 725 4T711 1Q708 1 678 1T589 2Q528 2 496 2T461 1Q444 1 444 10Q444 11 446 25Q448 35 450 39T455 44T464 46T480 47T506 54Q523 62 523 64Q522 64 476 181L429 299Q241 95 236 84Q232 76 232 72Q232 53 261 47Q262 47 267 47T273 46Q276 46 277 46T280 45T283 42T284 35Q284 26 282 19Q279 6 276 4T261 1Q258 1 243 1T201 2T142 2Q64 2 42 0Z"></path></g></g></g></svg></mjx-container> a lot and decreases <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.726ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 763 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44C" d="M66 637Q54 637 49 637T39 638T32 641T30 647T33 664T42 682Q44 683 56 683Q104 680 165 680Q288 680 306 683H316Q322 677 322 674T320 656Q316 643 310 637H298Q242 <h4 id="political-economy-implications-1">Political Economy Implications</h4>

<table>
<thead>
<tr>
<th>Context</th>
<th>Rybczynski Prediction</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Immigration/Refugee inflows</strong></td>
<td>Labor-intensive sectors (construction, agriculture, services) expand; capital-intensive sectors contract</td>
</tr>
<tr>
<td><strong>Foreign Direct Investment (FDI)</strong></td>
<td>Capital inflow expands manufacturing/infrastructure; labor-intensive traditional sectors shrink</td>
</tr>
<tr>
<td><strong>Natural resource discovery</strong></td>
<td>Resource-intensive sector booms; other sectors contract (pre-price feedback; distinct from Dutch Disease)</td>
</tr>
<tr>
<td><strong>Demographic transition</strong></td>
<td>Aging population (↓L) contracts labor-intensive sectors, relatively expands capital-intensive ones</td>
</tr>
<tr>
<td><strong>Industrial policy</strong></td>
<td>Subsidized capital accumulation shifts output toward capital-intensive industries, potentially crowding out others</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-Z5BxNnX3="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="empirical-evidence--limitations">Empirical Evidence &amp; Limitations</h4>

<h6 id="supportive-evidence">Supportive Evidence:</h6>
<ul>
<li><strong>Mariel Boatlift (1980)</strong>: Miami's labor supply shock expanded construction and low-skilled services, consistent with Rybczynski.</li>
<li><strong>EU Eastern Enlargement</strong>: Capital flows from West to East expanded capital-intensive manufacturing in accession countries.</li>
<li><strong>Chinese regional studies</strong>: Provinces with higher capital accumulation saw disproportionate growth in machinery/electronics output.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-YhO02ELH="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h5 id="intuitive-explanation">Intuitive Explanation</h5>

<p>When labor increases <strong>at fixed prices</strong>:</p>
<ul>
<li>The economy wants to use the extra labor.</li>
<li>Since good X uses labor more intensively, expanding X absorbs the new labor efficiently.</li>
<li>To release more capital (which is needed along with the extra capital in X), the economy must contract industry Y (capital-intensive), freeing up capital.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-tT1HL8Qe="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h5 id="link-to-trade-patterns-h-o-model">Link to Trade Patterns (H-O Model)</h5>

<ul>

<h5 id="key-takeaways-1">Key Takeaways</h5>

<ol>
<li><strong>Endowment changes reshape production structure</strong> even without price changes.</li>
<li><strong>Magnification effect</strong>: Output of the intensive sector grows faster than the factor itself.</li>
<li><strong>Contraction of the non-intensive sector</strong> is a necessary condition for factor price stability.</li>
<li>The theorem is a <strong>partial equilibrium/ceteris paribus result</strong> within a general equilibrium framework; in reality, price feedback (via Stolper-Samuelson) and demand adjustments modify outcomes.</li>
<li>Highly relevant for immigration policy, FDI strategy, demographic planning, and industrial development.</li>
</ol>
