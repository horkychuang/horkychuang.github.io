ta-class="lead" data-theme="gaia" lang="zh-TW" class="lead" data-marpit-pagination="1" style="--color:#000;--background-color:#fef9e7;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--class:lead;--theme:gaia;color:#000;background-color:#fef9e7;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="50" data-size="16:9" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h4 id="international-factor-mobility-and-foreign-investment">International Factor Mobility and Foreign Investment</h4>
<p><strong>Wen-Bin Chuang</strong><br />
<strong>2026-09-14</strong></p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-class="lead" data-theme="gaia" lang="zh-TW" class="lead" data-marpit-pagination="1" style="color:#000;" data-marpit-pagination-total="50" data-size="16:9" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-marpit-scope-oyHGYzAx="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="2" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h4 id="international-factor-mobility">International Factor Mobility</h4>

<p>In economics, the <code>factors of production</code> are primarily <strong>Labor</strong> (workers) and <strong>Capital</strong> (machinery, factories, financial investment).</p>
<ul>
<li><strong>Traditional Trade Theory (e.g., Heckscher-Ohlin)</strong> assumes that factors are <code>perfectly mobile domestically</code>but <code>completely immobile internationally</code>. Countries trade goods to <strong>indirectly</strong> &quot;exchange&quot; their abundant factors.</li>
<li><strong>International Factor Mobility</strong> relaxes this assumption, allowing labor <code>(migration)</code> and capital <code>(Foreign Direct Investment - FDI</code>, or <code>portfolio investment</code>) to move directly across borders.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-M3Y2AoEZ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h6 id="the-core-theoretical-debate-substitutes-vs-complements">The Core Theoretical Debate: Substitutes vs. Complements</h6>

<p>Does <code>factor mobility</code> replace <code>international trade</code>, or does it increase it? Economists have two main views:</p>
<h6 id="a-the-substitution-hypothesis-mundell-1957">A. The Substitution Hypothesis (Mundell, 1957)</h6>
<ul>
<li><strong>Logic:</strong> Based on the Heckscher-Ohlin model. If Country A is capital-abundant and Country B is labor-abundant, Country A will export capital-intensive goods to Country B.</li>
<li><strong>If factors can move:</strong> Capital will simply flow from Country A to Country B to chase higher returns, and labor might flow from B to A.</li>
<li><strong>Result:</strong> Factor mobility <strong>reduces or eliminates</strong> the need for trade in goods. They are <strong>substitutes</strong>.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-50QnsJv6="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h6 id="b-the-complementarity-hypothesis-markusen-1983-1984-helpman-1984">B. The Complementarity Hypothesis (Markusen, 1983, 1984; Helpman, 1984)</h6>

<ul>
<li><strong>Logic:</strong> In the real world, trade and factor mobility often feed each other, especially through <strong>Multinational Corporations (MNCs)</strong>.</li>
<li><strong>Vertical FDI:</strong> A US tech firm (capital/technology) builds a factory in Vietnam (labor). This capital movement <code>increases</code> trade, because the US must <code>export intermediate components</code> to Vietnam, and Vietnam exports the <code>finished goods</code> back to the US.</li>
<li><strong>Result:</strong> Factor mobility and trade are <strong>complements</strong>.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-FJ0Mh8kq="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h4 id="economic-effects-of-labor-mobility-migration">Economic Effects of <strong>Labor Mobility (Migration)</strong></h4>

<p>When workers move from a low-wage country (<code>Source</code>) to a high-wage country (<code>Host</code>), the global allocation of labor becomes more efficient, but there are distinct winners and losers.</p>
<h6 id="host-country-immigration">Host Country (Immigration)</h6>
<ul>
<li><strong>Labor (Native Workers):</strong> <strong>Lose</strong>. An increase in labor supply drives down the equilibrium wage for native workers (especially those with similar skills to the immigrants).</li>
<li><strong>Capital Owners / Firms:</strong> <strong>Win</strong>. Cheaper labor increases profit margins and the return on capital.</li>
<li><strong>Net National Welfare:</strong> <strong>Increases</strong>. The gains to capital owners and consumers (lower prices for services/goods) outweigh the losses to native workers. There is a &quot;migration dividend.&quot;</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-h2dUa7x2="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h6 id="source-country-emigration">Source Country (Emigration)</h6>

<ul>
<li><strong>Labor (Those who stay):</strong> <strong>Win</strong>. With fewer workers, the marginal product of labor rises, leading to higher wages for those remaining.</li>
<li><strong>Capital Owners:</strong> <strong>Lose</strong>. Higher wages reduce profit margins and the return on domestic capital.</li>
<li><strong>Net National Welfare:</strong> <strong>Increases</strong> (due to higher wages for stayers + <strong>remittances</strong> sent back by migrants).</li>
<li><strong>Caveat (Brain Drain):</strong> If the emigrants are highly skilled (doctors, engineers), the source country loses its most valuable human capital, which can severely harm long-term development.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-vYvvVZYp="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h4 id="economic-effects-of-capital-mobility-fdi">Economic Effects of <strong>Capital Mobility (FDI)</strong></h4>

<p>When <code>capital</code> flows from a capital-abundant country (<code>Source</code>) to a capital-scarce country (<code>Host</code>), it seeks higher returns.</p>
<h6 id="host-country-capital-inflow">Host Country (Capital Inflow)</h6>
<ul>
<li><strong>Labor:</strong> <strong>Wins</strong>. More capital per worker increases labor productivity, driving up wages.</li>
<li><strong>Domestic Capital Owners:</strong> <strong>Lose</strong>. Increased competition from foreign capital drives down the domestic return on capital (interest rates/profits fall).</li>
<li><strong>Net National Welfare:</strong> <strong>Increases</strong>. The wage gains for labor outweigh the losses to domestic capital owners.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-bIXjCOhK="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h6 id="source-country-capital-outflow">Source Country (Capital Outflow)</h6>

<ul>
<li><strong>Capital Owners:</strong> <strong>Win</strong>. They earn higher returns on their investments abroad than they would at home.</li>
<li><strong>Labor:</strong> <strong>Loses</strong>. As capital leaves, the capital-to-labor ratio falls, reducing labor productivity and pushing domestic wages down.</li>
<li><strong>Net National Welfare:</strong> <strong>Increases</strong>. The higher returns earned by capital owners outweigh the wage losses of domestic workers.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-syJVtipG="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h6 id="the-political-economy-puzzle-why-is-capital-free-but-labor-restricted">The Political Economy Puzzle: Why is Capital Free but Labor Restricted?</h6>

<p>If both labor and capital mobility create a net national welfare gain, why do governments <strong>fiercely restrict</strong> immigration while actively competing to attract FDI?</p>
<ol>
<li><strong>Distributional Conflict &amp; Voting Power</strong>:
<ul>
<li>The losers from immigration (<code>native low-skilled workers</code>) are numerous, geographically concentrated, and have voting power. They fiercely oppose it.</li>
<li>The losers from capital outflow (<code>domestic capital owners</code>) are wealthy and influential, and they <code>lobby</code> the government to <code>allow</code> capital to leave (or offer tax breaks to keep it). The winners from capital inflow (labor) are diffuse and rarely organize to demand more FDI.</li>
</ul>
</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-X2jHRYif="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<ol start="2">
<li><strong>Fiscal Burden:</strong> Immigrants may use public services (schools, healthcare, infrastructure). If they are low-skilled, the short-term fiscal cost to the host government can be perceived as a burden, unlike capital, which pays corporate taxes.</li>
<li><strong>Cultural and Social Friction:</strong> Labor mobility involves people, bringing cultural, linguistic, and social changes that trigger political backlash. Capital is impersonal and faces no such resistance.</li>
<li><strong>Sovereignty and Security:</strong> Governments view control over their borders and population as a core element of national sovereignty. Capital flows are seen as purely economic.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-9Klpteu5="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="11" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h4 id="key-takeaways">Key Takeaways</h4>

<ol>
<li><strong>Factor mobility reallocates resources globally</strong>, increasing total world output and efficiency.</li>
<li><strong>It creates sharp domestic winners and losers.</strong> In the host country, the abundant factor gains and the scarce factor loses (and vice versa for the source country).</li>
<li><strong>Trade and Factor Mobility can be both substitutes and complements</strong>, depending on whether the investment is horizontal (replacing trade) or vertical (creating global supply chains).</li>
<li><strong>Political reality diverges from economic theory:</strong> Capital is highly mobile globally due to its political power and lack of social friction, while labor mobility remains heavily restricted due to distributional conflicts and national sovereignty concerns.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-atgulDi2="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h3 id="mundell-model-1957-for-substitution">Mundell Model (1957) for Substitution</h3>

<p>Mundell used the standard <strong>Heckscher-Ohlin (H-O) framework</strong>:</p>
<ul>
<li><strong>Two Countries:</strong> Country A (<code>Capital-abundant</code>) and Country B (<code>Labor-abundant</code>).</li>
<li><strong>Two Goods:</strong> Good X (<code>Capital-intensive</code>) and Good Y (<code>Labor-intensive</code>).</li>
<li>Initial State: There is free trade in goods , but <code>zero factor mobility</code>.
<ul>
<li>Because of their different factor endowments, Country A exports Good X, and Country B exports Good Y. Because capital is scarce in Country B, the return on capital (interest rate/profit) is higher in B than in A.</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-XZuEib7j="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="13" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h5 id="the-core-theorem-perfect-substitution">The Core Theorem: Perfect Substitution</h5>

<p>This is the moment of Mundell’s 1957 paper. As <code>capital moves from A to B</code>, the production capacities of both countries change.</p>
<ul>
<li>Country B, now flush with capital, starts producing more of the capital-intensive Good X <code>domestically</code>. It no longer needs to import Good X from Country A.</li>
<li>Country A, having lost capital, shrinks its production of Good X and shifts toward Good Y.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-FoOFOKU2="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<ul>
<li>
<p><strong>The Conclusion (The Substitution Theorem):</strong> The movement of capital <strong>exactly offsets</strong> the need to trade goods. Capital flows from the capital-abundant country to the labor-abundant country until the capital-labor ratios in both countries are identical.</p>
</li>
<li>
<p>Once factor endowments are <code>equalized</code>, <code>advantage disappears</code>, and trade in goods drops to zero. Therefore, under Mundell's strict assumptions, trade in goods and international factor mobility are <strong>PERFECT SUBSTITUTES</strong>. You only need one or the other to achieve global efficiency.</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-68maecSI="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">

<h3 id="management-and-international-business-view">Management and International Business View</h3>
<h5 id="stephen-hymer-1960-monopolistic-advantage-theory">Stephen Hymer (1960): Monopolistic Advantage Theory</h5>

<ul>
<li><strong>The Core Question:</strong> Why would a company go abroad at all? Foreign firms have a &quot;home-field advantage&quot; (they know the language, culture, laws, and customers). A foreign entrant suffers from a <strong>&quot;liability of foreignness.&quot;</strong></li>
<li><strong>The Simple Answer:</strong> A firm will only undertake the risk and cost of FDI if it possesses a <strong>unique, monopolistic advantage</strong> that local competitors do not have and cannot easily copy. This advantage compensates for the <code>liability of foreignness.</code></li>
<li><strong>Key Concept:</strong> <code>Firm-Specific Advantages</code> (FSAs), such as proprietary technology, a world-famous brand, or superior management skills.</li>
<li><strong>Simple Example:</strong> Apple opens stores in China. Despite not knowing the local culture as well as Chinese firms, Apple succeeds because it has a <code>unique, globally desired product</code> and brand (its monopolistic advantage) that local firms cannot easily replicate.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-IVRT8Dai="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h5 id="raymond-vernon-1966-product-life-cycle-plc-theory">Raymond Vernon (1966): Product Life Cycle (PLC) Theory</h5>

<ul>
<li><strong>The Core Question:</strong> <em>When</em> and <em>where</em> does a company decide to produce abroad?</li>
<li>The Simple Answer:  The location of production shifts as a <code>product matures</code>. It happens in three stages:
<ol>
<li><strong>New Product:</strong> Invented and produced in the home country (e.g., the US) to be close to R&amp;D and wealthy early adopters. Exported to others.</li>
<li><strong>Maturing Product:</strong> Demand grows abroad. To save on shipping and tariffs, the firm builds factories in <em>other advanced countries</em> (e.g., Europe) to serve those local markets.</li>
<li><strong>Standardized Product:</strong> The product becomes a basic commodity. Competition is now all about price. The firm moves production to <em>developing countries</em> (e.g., Vietnam, Mexico) to take advantage of cheap labor, and exports the finished good back to the home country.</li>
</ol>
</li>
<li><strong>Simple Example:</strong> The personal computer. Invented and made in the US (1970s). As demand grew, assembly moved to Europe and Japan (1980s). Today, PCs are standardized, so manufacturing is almost entirely in China and Southeast Asia for low-cost assembly.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-zBnviznl="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h5 id="buckley--casson-1976-internalization-theory">Buckley &amp; Casson (1976): Internalization Theory</h5>

<ul>
<li><strong>The Core Question:</strong> If a company has a <code>great technology advantages</code>, why doesn't it just <em>license</em> it to a local foreign company and collect a royalty fee? Why go through the hassle of building its own factory (FDI)?</li>
<li><strong>The Simple Answer:</strong> Because markets for knowledge and technology are <strong>imperfect and risky</strong>. If you license your secret technology to a foreign firm, they might steal it, produce low-quality goods that ruin your brand, or become a future competitor. Therefore, it is safer and more profitable to <strong>&quot;internalize&quot;</strong> the operation—meaning you keep it in-house by owning the foreign subsidiary yourself.</li>
<li><strong>Key Concept:</strong> Avoiding <code>market failure</code> in the transfer of knowledge.</li>
<li><strong>Simple Example:</strong> Coca-Cola has a secret syrup formula. It <em>could</em> license the recipe to an independent bottler in Brazil. But to prevent the recipe from being stolen or the quality from dropping, Coca-Cola uses FDI to own and strictly control its bottling operations (or tightly control joint ventures), keeping the process <code>internal</code>.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-hspGbGXQ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h5 id="john-dunning-1980-the-oli-paradigm-eclectic-paradigm">John Dunning (1980): The OLI Paradigm (Eclectic Paradigm)</h5>

<ul>
<li><strong>The Core Question:</strong> What is the <em>complete</em> checklist of conditions required for a firm to engage in FDI?
<ul>
<li>The Simple Answer:  Dunning brilliantly combined the previous three theories into one master framework. He argued that a firm will only choose FDI if all three of the following conditions are met simultaneously:</li>
</ul>
</li>
</ul>
<ol>
<li><strong>O - Ownership Advantage</strong> (from Hymer): The firm must have a unique asset (brand, tech, patent) that gives it an edge over local rivals.</li>
<li><strong>L - Location Advantage</strong> (from Vernon/Trade Theory): The foreign country must offer something attractive (cheap labor, large market, natural resources, or favorable taxes) that makes producing <em>there</em> better than producing at home.</li>
<li><strong>I - Internalization Advantage</strong> (from Buckley &amp; Casson): It must be more beneficial for the firm to own and control the foreign operation itself, rather than licensing or franchising it to a third party.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-CDBgBtfa="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h4 id="summary-1">Summary</h4>

<table>

<tr>

<td style="text-align:left">Product Life Cycle</td>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-943At0mE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h2 id="economic-view">Economic View</h2>

<ul>
<li>Economists like <strong>James Markusen (1983, 1984)</strong> and <strong>Elhanan Helpman (1984)</strong> developed the <strong>Complementarity Hypothesis</strong> to explain this reality.</li>
<li>They proved that under real-world conditions (imperfect competition, economies of scale, and fragmented production), factor mobility actually <code>creates</code> and <code>increases</code>international trade.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-jfmNFwoE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="30" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h5 id="1-vertical-fdi-and-global-value-chains-helpman-1984">1. Vertical FDI and Global Value Chains (Helpman, 1984)</h5>

<p>Elhanan Helpman shifted the focus from <code>where</code> capital goes to <code>how</code> production is organized.</p>
<ul>
<li><strong>The Logic:</strong> In the real world, production is not a single step; it is a chain of stages (R&amp;D →→ component manufacturing →→ assembly →→ marketing).</li>
<li><strong>The Mechanism:</strong> A Multinational Corporation (MNC) uses FDI to <code>fragment</code> its production process across borders to exploit different countries' <code>comparative advantages</code>. For example, a US tech firm might keep R&amp;D in California (capital/skill-abundant) but use FDI to build an assembly plant in Vietnam (labor-abundant).</li>
<li><strong>The Complementarity:</strong> This capital movement <strong>requires</strong> the physical movement of goods. The US parent company must <code>export intermediate components</code>, <code>machinery</code>, and <code>blueprints</code> to the Vietnamese affiliate. The affiliate then exports the finished good back to the US or to third countries.</li>
<li><strong>Result:</strong> <strong>Vertical FDI directly generates massive trade in intermediate goods.</strong> Trade and FDI are complements because the global supply chain relies on both.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-e5k3Gf21="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="31" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h4 id="2-economies-of-scale-and-intra-firm-trade-markusen-1983-1984">2. Economies of Scale and Intra-Firm Trade (Markusen, 1983, 1984)</h4>

<p>James Markusen’s <code>crucial contribution</code> was dropping Mundell’s assumption of <code>constant returns to scale</code> and <code>perfect competition.</code> Markusen introduced <strong>increasing returns to scale (economies of scale)</strong> and <strong>imperfect competition (oligopoly/monopolistic competition)</strong>.</p>
<ul>
<li><strong>The Mundell Flaw:</strong> <code>Mundell</code> assumed that if capital moves to Country B, Country B just produces the good locally, replacing imports. But <code>Markusen</code> pointed out that if a single plant in Country B is too small to achieve the minimum efficient scale, it will fail.</li>
<li><strong>The Markusen Solution (Multi-Plant Firms):</strong> To achieve economies of scale, an MNC uses FDI to build a network of plants <code>globally</code>. However, to keep costs down, the parent company <code>centralizes</code> the production of core, highly <code>specialized components</code> or capital equipment at the home plant.</li>
<li><strong>The Mechanism (Intra-firm Trade):</strong> The parent company then uses <strong>FDI</strong> to establish foreign distribution or assembly affiliates, and uses <strong>trade</strong> to continuously ship those specialized core components from the home plant to the foreign affiliates.</li>
<li><strong>Result:</strong> FDI does not replace trade; it <strong>locks in</strong> a continuous flow of <code>intra-firm trade</code>. The larger the FDI network, the more intermediate parts the parent company exports to its own subsidiaries.</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-vOpGqZKy="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="32" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<h5 id="3-the-knowledge-capital-model-markusen-1995-carr-markusen-et-al-2001">3. The &quot;Knowledge-Capital&quot; Model (Markusen, 1995; Carr, Markusen, et al., 2001)</h5>

<p>Markusen later synthesized his work into the <strong>Knowledge-Capital (KK) model</strong>, which mathematically unified both <code>Horizontal FDI</code> (duplicating the same production abroad) and <code>Vertical FDI</code> (fragmenting production).</p>
<p>The KK model proves that trade and FDI are complements based on the specific characteristics of the two countries:</p>
<ol>
<li><strong>Similarity in Size and Wealth:</strong> If Country A and Country B are <code>similar</code> in <code>size and wealth</code>, firms engage in <strong>Horizontal FDI</strong> to avoid trade costs (tariffs/transport) and be close to consumers. Even here, trade and FDI coexist because the MNC still trades specialized services and headquarters' knowledge.</li>
<li><strong>Differences in Factor Endowments:</strong> If Country A is skill-abundant and Country B is unskilled-labor-abundant, firms engage in <strong>Vertical FDI</strong>. As proven by Helpman, this heavily <em>complements</em> trade in intermediate goods.</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="helpmans-vertical-fdi-model-1984">Helpman's Vertical FDI Model (1984)</h4>

<p>Before Helpman, trade theory treated firms as <strong>black boxes</strong> — they just turned inputs into outputs. Helpman opened the box and modeled the <strong>internal structure of the multinational firm (MNF)</strong>:</p>
<ol>
<li><strong>Firms possess &quot;headquarters services&quot; (H)</strong> — knowledge, management, brand, R&amp;D — that are <strong>non-rival</strong> (can be used in multiple plants simultaneously at zero marginal cost).</li>
<li><strong>Setting up headquarters is costly</strong> (fixed cost), but once established, it can serve plants in multiple countries.</li>
<li><strong>Production can be fragmented</strong>: Different stages can be located in different countries to exploit factor-price differences.</li>
</ol>
<p>This is what makes FDI and trade <strong>complements</strong>: the headquarters sends knowledge/capital (FDI) to foreign plants, and those plants ship <code>intermediate goods back (Trade)</code>.</p>

<h6 id="model-setup-1">Model Setup</h6>

<ul>
<li>
<p><strong>Two countries</strong>: Home (H) and Foreign (F), <strong>Two factors</strong>: Capital (K) and Labor (L)</p>
</li>
<li>
<p>Two goods:</p>
<ul>
<li>Y = a <code>homogeneous</code> numeraire good (produced under perfect competition, constant returns)</li>
<li>X = a <code>differentiated</code> good (produced by firms with market power)</li>
</ul>
</li>
<li>
<p><strong>Factor endowments</strong>: Country H is capital-abundant, Country F is labor-abundant</p>

<li><strong>Headquarters-intensive stage</strong> (R&amp;D, management) → stays in Home (capital/skill-abundant)</li>
<li><strong>Labor-intensive stage</strong> (assembly, manufacturing) → moves to Foreign (labor-abundant)</li>
</ul>

<h5 id="empirical-implications">Empirical Implications</h5>

<p><code>Helpman's model</code> makes several testable predictions that have been confirmed by data:</p>
<ol>
<li><strong>Vertical FDI is larger between countries with different factor endowments</strong> (e.g., US-Mexico, Germany-Poland)</li>
<li><strong>Intra-firm trade is a large share of total trade</strong> (about 30% of US trade is <code>intra-firm</code>)</li>
<li><strong>FDI and trade are positively correlated</strong> across country pairs</li>
<li><strong>Lower trade costs increase both FDI and trade</strong> (they are complements, not substitutes)</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-scope-2AMSrtda="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="50" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="50" data-size="16:9">
<p><code>Helpman's 1984 model</code> revolutionized international economics by showing that</p>
<ul>
<li>
<p>the multinational firm is not just a vehicle for moving capital — it is a network that connects production stages across borders through trade.</p>
</li>
<li>
<p>The mathematical essence is simple but profound:</p>
<ul>
