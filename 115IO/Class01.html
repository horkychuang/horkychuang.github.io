ta-class="lead" data-theme="gaia" lang="zh-TW" class="lead" data-marpit-pagination="1" style="--color:#000;--background-color:#fef9e7;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--class:lead;--theme:gaia;color:#000;background-color:#fef9e7;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="40" data-size="16:9" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">

<h5 id="%E7%AB%B6%E7%88%AD%E8%80%85%E5%92%8C%E7%AB%B6%E7%88%AD">競爭者和競爭</h5>
<p><strong>國企 Wen-Bin Chuang</strong><br />
<strong>2026-09-14</strong></p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="competition-%E7%AB%B6%E7%88%AD">Competition 競爭</h4>

<ul>
<li>如果某一家企業的<code>策略選擇</code>對另一家企業的<code>業績(績效)</code>產生不利影響，則它們互為<code>競爭對手</code>。</li>
<li>一家企業可能同時在多個投入市場和產出市場擁有競爭對手。</li>
<li>競爭可以是<code>直接的</code>，也可以是<code>間接的</code>。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-TU90934e="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E7%9B%B4%E6%8E%A5%E8%88%87%E9%96%93%E6%8E%A5%E7%AB%B6%E7%88%AD%E5%B0%8D%E6%89%8B">直接與間接競爭對手</h4>

<ul>
<li><strong>直接</strong>競爭對手：某一家企業的策略選擇<code>直接影響</code>另一家企業的業績。</li>
<li><strong>間接</strong>競爭對手：某一家企業的策略選擇會<code>通過第三家企業</code>(? Who?協力廠商 ?)的反應，<code>間接影響</code>另一家企業的業績。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-IYpV4Lg0="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E6%9B%BF%E4%BB%A3%E5%93%81%E7%9A%84%E7%89%B9%E5%BE%B5">替代品的特徵</h4>

<ul>
<li>實際中，任何生產<strong>替代品</strong>的企業都可以視為 <strong>競爭對手</strong>。</li>
<li>兩種產品若具備以下特徵，通常互為緊密替代品：
<ul>
<li>具有相似的<strong>性能特徵</strong></li>
<li>使用<strong>場合相似</strong></li>
<li>在同一<strong>地理區域銷售</strong></li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-LDnhqxhE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E6%80%A7%E8%83%BD%E7%89%B9%E5%BE%B5">性能特徵</h4>

<ul>
<li>
<p><strong>性能特徵</strong> 描述產品為顧客提供的<strong>功能</strong>。</p>
</li>
<li>
<p>屬於同一類別或同一<code>標準行業分類(SIC)</code>的 產品未必是替代品（例如：賓士與現代），若其性能特徵差異巨大。</p>
<ul>
<li>汽車行業的例子：座位容量,    外觀吸引力,    動力與操控性,    可靠性</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-5MNEXq48="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E6%A8%99%E6%BA%96%E8%A1%8C%E6%A5%AD%E5%88%86%E9%A1%9Esic">標準行業分類(SIC)</h4>

<ul>
<li>
<p><code>產品</code>和<code>服務</code>通過 代碼進行識別。</p>
<ul>
<li><a href="https://www.stat.gov.tw/standardindustrialclassification.aspx?n=3144&amp;sms=0&amp;rid=8">https://www.stat.gov.tw/standardindustrialclassification.aspx?n=3144&amp;sms=0&amp;rid=8</a></li>
<li>每一位數字代表更細化的分類層級。</li>
</ul>
</li>
<li>
<p>屬於同一類別或相同SIC代碼的產品<strong>未必是替代品</strong>。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="%E5%9C%B0%E7%90%86%E5%8D%80%E4%BD%8D%E7%AB%B6%E7%88%AD%E5%B0%8D%E6%89%8B%E7%9A%84%E8%AD%98%E5%88%A5">地理區位競爭對手的識別</h4>

<ul>
<li>當企業在不同地理區域銷售時，需分別識<code>個別區域內</code>的競爭對手。
<ul>
<li>位於兩個不同地理市場中的相同產品，由於<strong>運輸成本</strong>的存在，並非替代品。</li>
<li>企業不應僅依賴<strong>行政區</strong>來劃分，而應關注商品和服務在各<strong>區域間的流動情況</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-nFhy3sgS="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E8%AD%98%E5%88%A5%E5%8D%80%E5%9F%9F%E5%85%A7%E7%9A%84%E7%AB%B6%E7%88%AD%E5%B0%8D%E6%89%8B">識別區域內的競爭對手</h4>

<ul>
<li>Step 1:確定<code>顧客來源地</code></li>
<li>Step 2:調查該區域居民的<code>購物地點</code>
<ul>
<li>對於通過<strong>網路平台銷售的產品（如圖書、藥品）</strong>，識別地理區位的競爭變得更為困難。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-GAVLRU2q="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="13" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="market-structure%E5%B8%82%E5%A0%B4%E7%B5%90%E6%A7%8B">Market Structure市場結構</h4>

<ul>
<li>
<p><code>產業經濟學</code>定義的市場通常以其<strong>集中程度</strong>來描述。</p>
<ul>
<li><code>壟斷（獨占）</code>是集中度最高的極端情況: 僅有<code>一個</code>賣家, <strong>市場控制力強</strong>。</li>
<li><code>完全競爭</code>是另一極端 : 賣家數量眾多且不可計數, <code>個別企業</code>對市場的<strong>控制力微弱</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-07hD1p7o="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">

<h6 id="%E7%94%A2%E6%A5%AD%E9%9B%86%E4%B8%AD%E5%BA%A6concentration-ratio-crn">產業集中度（Concentration Ratio, CRn）</h6>

<ul>
<li><strong>定義</strong>：某產業中<strong>前 n 家最大企業</strong>的市場佔有率總和，最常用的是 <strong>CR4</strong>（前四大）與 <strong>CR8</strong>（前八大）。</li>
</ul>

<table>
<thead>
<tr>

<th><strong>完全競爭</strong> <strong>(Perfect Competition)</strong></th>
<th><strong>壟斷競爭</strong> <strong>(Monopolistic Competition)</strong></th>
<th><strong>寡頭壟斷</strong> <strong>(Oligopoly)</strong></th>
<th><strong>完全壟斷</strong> <strong>(Monopoly)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>典型行業</strong></td>

<td>餐飲、服裝、洗髮水</td>
<td>飛機製造、電信運營商、汽車</td>
<td>自來水、電網、專利藥</td>
</tr>
<tr>
<td><strong>企業數量</strong></td>
<td>無數家</td>
<td>很多家</td>
<td>少數幾家（2-10家）</td>

</tr>
<tr>
<td><strong>產品差異</strong></td>
<td>完全無差異（同質）</td>
<td>有差異（品牌/特色）</td>
<td>同質或差異皆可</td>
<td>獨一無二（無替代品）</td>
</tr>
<tr>
<td><strong>進入壁壘</strong></td>
<td>無</td>
<td>較低</td>

<td>極高（不可逾越）</td>
</tr>
<tr>

<td>極強（受制於政府管制）</td>
</tr>
<tr>

<h4 id="perfect-competition%E5%AE%8C%E5%85%A8%E7%AB%B6%E7%88%AD">Perfect Competition完全競爭</h4>

<ul>
<li>眾多賣家出售 <strong>同質產品</strong></li>
<li>眾多<strong>資訊充分</strong>的買家</li>
<li>消費者可<strong>無成本地</strong>比價</li>
<li>賣家可<strong>無成本地 自由進出市場</strong></li>
<li>每家企業面臨<strong>無限彈性的需求曲線</strong></li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-EBUY0Rcs="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E8%BE%B2%E7%94%A2%E5%93%81%E5%B8%82%E5%A0%B4%E5%A6%82%E5%85%A8%E7%90%83%E5%B0%8F%E9%BA%A5%E5%A4%A7%E8%B1%86%E6%88%96%E7%8E%89%E7%B1%B3%E5%B8%82%E5%A0%B4">農產品市場（如全球小麥、大豆或玉米市場）</h4>

<ul>
<li>
<p>假設你是一位種植小麥的農民。全球有成千上萬的農民在種植小麥,且消費者（如麵粉廠）認為張三的小麥和李四的小麥沒有任何區別（<strong>完全同質</strong>） 。</p>
</li>
<li>
<p>如果你試圖把小麥價格提高 1 毛錢，麵粉廠會立刻轉向其他農民購買，你的銷量會瞬間降為零。</p>
</li>
<li>
<p>因此，<code>單個農民</code>對<code>市場價格</code>沒有任何影響力，只能被動接受市場供需決定的均衡價格。</p>
</li>
<li>
<p>現實中不存在100%完美的完全競爭，農產品市場是最接近的理論模型。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-qBRKB8AA="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E6%BF%80%E7%83%88%E5%83%B9%E6%A0%BC%E7%AB%B6%E7%88%AD%E7%9A%84%E6%A2%9D%E4%BB%B6">激烈價格競爭的條件</h4>

<p>即使<strong>未完全滿足理想條件</strong>，只要滿足以下兩項或以上，價格競爭仍可能非常激烈：</p>
<ul>
<li>賣家眾多</li>
<li>顧客認為<strong>產品同質</strong></li>
<li><strong>產能過剩</strong></li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-vFokjk0y="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="homogeneous-products%E5%90%8C%E8%B3%AA%E7%94%A2%E5%93%81">Homogeneous Products同質產品</h4>

<ul>
<li><strong>降價</strong>可帶來三方面收入增長：
<ul>
<li>原有顧客購買更多</li>
<li>吸引新顧客</li>
<li>競爭對手的顧客轉向本企業</li>
<li><strong>下下策！！！！</strong></li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-9gS3i6Bc="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="excess-capacity%E7%94%A2%E8%83%BD%E9%81%8E%E5%89%A9">Excess Capacity產能過剩</h4>

<ul>
<li>企業若<code>未滿負荷運營</code>，可將價格定在平均成本以下，以覆蓋可變動成本。</li>
<li>若整個行業產能過剩，價格可能低於平均成本，部分企業可能選擇退出。</li>
<li>若退出不可行（例如產能具有行業專用性）， 產能過剩與虧損將持續一段時間。</li>
<li><strong>真的不好嗎?</strong></li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-4rAQTGtE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="monopoly-%E7%8D%A8%E5%8D%A0%E5%A3%9F%E6%96%B7">Monopoly 獨占(壟斷)</h4>

<ul>
<li>在市場上幾乎不受競爭約束。</li>
<li>可在<code>需求允許範圍</code>內<strong>自由設定價格或品質</strong>。</li>
<li>若存在邊緣小企業，其決策對獨占者的利潤影響甚微。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-6pCR2f2k="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="24" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h6 id="%E5%9C%A8%E5%A4%A7%E5%A4%9A%E6%95%B8%E5%9F%8E%E5%B8%82%E5%8F%AA%E6%9C%89%E4%B8%80%E5%AE%B6%E8%87%AA%E4%BE%86%E6%B0%B4%E5%85%AC%E5%8F%B8%E7%82%BA%E4%BD%A0%E6%8F%90%E4%BE%9B%E8%87%AA%E4%BE%86%E6%B0%B4">在大多數城市，只有一家自來水公司為你提供自來水。</h6>

<ul>
<li>為什麼是壟斷？ 這是一個<strong>自然壟斷（Natural Monopoly）</strong>。如果允許多家公司競爭，每家公司都要在城市地下重新鋪設一套水管網路，這會導致巨大的資源浪費和極高的成本。因此，由一家企業統一鋪設管網、集中供水是成本最低、效率最高的<strong>規模經濟</strong>。</li>
<li>結果：由於沒有其他選擇，自來水公司是絕對的壟斷者。但為了防止它利用壟斷地位收取天價水費，政府通常會對其進行嚴格的<strong>價格管制（Price Regulation）<strong>和</strong>品質監督</strong>。</li>
<li>其他壟斷案例：擁有<code>特效藥</code>核心專利的製藥廠在專利期內的法定壟斷；某些國家的煙草專賣局。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-ON7c3m4s="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E7%8D%A8%E5%8D%A0%E8%88%87%E5%89%B5%E6%96%B0">獨占與創新</h4>

<p>獨占者有時是因<strong>生產效率更高</strong>或更充分滿足<strong>消費者需求</strong>而成功取得壟斷地位。</p>
<ul>
<li>因此，在企業通過<code>正當競爭</code>成為獨占者的情形下，消費者可能成為淨受益者。</li>
<li>現主時, 獨占者比完全競爭市場中的企業更有動力<strong>創新</strong>，因其能繼續維持壟斷地位, 來獲取部分創新收益。由於消費者同樣從創新中受益，若長期限制 獨占者利潤，反而會損害消費者利益。</li>
<li><strong>熊彼得說</strong></li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-DEfPd61B="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E7%8D%A8%E5%8D%A0%E6%80%A7%E7%AB%B6%E7%88%AD">獨占性競爭</h4>

<ul>
<li>
<p>賣家眾多，且各賣家自認自身行為不會<strong>顯著影響競爭對手</strong>。</p>
<ul>
<li>
<p>每個賣家銷售 <strong>差異化產品</strong>。</p>
</li>
<li>
<p>與完全競爭不同，獨占競爭中各企業面臨向下傾斜的需求曲線，而非水平線。</p>
<ul>
<li>代表有自主決定價格的能力</li>
</ul>
</li>
</ul>
</li>
<li>
<p>在一個城市裡，有星巴克、85度C，也有無數街角的獨立咖啡館。雖然它們賣的都是<strong>咖啡</strong>（核心功能相同），但它們在口味、店內環境、品牌文化、地理位置上存在<code>一點點</code>差異化。因為這種<strong>差異化</strong>，街角咖啡館即使比隔壁店貴 2 塊錢，依然會有喜歡它特定口味的老顧客光顧（擁有局部的壟斷定價權）。</p>
<ul>
<li>
<p>但同時，如果它漲價太離譜，顧客就會流失到其他咖啡店（面臨激烈的競爭）。</p>
</li>
<li>
<p>開一家新咖啡館的資金和技術門檻不高（低進入壁壘）。</p>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-QKFtzr2m="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E5%9E%82%E7%9B%B4%E8%88%87%E6%B0%B4%E5%B9%B3%E5%B7%AE%E7%95%B0%E5%8C%96">垂直與水平差異化</h4>

<ul>
<li>
<p><code>垂直差異化</code>產品：<code>品質</code>差異明確（如高端 vs. 低端）</p>
</li>
<li>
<p><code>水平差異化</code>產品：<code>產品特性</code>不同，以吸引不同消費群體</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-Hy4NqHCu="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h6 id="%E6%B1%BD%E8%BB%8A%E6%A5%AD---lexus-vs-toyota">汽車業 - Lexus vs Toyota</h6>

<ul>
<li>策略核心：同一集團內的品質層級分化</li>
<li>豐田汽車建立了清晰的品牌層級體系，最高層級包括 Toyota、Lexus、Scion、Daihatsu、Hino 等五個傘品牌</li>
<li><code>垂直差異化</code>特徵：
<ul>
<li>Toyota：以品質穩定、可靠耐用聞名的<code>大眾市場</code>定位</li>
<li>Lexus：高端豪華品牌，提供更卓越的工藝、性能和服務品質</li>
<li>消費者普遍認同 Lexus 的品質高於 Toyota，這是客觀一致的判斷</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-YK7Duahb="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">

<li>iPhone 產品層級（2026年）：

<li>價格差異直接反映在性能和功能上，消費者可明確判斷優劣</li>

</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-zOJrSU1Y="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="30" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E6%9C%8D%E8%A3%9D%E9%9B%B6%E5%94%AE---banana-republic-vs-gap-vs-old-navy">服裝零售 - Banana Republic vs GAP vs Old Navy</h4>

<ul>
<li>策略核心：同一集團內的三層級定位</li>
<li>這三個品牌都屬於 <strong>Gap Inc</strong>.，但定位於不同品質與價格層級 ：
<ul>

</ul>
</li>
<li>垂直差異化邏輯： 消費者可以客觀判斷 Banana Republic 的產品品質高於 GAP，GAP 高於 Old Navy，這種品質差異反映在面料、剪裁、設計細節等方面。</li>
</ul>

<h4 id="%E5%9C%B0%E7%90%86%E5%8D%80%E4%BD%8D%E8%88%87%E6%B0%B4%E5%B9%B3%E5%B7%AE%E7%95%B0%E5%8C%96">地理區位與水平差異化</h4>

<h4 id="%E7%8D%A8%E7%89%B9%E5%81%8F%E5%A5%BD-idiosyncratic-preferences">獨特偏好 Idiosyncratic Preferences</h4>

<ul>
<li><strong>全球本土化策略：</strong>
<ul>
<li>星巴克在全球擴張時，會根據不同地理區域的<strong>文化特色</strong>進行產品調整</li>
<li>中東地區推出<strong>豆蔻</strong>風味咖啡，亞洲地區推出<strong>月餅風味</strong>拿鐵等本土化產品
<ul>
<li>在中東地區，加入豆蔻的咖啡被稱為&quot;<strong>Gahwa</strong>&quot;（阿拉伯咖啡），這是幾個世紀以來的傳統, 中東許多國家都有在咖啡中加入豆蔻的習慣，包括Levant地區（巴勒斯坦、敘利亞、黎巴嫩、約旦）和沙烏   地阿拉伯等海灣國家. 星巴克的月餅<strong>靈感來自其經典飲品</strong>，例如：<strong>榛果拿鐵月餅</strong>,<strong>抹茶拿鐵月餅</strong>,<strong>香草拿鐵月餅</strong></li>
<li>在不同國家開設門市時，會考慮當地的文化、消費習慣進行客製化</li>
</ul>
</li>
</ul>
</li>
</ul>
<p><strong>地理區位選擇：</strong></p>
<ul>
<li>採用市場滲透策略，在已有據點的國家開設更多門市</li>
<li>根據地理位置進行市場細分，考慮氣候、文化、人口等因素</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-Zyy7uIq9="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="34" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">

<h5 id="%E6%90%9C%E7%B4%A2%E6%88%90%E6%9C%AC%E8%88%87%E5%B7%AE%E7%95%B0%E5%8C%96">搜索成本與差異化</h5>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-Lzhf5ciH="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="37" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="oligopoly%E5%AF%A1%E5%8D%A0%E5%A3%9F%E6%96%B7">Oligopoly寡占壟斷</h4>

<ul>
<li>市場中僅有<code>少數賣家</code>。  每家企業的定價與產量決策都會影響整個行業的價格與產出。</li>
<li>寡占模型聚焦於<strong>企業如何對彼此行為作出反應</strong>。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-D5e1qrIR="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="38" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E4%B8%80%E5%80%8B%E5%85%B8%E5%9E%8B%E7%9A%84%E9%9B%99%E5%AF%A1%E9%A0%AD%E5%A3%9F%E6%96%B7duopoly%E5%B8%82%E5%A0%B4">一個典型的雙寡頭壟斷（Duopoly）市場。</h4>

<ul>
<li>極高的壁壘：研發一架大型客機需要數百億美元的資金、頂尖的航空技術以及極其嚴苛的安全認證。新公司幾乎不可能進入這個市場。</li>
<li><strong>相互依賴</strong>：波音和空客在制定價格或推出新機型（如波音737 MAX vs 空巴 A320neo）時，必須時刻盯著對方的動作。如果波音降價，空巴為了保住市場份額也必須跟進降價，從而引發博弈。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-SDjDnKY0="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="39" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h4 id="%E5%83%B9%E6%A0%BC-%E6%88%90%E6%9C%AC%E5%8A%A0%E6%88%90price-cost-margins%E8%88%87%E5%B8%82%E5%A0%B4%E9%9B%86%E4%B8%AD%E5%BA%A6">價格-成本加成Price-Cost Margins與市場集中度</h4>

<ul>
<li>
<p>理論預測：<code>集中度越高</code>的行業，<code>價格-成本加成（price-cost margin）</code>越高。</p>
</li>
<li>
<p>但 <code>加成差異</code> 也可能由其他因素導致：</p>
<ul>
<li>政府監管</li>
<li>會計準則差異</li>
<li>買方集中度</li>
</ul>
</li>
<li>
<p>為準確研究集中度與加成之間的關係，必須控制上述干擾因素。</p>
</li>
<li>
<p>多數實證研究聚焦於特定行業，並比較地理上分離的市場。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-ksFayd3p="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="40" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="40" data-size="16:9">
<h5 id="%E9%97%9C%E6%96%BC%E9%9B%86%E4%B8%AD%E5%BA%A6%E8%88%87%E5%83%B9%E6%A0%BC%E7%9A%84%E5%AF%A6%E8%AD%89%E8%AD%89%E6%93%9A">關於集中度與價格的實證證據</h5>

<ul>
<li>
<p>在多個行業中，集中度更高的市場通常價格更高。</p>
<ul>
<li>對於當地服務的企業（如醫生、水管工等）， “進入門檻” 即支撐一定數量賣家所需的人口規模</li>
</ul>
</li>
<li>
<p>在賣家數量從1家增至2家時，可以服務的人口規模增加約四倍。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
