<h4 id="%E9%80%B2%E5%85%A5">進入</h4>

<ul>
<li><code>進入者</code>是指在新市場中從事生產和銷售產品的企業。</li>
<li>企業進入的行為通過以下兩種方式對<code>既存企業</code>構成威脅：
<ul>
<li>侵蝕既存企業的<code>市場份額</code>；</li>
<li>加劇行業內部競爭，導致<code>價格-成本利潤率（price-cost margin）</code>下降。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="%E6%96%B0%E9%80%B2%E5%85%A5%E7%9A%84%E5%BD%A2%E5%BC%8F">新進入的形式</h4>

<ul>
<li>
<p>企業進入新市場可採取不同形式：</p>
<ul>
<li>進入者可能是<code>全新成立的企業</code>；</li>
<li>也可能是已有的企業，通過<code>多元化</code>進入新的產品/市場。</li>
</ul>
</li>
<li>
<p>進入形式對分析<code>進入成本</code>以及既存企業的<code>策略反應</code>至關重要。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-DacnKlJ6="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E9%80%80%E5%87%BA%E7%9A%84%E5%BD%A2%E5%BC%8F">退出的形式</h4>

<ul>
<li>企業可能<code>完全關閉</code>(Toys &quot;R&quot; Us（玩具反斗城） ,百視  達（Blockbuster)；</li>
<li>企業可能停止某個<code>特定產品或產品線</code>（例如 Sega 退出視頻遊戲硬體市場）；</li>
<li>企業可能退出<code>某個特定的地理市場</code>（例如 Peugeot 退出美國市場）。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="%E9%97%9C%E6%96%BC%E9%80%B2%E5%85%A5%E8%88%87%E9%80%80%E5%87%BA%E7%9A%84%E5%AF%A6%E8%AD%89%E7%A0%94%E7%A9%B6">關於進入與退出的實證研究</h4>

<ul>
<li>
<p>Dunne、Roberts 和 Samuelson（簡稱 DRS）對 美國各行業的進入與退出進行了研究，發現：</p>
<ul>
<li>進入和退出在美國普遍<code>同時存在</code>；</li>
<li>新進入者（退出者）比既存企業規模更小；</li>
<li>大多數新進入者很快失敗，而存活者則迅速擴張；</li>
<li>不同行業的進入率和退出率存在差異。</li>
</ul>
</li>
<li>
<p>在五年的時間內，典型行業經歷了30%至40%的<code>企業更替（turnover）</code> ；僅有5%至10%的進入者是多元化經營企業（diversifying firms）；</p>
<ul>
<li>鼓勵進入的行業環境通常也會促進退出。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-EpXDHKdM="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="barriers-to-entry%E9%80%B2%E5%85%A5%E9%9A%9C%E7%A4%99%E5%A3%81%E5%A3%98">Barriers to Entry進入障礙(壁壘)</h4>

<ul>
<li>
<p>潛在的新進企業會將進入後的<code>沉沒成本</code>與進入後<code>預期利潤流的現值</code>進行比較。</p>
<ul>
<li>其中, 進入後的利潤取決於需求與成本狀況，以及進入市場後面對競爭的性質。</li>
</ul>
</li>
<li>
<p>進入障礙(參進障礙)</p>
<ul>
<li>使既存企業能夠獲得經濟利潤，同時, 令新進入企業<code>無利可圖</code>的因素。</li>
</ul>
</li>
<li>
<p>進入障礙可分為兩類：</p>
<ul>
<li><strong>結構性障礙（自然優勢）</strong>；</li>
<li><strong>策略性障礙（既存企業為阻止進入而採取的行動）</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-QBhrp1PU="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E7%B5%90%E6%A7%8B%E6%80%A7%E7%9A%84%E9%80%B2%E5%85%A5%E9%9A%9C%E7%A4%99">結構性的進入障礙</h4>

<ul>
<li>
<p>結構性的進入障礙存在於以下情形：</p>
<ul>
<li>既存企業擁有<code>成本優勢</code>或<code>行銷優勢</code></li>
<li>既存企業受到有利的<code>政府政策</code>和<code>法規保護</code>。</li>
</ul>
</li>
<li>
<p>常見結構性進入障礙包括：</p>
<ul>
<li>既存企業控制<strong>關鍵資源</strong>；</li>
<li><strong>規模經濟</strong>與<strong>範圍經濟</strong>；</li>
<li>既存企業的<code>行銷優勢 （如品牌、客戶關係等）</code> 。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-of8hxmfb="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E9%97%9C%E9%8D%B5%E8%B3%87%E6%BA%90%E7%9A%84%E6%8E%A7%E5%88%B6">關鍵資源的控制</h4>

<ul>
<li>某些投入要素的來源可能受<strong>自然資源限制</strong>，
<ul>
<li>而既存企業可能已控制這些稀少資源；</li>
</ul>
</li>
<li><strong>專利</strong>可阻止競爭對手模仿企業的產品；</li>
<li>既存企業可能嚴密保護難以被對手複製的<strong>專有技術或訣竅</strong>。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-avAxNkOj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E8%A6%8F%E6%A8%A1%E7%B6%93%E6%BF%9F%E8%88%87%E7%AF%84%E5%9C%8D%E7%B6%93%E6%BF%9F">規模經濟與範圍經濟</h4>

<ul>
<li>
<p>若<code>規模經濟顯著</code>，潛在進入者可能面臨成本劣勢；</p>
</li>
<li>
<p>既存企業對進入的戰略反應可能是進一步壓低價格，侵蝕進入者利潤；</p>
<ul>
<li>若進入者成功進入，可能引發激烈的價格競爭。</li>
</ul>
</li>
<li>
<p>範圍經濟方面：</p>
<ul>
<li>進入者也可能因範圍經濟而處於成本劣勢；</li>
<li><code>生產上的範圍經濟</code>指在同一工廠生產多條產品線時產生的成本節約；</li>
<li><code>行銷上範圍經濟</code>指在進入者為建立品牌知名度所需承擔的前期<code>通路建設</code>成本。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-aZSHE9PG="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%97%A2%E5%AD%98%E4%BC%81%E6%A5%AD%E7%9A%84%E8%A1%8C%E9%8A%B7%E5%84%AA%E5%8B%A2">既存企業的行銷優勢</h4>

<ul>
<li>既存企業可借助現有<strong>品牌傘效應</strong>，比新進入者更輕鬆地推出新產品；</li>
<li><strong>品牌傘效應</strong>有助於既存企業更容易打通銷售管道
<ul>
<li>例如：知名品牌更容易獲得貨架空間。</li>
</ul>
</li>
<li>但需注意：
<ul>
<li>利用品牌聲譽並非沒有風險；</li>
<li>若新產品表現不佳，客戶不滿可能損害現有產品的品牌形象。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-cWAKmttC="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="11" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E7%AD%96%E7%95%A5%E6%80%A7%E9%80%B2%E5%85%A5%E9%9A%9C%E7%A4%99">策略性進入障礙</h4>

<ul>
<li>
<p>阻止進入的策略包括：<code>限制性定價</code>、<code>掠奪性定價</code>和<code>產能擴張</code>；</p>
</li>
<li>
<p>這些策略要奏效，必須滿足：</p>
<ul>
<li>既存企業作為壟斷者獲得的利潤高於作為(雙頭)壟斷者；</li>
<li>該策略能改變進入者對進入市場後<strong>競爭狀況的預期</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-g9ENQ5wJ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E9%99%90%E5%88%B6%E6%80%A7%E5%AE%9A%E5%83%B9limit-pricing">限制性定價（Limit Pricing）</h4>

<ul>
<li>
<p>既存企業平時就會將<code>價格定得足夠低</code>，以阻止潛在進入者；</p>
</li>
<li>
<p>限制性定價有兩種形式：</p>
<ul>
<li><code>可競爭性</code>限制定價；</li>
<li>策略性限制定價。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-FKwhdU5t="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="13" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E5%8F%AF%E7%AB%B6%E7%88%AD%E5%B8%82%E5%A0%B4%E8%88%87%E9%80%B2%E5%85%A5%E5%A8%81%E6%87%BE">可競爭市場與進入威懾</h4>

<ul>
<li>
<p>若存在<strong>打了就跑式進入</strong>（即沉沒成本為零, 進出市場成本也為零），該市場即為<code>可競爭市場(contestable market)</code>；</p>
<ul>
<li>賣冰的在店裡放上電影票</li>
</ul>
</li>
<li>
<p>可競爭性市場可以使用的<code>限制定價</code></p>
<ul>
<li>既存企業擁有<code>過剩產能</code>，可將價格定在進入者邊際成本以下；</li>
<li>既存企業有能力以<code>低價</code>滿足全部市場需求。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-wKAgI6t8="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E7%AD%96%E7%95%A5%E6%80%A7%E7%9A%84%E9%99%90%E5%88%B6%E5%AE%9A%E5%83%B9">策略性的限制定價</h4>

<ul>
<li>新進入企業的產能有限或邊際成本遞增；</li>
<li>限制性定價可能意味著既存企業<code>平時利潤犧牲</code> 或無法滿足全部市場需求；</li>
<li>若進入者推斷進入市場後價格仍將很低，既存企業<code>平時低價</code>就可起到威懾作用。</li>
</ul>
<h4 id="%E9%99%90%E5%88%B6%E6%80%A7%E5%AE%9A%E5%83%B9%E6%98%AF%E5%90%A6%E7%90%86%E6%80%A7">限制性定價是否理性？</h4>
<ul>
<li>在多期長期模型中，既存企業需在<code>每期都維持低價</code>，以阻止下一期的進入；</li>
<li>既存企業<code>有可能</code>更願意接受雙頭壟斷，也不願長期以壟斷者身份<code>實施低價</code>的限制性定價。</li>
<li>進一步分析
<ul>
<li>即使在兩期模型中，限制性定價均衡也不是子博弈精煉的；</li>
<li>潛在進入者可理性預期：進入後的價格不會低於均衡價格。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-7HPrBbxT="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%8E%A0%E5%A5%AA%E6%80%A7%E5%AE%9A%E5%83%B9predatory-pricing">掠奪性定價（Predatory Pricing）</h4>

<ul>
<li>
<p>掠奪性定價指既存企業<code>平時訂定壟斷價格</code>, 會在<code>看到新進入者進來市場之後</code>,將價格定在短期邊際成本以下，期望在競爭對手退出後通過壟斷利潤彌補損失；</p>
<ul>
<li><strong>平時訂高價, 有人進來訂低價</strong>, 直到新進者退出</li>
</ul>
</li>
<li>
<p>掠奪性定價針對已進入的對手，而限制性定價針對潛在進入者。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-hpgdtCws="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="16" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%8E%A0%E5%A5%AA%E6%80%A7%E5%AE%9A%E5%83%B9%E6%98%AF%E5%90%A6%E7%90%86%E6%80%A7">掠奪性定價是否理性？</h4>

<ul>
<li>
<p>若所有進入者都能準確預判既存企業的未來定價行為，掠奪性定價將無效；</p>
<ul>
<li><strong>連鎖店悖論</strong>：儘管理性分析表明掠奪性定價難以威懾進入，但許多企業仍被認為在使用該策略。</li>
<li>在<code>不確定性</code>的情況下，掠奪性定價可起到威懾作用；既存企業需建立<code>強硬</code>的聲譽。</li>
</ul>
</li>
<li>
<p>連鎖店悖論（Chain Store Paradox） 是由德國經濟學家、1994年諾貝爾經濟學獎得主萊因哈德·澤爾騰（Reinhard Selten） 在1978年提出</p>
<ul>
<li>一家大型連鎖企業，在 N 個不同的城鎮擁有壟斷地位。每個城鎮都有一個潛在的競爭者（我們稱之為進入者）。</li>
<li>在現實世界的商業直覺中，連鎖店絕對應該在第1個或前幾個城鎮「不惜代價地迎戰」。雖然短期內會虧錢，但可以建立「我非常強硬」的聲譽（Reputation），從而嚇退後面所有城鎮的進入者，保住長期的壟斷利潤。</li>
</ul>
</li>
<li>
<p>直覺認為該打仗，<code>邏輯</code>卻說不該打仗，這就是連鎖店悖論。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-Ts9ODJDv="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<ul>
<li>進一步思考：
<ul>
<li>簡單經濟模型表明掠奪性定價是非理性的；</li>
<li>要麼企業行為非理性，要麼模型不完整；</li>
<li>引入不確定性和資訊不對稱的博弈論模型顯示，掠奪行為可以是理性的策略。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-sYyXcsmj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E9%99%90%E5%88%B6%E6%80%A7%E5%AE%9A%E5%83%B9%E8%88%87%E6%8E%A0%E5%A5%AA%E8%A1%8C%E7%82%BA%E7%90%86%E6%80%A7%E7%9A%84%E9%81%A9%E7%94%A8%E6%83%85%E5%BD%A2">限制性定價與掠奪行為理性的適用情形</h4>

<ul>
<li>既存企業希望降低新進入者對進入市場後<strong>價格的預期</strong>；</li>
<li>新進入者往往不瞭解既存企業的成本；</li>
<li>在資訊不對稱情況下，既存企業的定價策略可改變進入者的預期。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-WJHTaFyD="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%8E%A0%E5%A5%AA%E6%80%A7%E5%AE%9A%E5%83%B9%E8%88%87%E8%81%B2%E8%AD%BD">掠奪性定價與聲譽</h4>

<ul>
<li>
<p>當既存企業希望建立<code>強硬</code>聲譽時，掠奪性定價可威懾進入；</p>
<ul>
<li>若既存企業不降價，其他挑戰者可能認為其<code>軟弱</code>而非<code>強硬</code>。</li>
</ul>
</li>
<li>
<p><code>強硬</code>可能源於：</p>
<ul>
<li>低成本；</li>
<li>非理性地追求市場份額；</li>
<li>存在進入者未知的其他競爭。</li>
<li>通過大幅降價，使進入者相信既存企業是<code>強硬</code>的。</li>
</ul>
</li>
<li>
<p>一些知名企業在其競爭對手消失後，獲得了<code>強硬</code>的聲譽。</p>
</li>
<li>
<p>激進的市場份額策略包括：</p>
<ul>
<li>公開宣佈市場份額目標；</li>
<li>以市場份額（而非利潤）為基礎獎勵管理者。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-e5VPCZ9f="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="standard-oil1911%E6%95%99%E7%A7%91%E6%9B%B8%E7%9A%84%E8%B5%B7%E6%BA%90">Standard Oil（1911）——教科書的起源</h4>

<ul>
<li>洛克斐勒被控在特定地區市場選擇性削價，擊敗獨立煉油業者，最終公司依《休曼法》被拆分。</li>
<li>但 1958 年 McGee 起質疑：證據其實無法證明 Standard Oil 真的從事掠奪，開始半世紀學術論戰。</li>
<li>地位：無論史實如何，它都是「掠奪性定價」這個概念的萬案之源</li>
</ul>
<h4 id="united-states-v-american-airlines1999%E2%80%932003%E7%94%A2%E8%83%BD%EF%BC%8B%E5%83%B9%E6%A0%BC%E9%9B%99%E5%88%80%E6%B5%81">United States v. American Airlines（1999–2003）——「產能＋價格」雙刀流</h4>
<ul>
<li>1995–97 年 Vanguard、Sun Jet、Western Pacific 等<code>低成本航空</code>進入達拉斯/沃斯堡航線，AA 立刻加開班次＋大幅降價逼退對手。</li>
<li>對手退出後，票價隨即上漲（平均票價升至 88–123 美元），成為<code>「掠奪後回收」</code>的經典證據</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-YySEWVfo="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="amazon-vs-diaperscom2009%E2%80%9310%E5%B9%B3%E5%8F%B0%E6%99%82%E4%BB%A3%E7%9A%84%E7%8F%BE%E4%BB%A3%E5%AF%93%E8%A8%80">Amazon vs. Diapers.com（2009–10）——平台時代的現代寓言</h4>

<ul>
<li>收購 Quidsi 被拒後，Amazon 發動尿布價格戰、折扣高達 30%，內部郵件顯示其目的在「壓制」新創對手。
<ul>
<li>價格戰燒掉 Amazon 逾 1 億美元，最終 Quidsi 被迫出售。</li>
</ul>
</li>
<li>諷刺續集：Amazon 於 2017 年關閉 Quidsi 全部業務——說明「掠奪→回收」的劇本也未必成真</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-topWoZea="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="taiwan-case">Taiwan Case</h4>

<ul>
<li>
<p>藥品 1 元搶標案：原廠藥商進貨成本每顆約 12 元，卻以 1 元參標，封鎖第一個學名藥廠進入醫學中心的門檻，罰 300 萬元。</p>
</li>
<li>
<p>有線電視「0元看 1年」案：既有業者 C 只對新進業者 D 的訂戶 secretly 提供 0 元方案，價格低於平均變動成本，罰 250 萬元。</p>
</li>
<li>
<p><strong>掠奪性定價是「用今天的虧損買明天的獨占</strong>」——Standard Oil 是它的傳說，American Airlines 是它的教科書圖解, Amazon/Diapers.com 是平台時代的新爭議, 而台灣則選擇用「低價利誘」條款在掠奪門檻之下提前攔截。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-5hbzpigc="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%B6%88%E8%80%97%E6%88%B0war-of-attrition">消耗戰（War of Attrition）</h4>

<ul>
<li>
<p>掠奪性定價<code>長期</code>可能演變為消耗戰；</p>
<ul>
<li>既存企業或新進企業 越相信自己能比對手堅持更久，就越願意發動並持續價格戰。</li>
<li>企業（誰?）還可試圖說服對手自己更具持久力.
<ul>
<li>例如，宣稱即使在價格戰期間仍在盈利。</li>
</ul>
</li>
</ul>
</li>
<li>
<p>早期無人退出，長期價格戰將損害全行業利益；</p>
</li>
<li>
<p>即使勝出者，其狀況也可能不如從未發動價格戰。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-dcddJ90n="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="24" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E8%B4%8F%E5%BE%97%E6%B6%88%E8%80%97%E6%88%B0%E7%9A%84%E9%97%9C%E9%8D%B5">贏得消耗戰的關鍵</h4>

<ul>
<li>企業越相信自己能比對手堅持更久，就越願意留在價格戰中；</li>
<li>面臨<code>高退出障礙</code>的企業更有條件參與價格戰；</li>
<li>企業也可試圖讓對手相信自己能堅持更久
<ul>
<li>例如：宣稱即使在價格戰中也資金充裕。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-xgt9zLaU="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="excess-capacity%E9%81%8E%E5%89%A9%E7%94%A2%E8%83%BD">Excess Capacity過剩產能</h4>

<ul>
<li>美國製造業平均產能利用率約為80%；</li>
<li>當產能擴張必須<code>一次性大幅投入</code>（lumpy）時，企業常因預期未來增長而持有過剩產能；</li>
<li>需求暫時下滑也可能導致行業產能過剩，但這未必具有戰略意圖。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-Cng3jLsx="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E9%81%8E%E5%89%A9%E7%94%A2%E8%83%BD%E8%88%87%E9%80%B2%E5%85%A5%E5%A8%81%E6%87%BE">過剩產能與進入威懾</h4>

<ul>
<li>
<p>持有過剩產能的既存企業<code>可信地威脅</code>：一旦進入發生，將降價；</p>
</li>
<li>
<p>擁有過剩產能的既存企業能以低成本擴大產量；</p>
</li>
<li>
<p>即使進入者與既存企業資訊對稱，進入威懾仍可能發生。</p>
</li>
<li>
<p>過剩產能有效威懾進入的條件：</p>
<ul>
<li>既存企業擁有可持續的成本優勢；</li>
<li>市場需求增長緩慢；</li>
<li>既存企業無法撤回過剩產能投資；</li>
<li>進入者並非試圖建立“強硬”聲譽的類型。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-YAbDtKSX="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="judo-economics-%E6%9F%94%E9%81%93%E7%B6%93%E6%BF%9F%E5%AD%B8">Judo Economics 柔道經濟學</h4>

<ul>
<li>
<p><code>新進入者</code>常見的策略：<strong>柔道經濟學（Judo Economics）</strong></p>
<ul>
<li>1983 年由經濟學家 Judith Gelman 與 Steven Salop 在〈Judo Economics: Capacity Limitation and Coupon Competition〉論文中創造。</li>
<li>含義：小公司<code>借力打力</code>，把對手「龐大的體型」利用對手的優勢為自己服務，如同柔道以借力使力取勝。</li>
<li>進入者通過表現出長期<code>無威脅</code>姿態，勸阻既存企業<strong>不採取威懾策略</strong>； 對既存企業而言，為打擊這樣一個“無害”進入者而承受巨大損失可能不值得。</li>
</ul>
</li>
<li>
<p>1990 年代哈佛商學院 David Yoffie（與 Cusumano、Kwak）將其發展成完整的「柔道策略」框架，並以 Netscape 對微軟之戰作為經典詮釋</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-IlCSkUWl="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%A0%B8%E5%BF%83%E5%AE%9A%E5%83%B9%E9%82%8F%E8%BC%AFgelman%E2%80%93salop-%E6%A8%A1%E5%9E%8B">核心定價邏輯：Gelman–Salop 模型</h4>

<ul>
<li>
<p>經典例子：既存企業以 50 美元服務 10 個客戶。</p>
<ul>
<li>情境 A：挑戰者若想用 40 美元搶「整個市場」，在位者被迫跟價死戰，挑戰者終將被驅逐。</li>
<li>情境 B：挑戰者若把產能限制到「只服務 1 個客戶」，在位者會發現維持 50 美元、保住其餘 9 個客戶更划算，於是理性地「容忍」其進入。</li>
</ul>
</li>
<li>
<p>機制關鍵：在位者必須對全體客戶統一收費，跟價成本太高；小廠的可信自我限制，讓巨人的規模變成保護小廠的傘。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-Kwst1hNd="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<ul>
<li><strong>哈佛商學院</strong> 教學案例同樣證明：進入者只瞄準<code>部分市場</code>並收低價，即使毫無附加價值也能賺錢；例如進入者以 150 美元取走一半客戶，在位者維持 200 美元而不跟降價
<ul>
<li>實證研究：當進入者承諾<code>小市占</code>時，在位者確實較少發動價格、廣告或新品攻擊。</li>
<li>Kiwi 航空（最經典案例）：1992 年僅以兩架租賃飛機、只飛芝加哥–紐瓦克–奧蘭多單一航線進入市場；<code>限制可信</code>，大航空不視其為威脅，使其在紅海市場獲利。</li>
</ul>
</li>
<li>反面教訓：Kiwi 於 1994 年擴張航線、放棄柔道限制，遭大公司價格戰反擊，1999 年底破產。
<ul>
<li>其他業例：英國早餐穀片（Viota vs. Kellogg）、挪威水泥（Viking vs. Norcem）。</li>
</ul>
</li>
<li>實證證據：進入者產能越小越容易被容忍；但若市場有「兩個」巨人（Bertrand 競爭），柔道限制大多失效，價格戰比率高達 76%</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-XTi2ovVV="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="30" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E7%A7%BB%E5%8B%95movement%E4%B8%8D%E6%8C%91%E9%87%81%E9%81%BF%E5%85%8D%E6%AD%A3%E9%9D%A2%E5%B0%8D%E6%B1%BA%E9%A1%AF%E5%BE%97%E7%84%A1%E5%AE%B3">移動（Movement）——不挑釁、避免正面對決、顯得無害</h4>

<ul>
<li>移動與<code>小狗策略</code>——在巨人「不要、不屑、不能吃」的 <code>niche</code> 長大
<ul>
<li>「小狗策略」（puppy dog ploy，語出 Fudenberg &amp; Tirole 1984）</li>
<li>Capital One 極度低調、不做產品發布會，悄悄長成美國最大信用卡發行商之一；</li>
<li>Palm 把手持裝置說成 PC 的「伴侶」而非「替代品」，暫時避开微軟全面攻擊。</li>
<li>日系車 vs. 美國三大（1970s）／Nucor vs. 美國鋼鐵
<ul>
<li>豐田們從小型省油車（低利潤邊陲）切入；三大車廠專注高利潤大車，理性容忍（打低價小車市場等於自噬利潤）。</li>
<li>Nucor 小型鋼廠從巨頭放棄的螺紋鋼起步，再一路爬上結構鋼、薄板。
<ul>
<li>定價角度：小廠商在巨頭的「價格傘」下長大——Gelman–Salop 模型的現實版。</li>
</ul>
</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-pK9o2eZC="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="31" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E5%B9%B3%E8%A1%A1balance%E8%A2%AB%E6%94%BB%E6%93%8A%E6%99%82%E4%B8%8D%E7%A1%AC%E9%A0%82%E9%A0%86%E5%8B%A2%E5%8C%96%E8%A7%A3%E5%80%9F%E5%8A%9B%E6%89%93%E5%8A%9B">平衡（Balance）——被攻擊時不硬頂，順勢化解、借力打力</h4>

<ul>
<li>Drypers 對寶鹼：P&amp;G 在德州降下 2 美元優惠券轟炸，Drypers 乾脆打廣告宣布「P&amp;G 優惠券可用於本公司產品」，把對手的攻勢變成自己的銷量。</li>
<li>Oatly vs. 乳品業
<ul>
<li>乳業公會對 Oatly 的環保宣傳提告，Oatly 把告狀信原文印在包裝與看板上：「他們不讓我們說的，我們自己印出來。」</li>
<li>攻擊變成免費全球廣告，銷量與話題度暴增——與 Drypers 接住 P&amp;G 優惠券同一招式。</li>
</ul>
</li>
<li>JVC（VHS）vs. Sony（Betamax）
<ul>
<li>Sony 技術較好但封閉；JVC 把 VHS 廣泛授權給所有廠商，借力全￿業的￿能與通路。</li>
<li>Sony 的「技術優勢＋封閉生態」反成枷鎖，Betamax 出局。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-StIemZtv="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="32" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<h4 id="%E6%A7%93%E6%A1%BFleverage%E6%8A%8A%E5%B0%8D%E6%89%8B%E7%9A%84%E8%B3%87%E6%BA%90%E5%A4%A5%E4%BC%B4%E7%AB%B6%E7%88%AD%E8%80%85%E8%AE%8A%E6%88%90%E4%BD%A0%E7%9A%84%E6%AD%A6%E5%99%A8">槓桿（Leverage）——把對手的資源、夥伴、競爭者變成你的武器</h4>

<ul>
<li>Sega 對任天堂：利用任天堂的 8 位元壟斷推出 16 位元主機；利用其「闔家歡樂」形象反打青少年市場，讓對手的投資變成「人質」。</li>
<li>Sony PlayStation：任天堂與 Sega 緊縮夥伴時，Sony 開放開發工具、降低授權費，1999 年遊戲數達 Nintendo 64 的十倍以上。</li>
<li>Netscape 在微軟的對手 UNIX 上開發軟體；Charles Schwab 的 OneSource 讓基金交易免手續費、改向基金公司收費，借力打力。</li>
<li>Palm 定價 300 美元（微軟陣營約 500 美元）且年年降價，讓自己成為移動中的目標</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-Wk6rAe6S="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="33" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<ul>
<li>
<p>小米 vs. Apple／三星（2011–15）</p>
<ul>
<li>1999 元旗艦規格（對手 4–5 千元）、線上閃購、粉絲社群，省下通路與行銷費。借力對手的高價傘：小米定價越低，越顯得對手暴利，品牌勢能越強。</li>
</ul>
</li>
<li>
<p>Nintendo Wii vs. Sony／Microsoft（老二時的柔道）</p>
<ul>
<li>任天堂不加入 HD 軍備競賽，以體感主打家庭與非玩家；PS3 定價 599 美元的硬體補貼變成對手的枷鎖，Wii 只賣 249 美元卻更賺錢。</li>
</ul>
</li>
<li>
<p>Sega Genesis vs. Nintendo</p>
<ul>
<li>「Genesis does what Nintendon't」：借力任天堂的「闔家歡樂」形象，反打青少年市場（血腥版《真人快打》、Madden），把對手的品牌資源變成人質。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-b9Tu5zJU="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="34" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="34" data-size="16:9">
<ul>
<li>
<p>小廠付不起價格戰，所以主動限縮規模、躲在在位者的「價格傘」下；這正是賽局理論中「裝弱以避免被攻擊」的<strong>小狗策略</strong>在定價上的體現.</p>
</li>
<li>
<p>適用條件：至少一個主導廠商＋可信的自我限制；巨人不止一家時柔道失效。</p>
</li>
<li>
<p>批評：柔道經濟學「把目標定得太低」——只求利基存活，無法贏下整個市場</p>
</li>
<li>
<p>柔道經濟學教「弱小者」如何讓巨人覺得「打你不划算」——定價上的關鍵動作，就是<strong>可信地</strong>限制自己的規模與野心。柔道的定價精髓不是「比巨人便宜」，而是讓巨人「跟不起、跟了會自噬、不跟又失血」——把對手的規模、利潤結構、通路與品牌，全部變成綁住他自己手上的繩子</p>
</li>
</ul>
<p>​</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
