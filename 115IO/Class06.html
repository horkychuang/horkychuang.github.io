<p>企業的<code>垂直邊界</code>決定了哪些任務應在<strong>企業內部</strong>完成，哪些任務應<strong>外包</strong>出去。</p>
</li>
<li>
<p>即 <strong>自製還是外購(make-or-buy)</strong> 的決策</p>
<ul>
<li>在<code>市場的無形之手</code>與<code>組織的有形之手</code>之間做出選擇。
<ul>
<li>決策取決於使用市場與內部執行任務的成本與收益比較。</li>
</ul>
</li>
</ul>
</li>
</ul>
<h4 id="%E7%95%8C%E5%AE%9A%E9%82%8A%E7%95%8C">界定邊界</h4>
<ul>
<li>
<p>企業需要明確自身的垂直邊界。</p>
<ul>
<li>事實上, 垂直價值鏈各項任務都可以交給的<code>市場外部專業機構</code>即為市場企業(Market Firms) 。</li>
</ul>
</li>
<li>
<p>市場企業通常是在其領域內公認的領先者（例如：UPS）。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-WdOzlY4y="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E8%87%AA%E8%A3%BDin-house%E6%88%96%E5%A4%96%E8%B3%BCoutsourcing%E7%9A%84%E4%B8%80%E4%BA%9B%E8%AA%A4%E5%8D%80">自製(in-house)或外購(outsourcing)的一些誤區</h4>

<ul>
<li>
<p>誤區一：企業應<code>自製</code>能帶來競爭優勢的資產。</p>
<ul>
<li>企業 <strong>(誤)認為</strong> 某項資產是競爭優勢的來源， 但如果該資產在市場上其實很容易獲得， 此時需重新評估其競爭優勢的判斷。</li>
<li>一家五金零件加工廠，斥資引進了德國最新型的五軸聯動 CNC 加工機台，以及日本頂級的機械手臂。老闆認為：「我們的加工精度和速度是業界第一，因為我們擁有這些<strong>頂級設備</strong>，這就是我們不可替代的優勢。」</li>
</ul>
</li>
<li>
<p>誤區二：企業 <strong>(誤)認為</strong>外包某項活動可消除該活動的成本。</p>
<ul>
<li>無論成本由企業自身承擔（自製）還是由供應商承擔（外購），成本都存在。關鍵在於哪種方式更有效率。</li>
<li>一家中型零售企業認為內部養一個 20 人的 IT 研發團隊太貴了（包含高薪工程師薪資、勞健保、辦公空間、軟硬體設備），於是決定將系統開發與維護全面外包給國外的軟體公司或本地的系統整合商（SI）</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-X3dsahu7="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E8%87%AA%E8%A3%BD%E6%88%96%E5%A4%96%E8%B3%BC%E7%9A%84%E4%B8%80%E4%BA%9B%E8%AA%A4%E5%8D%80">自製或外購的一些誤區</h4>

<ul>
<li>誤區三： 企業 <strong>(誤)認為</strong> 向後整合(input)可<code>獲取供應商的利潤空間</code>。
<ul>
<li>若供應商確實獲得經濟利潤，需追問：為何市場未將其侵蝕？長期來看，競爭通常會消除超額利潤。</li>
<li>老闆認為：「我們每天消耗這麼多食材，中間被盤商和加工廠賺了太多差價。如果我們自己包地種菜、養豬，並建立超大型中央廚房，我們就能『吃掉整條供應鏈的利潤』，實現從農場到餐桌的暴利。」
<ul>
<li>殘酷的現實是，供應商之所以能賺取這 30% 的利潤，是因為他們在該特定領域擁有「規模經濟」、「學習曲線優勢」或「獨特的專業管理能力」。</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-BGFZoUuD="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<ul>
<li>誤區四： <strong>誤認為</strong> <code>向後整合</code>可規避<code>投入品價格過高</code>的風險。
<ul>
<li>企業誤以為「向後整合」能將「市場價格風險」轉化為「內部固定成本」。但殘酷的現實是，上游投入品價格過高，往往是因為其本身具備高資本門檻、長建設週期或受全球總體經濟影響。</li>
<li>高層認為：「只要我們擁有自己的<code>礦山</code>，我們就能鎖定原物料成本，徹底規避國際金屬價格過高的風險，確保我們的電動車利潤不被上游礦商吃掉。」
<ul>
<li><strong>殘酷的市場現實</strong>: 從買下礦權、環評、基礎建設到真正開採出礦，通常需要 5 到 10 年。這期間需要持續投入巨額資金，且極易遭遇當地環保抗爭、地緣政治或罷工等不可控風險。</li>
</ul>
</li>
<li>某家知名 IC 設計公司（如生產驅動 IC 或電源管理 IC 的公司），在半導體缺貨潮時面臨晶圓代工廠（如台積電、聯電）大幅漲價且產能被排擠的窘境。<strong>誤認的優勢</strong>：老闆認為：「代工價格太高且受制於人，我們應該自己蓋一座成熟製程的晶圓廠（或封測廠）。這樣不僅能確保產能，還能規避代工價格過高的風險，把利潤留在自己口袋。」
<ul>
<li><strong>殘酷的市場現實</strong>: 晶圓廠是極度重資產的行業，折舊費用驚人。晶圓廠必須維持極高的產能利用率（通常需 80% 以上）才能損益兩平。</li>
</ul>
</li>
<li>實際上，可通過<code>遠期</code>或<code>期貨合約</code>對沖投入品價格風險，可以無需垂直整合。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-2ylCigko="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<ul>
<li>誤區五： <strong>誤認為</strong> <code>向前整合</code>控制分銷管道 可阻止競爭對手進入。
<ul>
<li>企業在市場佔有率達到一定程度後，往往會產生一種「渠道霸權」的錯覺。認為：「只要我們透過收購或自建，控制了<code>下游的分銷管道</code>（如零售門市、經銷商網絡、實體賣場），競爭對手就沒有地方賣東西了，從而能建立極高的進入壁壘，把對手擋在門外。」
<ul>
<li>知名的 3C 家電品牌，為了防止競爭對手搶佔<code>實體貨架</code>，決定投入巨资在全國各大核心商圈瘋狂開設「品牌直營旗艦店」和「專賣店」，並要求商場給予排他性位置。
<ul>
<li>盲目向前整合控制管道，不僅無法真正封殺對手，反而會讓企業背上沉重的「重資產包袱」、喪失管道的「中立性」，甚至引發嚴重的「反壟斷監管風險」。競爭對手往往會透過「繞道」或「降維打擊」的方式，開創出全新的銷售管道。</li>
</ul>
</li>
<li>消費者的購買習慣迅速向<code>線上轉移</code>。競爭對手根本不需要開實體店，直接透過官方網站、社群媒體直播帶貨、或進駐大型綜合電商平台（如 Amazon、蝦皮、京東），就能以極低的成本觸達全國消費者。</li>
</ul>
</li>
<li>兩種可能：開闢新管道可能很容易；若管道稀缺，收購價格將反映其全部價值。無論哪種情況，封鎖管道本身不會帶來經濟利潤。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-sm2jHp3i="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%BD%BF%E7%94%A8%E5%B8%82%E5%A0%B4%E4%BC%81%E6%A5%AD%E7%9A%84%E5%84%AA%E5%8B%A2">使用市場企業的優勢</h4>

<ul>
<li>市場企業可能擁有<code>專利</code>或<code>專有資訊</code>，使其具備<code>超低成本生產能力</code>。</li>
<li>市場企業能夠實現企業內部單元無法達到的<code>規模經濟</code>。</li>
<li>外部企業<code>受市場紀律約束</code>，而企業內部部門可能借公司整體成功掩蓋低效（存在理成本與影響力成本）。</li>
<li>市場企業 更可能充分利用<code>學習效應</code>帶來的經濟性。
<ul>
<li>例如：汽車製造商更願意從獨立供應商而非競爭對手處採購<code>反鎖死刹車系統</code>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-zqoqPdAq="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%BD%BF%E7%94%A8%E5%B8%82%E5%A0%B4%E4%BC%81%E6%A5%AD%E7%9A%84%E5%8A%A3%E5%8B%A2">使用市場企業的劣勢</h4>

<ul>
<li>生產流程<code>協調困難</code>；</li>
<li>可能洩露<code>企業私有資訊</code>；</li>
<li><code>交易成本</code>。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-1sQKBFrw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="11" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%BB%A3%E7%90%86%E6%88%90%E6%9C%ACagency-costs">代理成本（Agency Costs）</h4>

<ul>
<li>
<p>公司（股東/董事會） vs. 管理層（高階主管）</p>
<ul>
<li>主管往往會利用這個<code>決策</code>來滿足自身的利益，從而<code>損害公司</code>整體的資本回報率。</li>
</ul>
</li>
<li>
<p>管理層 vs. 基層員工</p>
<ul>
<li>員工拿的是固定薪水，做壞了頂多挨罵或拿不到年終獎金，不會面臨「公司倒閉、自己破產」的生存危機。員工會傾向於「摸魚」，管理層必須設立龐大的「中階主管」去盯人</li>
</ul>
</li>
<li>
<p>here 代理成本源於<code>員工懈怠(不同心)</code> 以及管理層為防止懈怠所付出的<code>監督成本</code>。</p>
<ul>
<li>當任務由企業內部執行時，代理問題尤為突出。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-YLX5s9k9="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%B8%89%E5%A4%A7%E7%B5%84%E6%88%90jensen--meckling">三大組成（Jensen &amp; Meckling）</h4>

<table>
<thead>
<tr>
<th>組成</th>
<th>說明</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>監督成本</strong>（Monitoring Costs）</td>
<td>委託人為監視代理人行為所花的成本，如審計、董事會、績效考核制度</td>
</tr>
<tr>
<td><strong>約束成本</strong>（Bonding Costs）</td>
<td>代理人為取信委託人而自我擔保的成本，如財務揭露、履約保證</td>
</tr>
<tr>
<td><strong>剩餘損失</strong>（Residual Loss）</td>
<td>即使有監督與約束，代理人決策仍偏離委託人最優解所造成的福利損失</td>
</tr>
</tbody>
</table>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-2BZNWVrv="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="13" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%BD%B1%E9%9F%BF%E6%88%90%E6%9C%ACinfluence-cost">影響成本(Influence Cost)</h4>

<ul>
<li>
<p>將<code>任務內部化</code> (in-house) 會產生影響成本。</p>
</li>
<li>
<p>企業<code>內部資本市場</code>負責在企業內部<code>人力和資本配置</code>。</p>
<ul>
<li>各部門可能通過<code>遊說、政治活動</code>等影響資源配置。</li>
<li>影響活動所消耗的資源即為影響成本。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-tlPUUqJq="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%85%A7%E9%83%A8%E8%B3%87%E6%9C%AC%E5%B8%82%E5%A0%B4">內部資本市場</h4>

<ul>
<li>當組織中的<code>資源配置、升遷、預算</code>等決策由上層集中決定時，成員會把原本可用於生產的時間與精力，轉而投入到<code>遊說、討好、運作決策者等</code>無<strong>生產力的活動</strong>上，這種資源浪費即為影響成本。</li>
<li>簡言之：代理成本關注<strong>代理人偏離委託人利益</strong>；影響成本關注「下屬為影響決策而進行的<strong>尋租與內耗</strong>」。</li>
<li>產生條件
<ul>
<li>決策權集中（有「老闆」或委員會可被影響）</li>
<li>資源分配、升遷、評價具有裁量空間</li>
<li>影響結果的利益足夠大</li>
</ul>
</li>
<li>典型表現
<ul>
<li>花大量時間經營人際關係、向上管理，而非做好本職工作</li>
<li>部門之間爭奪預算與資源的政治角力</li>
<li>為爭取升遷而進行印象管理、隱瞞壞消息</li>
<li>組織內部的「尋租」與派系鬥爭</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-8AyQBgz7="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E8%88%87%E4%BB%A3%E7%90%86%E6%88%90%E6%9C%AC%E7%9A%84%E9%97%9C%E4%BF%82">與代理成本的關係</h4>

<ul>
<li>影響成本可視為代理問題在組織內部縱向關係上的一種延伸與具體化。</li>
<li>兩者共同點在於：都因<strong>利益不一致</strong>與<strong>資訊不對稱</strong>而產生資源誤置。
<ul>
<li>差別在於，<code>影響成本</code>特別強調<code>集中決策權</code>所誘發的尋租行為——即使沒有明顯的「貪污」或「怠惰」，光是遊說與內耗本身就是成本。</li>
</ul>
</li>
<li>當決策權、資訊與利益配置不當時，組織會產生內生的資源浪費。前者聚焦於「代理人偏離委託人」，後者聚焦於「下屬為影響集中決策而尋租」。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-J7ee999T="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="16" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%9E%82%E7%9B%B4%E6%95%B4%E5%90%88%E7%9A%84%E5%85%B8%E7%AF%84%E8%88%87%E8%A1%B0%E8%90%BD%E7%A6%8F%E7%89%B9%E8%83%AD%E8%84%82%E6%B2%B3%E5%B7%A5%E5%BB%A0ford-river-rouge">垂直整合的典範與衰落：福特胭脂河工廠（Ford River Rouge）</h4>

<ul>
<li>1920年代，亨利·福特為了實現Model T的大規模生產，在密西根州建立了「胭脂河工廠」。這是商業史上<code>向後垂直整合</code>（Backward Integration） 的極致：福特不僅組裝汽車，還擁有自己的鐵礦、煤礦、橡膠園、玻璃廠、鐵路甚至船隊。鐵礦石從一端進去，汽車從另一端出來。</li>
<li>為什麼選擇高度整合？
<ul>
<li>市場交易成本高：當時的供應商市場不成熟，零組件規格不統一，外部採購無法保證穩定供應與品質。</li>
<li>規模經濟與物流控制：將所有生產環節集中在一個園區，大幅降低了運輸與庫存成本。</li>
</ul>
</li>
<li>邊界的重塑（衰落與解體）： 隨著汽車產業成熟，這種「大包大攬」的垂直整合暴露出致命的內部組織成本：
<ul>
<li>官僚主義與影響成本：龐大的<code>內部部門為了爭奪預算和資源，產生了嚴重的內部政治與內耗</code>。</li>
<li>缺乏彈性：當消費者需求從單一的Model T轉向多樣化車款（如通用汽車的策略）時，福特龐大的專屬資產（專屬關係資產）變成了<code>沉沒成本</code>，無法快速轉向。</li>
</ul>
</li>
<li>結果：現代的汽車產業走向了<code>垂直分工</code>，車廠將70%以上的零組件外包給專業供應商（如Bosch、Denso），自身只保留核心設計與最終組裝，以維持靈活性。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-zUMv9M4v="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%8D%8A%E5%B0%8E%E9%AB%94%E7%94%A2%E6%A5%AD%E7%9A%84%E5%9E%82%E7%9B%B4%E8%A7%A3%E6%A7%8B%E5%BE%9E-idm-%E5%88%B0-fabless-foundry-ic-%E8%A8%AD%E8%A8%88%E5%85%AC%E5%8F%B8--%E6%99%B6%E5%9C%93%E4%BB%A3%E5%B7%A5%E5%BB%A0">半導體產業的垂直解構：從 IDM 到 Fabless-Foundry (IC 設計公司 -晶圓代工廠)</h4>

<ul>
<li>早期半導體產業的<code>垂直邊界是高度整合</code>的，即 IDM（Integrated Device Manufacturer，整合元件製造商）模式，如 Intel、三星、德州儀器。企業自己包辦 IC 設計、晶圓製造、封裝測試。</li>
<li>邊界的重塑（台積電的破局）： 1987年台積電創立，開創了純晶圓代工（Pure-play Foundry） 模式，徹底重塑了半導體的垂直邊界，催生了 Fabless（無晶圓廠設計公司，如 NVIDIA、AMD、聯發科）的崛起。</li>
<li>為什麼會發生垂直分工？
<ul>
<li><code>規模經濟</code>的門檻：先進製程晶圓廠的資本支出動輒上百億美元，設計公司根本無力承擔（內部化成本過高）。</li>
<li><code>資產專用性</code>與<code>敲竹槓風險</code>的降低：台積電透過標準化的 PDK（製程設計套件）和嚴格的 IP 保護契約，降低了設計公司與代工廠之間的<code>「交易成本」</code>。台積電「永不與客戶競爭」的承諾，解決了客戶擔心技術被剽竊的「敲竹槓（Hold-up）」風險。</li>
</ul>
</li>
<li>結果：半導體產業從「垂直整合」走向「垂直分工」，設計與製造解耦，大幅降低了創新門檻，造就了今天繁榮的晶片設計生態</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-IEELNZBl="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E7%82%BA%E9%80%9F%E5%BA%A6%E8%80%8C%E5%8F%8D%E5%B8%B8%E8%A6%8F%E6%95%B4%E5%90%88zarainditex%E7%9A%84%E6%A5%B5%E9%80%9F%E4%BE%9B%E6%87%89%E9%8F%88">為「速度」而反常規整合：Zara（Inditex）的極速供應鏈</h4>

<ul>
<li>在服裝零售產業，常規的垂直邊界是<code>高度外包</code>（如 H&amp;M、Gap 將生產幾乎全部外包給亞洲的低成本代工廠）。然而，Zara 卻選擇了半垂直整合：它將約 50% 的核心產品生產，保留在西班牙總部附近的自有工廠或緊密合作的當地工廠，只有<code>基礎款</code>才外包到亞洲。</li>
<li>為什麼選擇內部化（整合）？
<ul>
<li><code>時間成本</code>與<code>機會成本</code>：快時尚的核心競爭力是「速度」。如果外包到亞洲，從設計到上架需要數月，且必須提前大量下單，這會導致極高的庫存滯銷風險（這是一種隱性的交易成本）。</li>
<li><code>靈活性</code>優先於製造成本：Zara 在西班牙生產的製造成本雖然比亞洲高，但將前置時間壓縮到僅需 2-3 週，且可以小批量生產、根據市場反饋快速補貨。</li>
</ul>
</li>
<li>結果：Zara 透過向後整合核心生產環節，犧牲了部分製造成本，但大幅降低了庫存成本與錯失市場趨勢的風險，成就了其快時尚霸主地位。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-jNLZuYcj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E8%87%AA%E8%A3%BD%E7%9A%84%E7%90%86%E7%94%B1">自製的理由</h4>

<ul>
<li>
<p>與供應商<code>協調不善</code>帶來的成本；</p>
</li>
<li>
<p>合作夥伴不願<code>開發</code>和<code>共用私有資訊</code>；</p>
</li>
<li>
<p>通過內部完成任務可避免的交易成本。</p>
</li>
<li>
<p>上述三類問題均可追溯至<code>契約(合同)</code> 訂立的困難。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-AAK4CXjd="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%A5%91%E7%B4%84%E7%9A%84%E4%BD%9C%E7%94%A8">契約的作用</h4>

<ul>
<li>
<p><code>契約</code>保護交易雙方免受對方<code>機會主義行為</code>的侵害</p>
<ul>
<li>當某些任務由企業外部完成時，企業常使用契約。</li>
</ul>
</li>
<li>
<p>契約通常列明：</p>
<ul>
<li>需要完成的<code>任務內容</code>；</li>
<li>一方<code>未履行義務</code>時的補救措施；</li>
<li>執行任務的<code>成本</code>。</li>
</ul>
</li>
<li>
<p>契約的保護效力取決於：</p>
<ul>
<li>契約本身的<code>完備性</code>；</li>
<li><code>契約法體系</code>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-UFQPcvIl="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%AE%8C%E5%82%99%E5%A5%91%E7%B4%84complete-contract">完備契約（Complete Contract）</h4>

<ul>
<li>要使契約可執行，<strong>外部第三者(如法官或仲裁員)</strong> 必須能夠：
<ul>
<li>觀察到<code>具體情境</code>（contingency）；</li>
<li>觀察到各方<code>行為</code>；</li>
<li>對違約方施加約定的<code>懲罰</code>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-aCclLeos="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%B8%8D%E5%AE%8C%E5%82%99%E5%A5%91%E7%B4%84incomplete-contracts">不完備契約（incomplete contracts）</h4>

<ul>
<li>現實中的契約通常是不完備契約。常見的因素:
<ul>
<li>有限理性；</li>
<li><code>績效</code>難以界定或衡量；</li>
<li>信息不對稱。</li>
</ul>
</li>
</ul>
<h4 id="%E6%9C%89%E9%99%90%E7%90%86%E6%80%A7">有限理性</h4>
<ul>
<li>個人在以下方面能力有限：
<ul>
<li>資訊處理；應對複雜性； 追求理性目標。</li>
<li>個人無法預見所有可能的情境。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-l5DXYSoE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E7%B8%BE%E6%95%88%E7%9A%84%E7%95%8C%E5%AE%9A%E8%88%87%E8%A1%A1%E9%87%8F">績效的界定與衡量</h4>

<ul>
<li>
<p>契約履行的標準可能存在<code>殘餘模糊性</code>。例如: <code>正常磨損</code>等術語可能有不同解釋。</p>
</li>
<li>
<p>績效有時並不總能被明確無誤地衡量。<code>服務品質</code></p>
</li>
</ul>
<h4 id="%E4%BF%A1%E6%81%AF%E4%B8%8D%E5%B0%8D%E7%A8%B1">信息不對稱</h4>
<ul>
<li>
<p>契約各方對與契約相關的<code>資訊獲取並不對等</code>。</p>
<ul>
<li>通常某一方具有資訊優勢, 資訊優勢方可能肆無忌憚地提供虛假資訊。</li>
</ul>
</li>
<li>
<p>依賴此類資訊不對等所訂立的契約將面臨執行困難。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-RrK8uC5e="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="24" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E7%A7%81%E6%9C%89%E8%B3%87%E8%A8%8A%E6%B4%A9%E9%9C%B2">私有資訊洩露</h4>

<ul>
<li>企業不希望其<code>競爭優勢</code>來源遭到損害。
<ul>
<li>當使用外部企業時，<code>產品設計</code>或<code>生產工藝</code>等私有資訊可能被洩露。</li>
</ul>
</li>
<li>有效的<code>專利保護</code>有所幫助，但可能無法<strong>提供充分保障</strong>。
<ul>
<li><code>保險是事後</code></li>
<li>可通過包含競業禁止條款的契約防止資訊洩露。
<ul>
<li>實際中，競業禁止條款往往難以執行。</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-oUl5gjFE="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="transactions-costs%E4%BA%A4%E6%98%93%E6%88%90%E6%9C%AC">Transactions Costs交易成本</h4>

<ul>
<li>
<p>若市場機制能提升效率，為何大量活動仍在<code>價格體系</code>之外進行？(Coase提出)</p>
</li>
<li>
<p>採用市場機制所產生的、可通過內製節省的成本即<code>交易成本</code>。</p>
<ul>
<li>外包涉及<code>談判</code>、<code>起草</code>和<code>執行契約</code>的成本。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-BxtuhcJ0="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%BA%A4%E6%98%93%E6%88%90%E6%9C%AC%E7%9A%84%E4%BE%86%E6%BA%90">交易成本的來源</h4>

<ul>
<li>
<p>需要<code>關係專用性資產</code>（Relationship-Specific Assets）的投資；</p>
<ul>
<li>往往該項投資完成後可能出現<code>機會主義行為</code>（“敲竹槓”(套牢) 問題，hold-up problem）；</li>
<li>准租(quasi –rent)（套牢問題的嚴重程度）。</li>
</ul>
</li>
<li>
<p>是<code>專為某項交易所必需投入的資產</code>；一旦投入，交易對方難以無成本替換，雙方在一定程度上被<code>鎖定</code>。</p>
<ul>
<li>投資一旦投入，就難以轉作他用（即「沉沒成本」高）；若想要轉用於其他交易，將產生巨大成本。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-UNRJu5zJ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E8%B3%87%E7%94%A2%E5%B0%88%E7%94%A8%E6%80%A7%E7%9A%84%E5%BD%A2%E5%BC%8F">資產專用性的形式</h4>

<ul>
<li>地理區位專用性；</li>
<li>實物資產專用性；</li>
<li>專用投資；</li>
<li>人力資產專用性。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-4CSEEY8k="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="28" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%9C%B0%E7%90%86%E5%8D%80%E4%BD%8D%E5%B0%88%E7%94%A8%E6%80%A7">地理區位專用性</h4>

<ul>
<li>為節省<code>運輸與庫存成本、提高流程效率</code>，資產需靠近特定地點佈局：
<ul>
<li>水泥廠通常建在石灰礦附近；</li>
<li>制罐廠 靠近 罐裝廠 佈局。</li>
<li>友達面板接近康寧玻璃</li>
</ul>
</li>
</ul>
<h4 id="%E5%AF%A6%E7%89%A9%E8%B3%87%E7%94%A2%E5%B0%88%E7%94%A8%E6%80%A7">實物資產專用性</h4>
<ul>
<li>實物資產可能需為特定交易專門設計：
<ul>
<li>玻璃容器生產所用<code>模具</code>為特定用戶定制；</li>
<li>煉油廠專為處理某種鋁土礦而設計。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-jWqVlIh8="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="29" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E6%B1%BD%E8%BB%8A%E9%9B%B6%E7%B5%84%E4%BB%B6%E7%9A%84-make-or-buymonteverde--teece-1982">汽車零組件的 make-or-buy（Monteverde &amp; Teece, 1982）</h4>

<ul>
<li>需要<code>「應用專屬工程知識」</code>（application-specific know-how）的零組件，GM 與克萊斯勒更傾向<code>自製</code>；標準化零件則外購。</li>
<li>現代對照：汽車座椅供應商（Lear、Magna）在組裝廠旁設專屬產線（高專用性），但因重複交易與聲譽機制存在，多以長期契約 + 共設園區的混合模式治理，而非全面整合。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-yBlOtRlh="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="30" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%B0%88%E7%94%A8%E6%8A%95%E8%B3%87">專用投資</h4>

<ul>
<li>某些投資專為滿足單一客戶而進行，若失去該客戶，原本的投資將無利可圖：
<ul>
<li>港口為滿足某些客戶的特殊需求而投資；</li>
<li>國防承包商為生產特定先進武器系統而建設製造設施。</li>
</ul>
</li>
</ul>
<h4 id="asml-%E8%88%87%E8%94%A1%E5%8F%B8zeiss%E6%A5%B5%E7%AB%AF%E5%B0%88%E7%94%A8%E6%80%A7%E4%B8%8B%E7%9A%84%E6%B7%B7%E5%90%88%E6%B2%BB%E7%90%86">ASML 與蔡司（Zeiss）：極端專用性下的混合治理</h4>
<ul>
<li><strong>情境</strong>：EUV 曝光機的極紫外光學鏡片，全球只有蔡司能做，精度要求達原子級。</li>
<li><strong>專用性</strong>：蔡司的設備、人才與 know-how 幾乎完全<strong>專屬於 ASML</strong>；反之 ASML 也高度依賴蔡司 ——雙邊鎖定。</li>
<li><strong>治理選擇</strong>：ASML 並未完全整合蔡司（隱性知識難以內部化），而是 2017 年入股蔡司半導體光學部門 <strong>24.9%</strong> 並共同投資研發——以<strong>持股聯盟</strong>  這種混合模式保護雙邊專屬投資</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-im5H36Hf="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="31" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="tesla-%E8%88%87-panasonic-%E7%9A%84-gigafactory">Tesla 與 Panasonic 的 Gigafactory</h4>

<ul>
<li>內華達電池廠中，Panasonic 投資電池芯產線、Tesla 負責電池組裝與系統整合。</li>
<li>專用性：雙方互為專屬資產且地理共置。</li>
<li>治理：以合資/長期合作契約分擔投資與風險，而非 Tesla 自行整合電芯製造（當時缺乏相關能力）。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-SXYKhAFW="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="32" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E4%BA%BA%E5%8A%9B%E8%B3%87%E7%94%A2%E5%B0%88%E7%94%A8%E6%80%A7">人力資產專用性</h4>

<ul>
<li>
<p>參與交易的某些員工需掌握與特定關係相關的<code>技能、知識和資訊</code>：</p>
<ul>
<li>行政人員掌握特定<code>企業資源計畫（ERP）軟體</code>的使用技能；</li>
<li>銷售人員深入瞭解客戶企業的內部組織結構。</li>
</ul>
</li>
<li>
<p>企業專屬訓練（如台積電製程工程師的 tacit know-how）使員工技能對外部市場價值有限 → 企業以<code>薪酬、內部升遷, 長期僱用、年功</code>等內部勞動市場機制保護雙方投資，這是 「人力」層面的垂直邊界延伸。</p>
<ul>
<li>效率工資論</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-Yr9U5oHS="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="33" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="%E5%A5%97%E7%89%A2%E5%95%8F%E9%A1%8C">套牢問題</h4>

<ul>
<li>租金與准租金（Rent and Quasi-rent）
<ul>
<li>租金（Rent）：指經濟利潤；</li>
<li><strong>准租金（Quasi-rent）</strong>：指某項交易產生的超額經濟利潤。</li>
</ul>
</li>
<li>敲竹槓問題（The Hold-up Problem 套牢）
<ul>
<li>在<code>不完備契約</code>和<code>關係專用性資產</code>並存的情況下，交易一方可能在投資完成後，利用對方的<code>依賴性</code>要求重新談判（如提高價格、降低服務），從而攫取部分准租金，導致投資不足或合作失敗。這就是著名的<code>敲竹槓套牢</code>問題。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-nOzRSURw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="34" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<ul>
<li>
<p>假設 A 公司（買方）需要 B 公司（供應商）提供一種<strong>特殊零件</strong>。B 必須投資 100 萬元建置專用生產線（關係專用性資產）。雙方簽訂契約，但因契約不完備，未明確約定未來價格調整機制。</p>
<ul>
<li>事前（ex ante）：B 考慮是否投資。若預期投資後能獲得合理報酬，就會投資。</li>
<li>事後（ex post）：B 投資完成後，A 知道 B 已被「套牢」（因為生產線無法轉賣），於是要求降價：「不然我就換供應商（即使實際上很難換）」。</li>
</ul>
</li>
<li>
<p>由於契約不完備，法院無法強制執行原定價格，B 只能被迫接受較低價格。</p>
</li>
<li>
<p>結果：B 的投資報酬降低，甚至虧損；預期到這種風險，B 在<code>事前</code>可能不願投資，導致有效率的交易無法發生（投資不足，underinvestment）</p>
</li>
<li>
<p>這解釋了為何某些交易會選擇<strong>垂直整合（vertical integration）</strong></p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-SAiRM6Bj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="35" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="37" data-size="16:9">
<h4 id="fisher-body-%E8%88%87-gmklein-crawford--alchian-1978">Fisher Body 與 GM——（Klein, Crawford &amp; Alchian, 1978）</h4>

<ul>
<li>1920 年代 GM 向 Fisher Body 採購汽車車身，簽約 10 年、採成本加成計價。</li>
<li>專用性：車身模具與廠房是高度實體與場址專用投資；Fisher 不願在 GM 組裝廠旁設廠（怕形成專屬資產被剝削）。</li>
<li>敲竹槓：Fisher 利用契約漏洞（成本加成 → 多用人工、抬高成本基數）賺取準租金，且拒絕配合調整廠址。</li>
<li>邊界重劃：GM 於 1926 年買下 Fisher Body，垂直整合解決 hold-up。（註：Coase 晚年對此案的真實動機提出質疑。）</li>
</ul>

<h4 id="%E8%A7%A3%E6%B1%BA%E6%95%B2%E7%AB%B9%E6%A7%93%E7%9A%84%E5%90%91%E5%BE%8C%E6%95%B4%E5%90%88%E8%98%8B%E6%9E%9C%E8%87%AA%E7%A0%94%E6%99%B6%E7%89%87apple-silicon">解決「敲竹槓」的向後整合：蘋果自研晶片（Apple Silicon）</h4>

<p>把<strong>交易內部化到同一企業內</strong>，以避免契約不完備帶來的套牢風險。</p>
<ul>
<li>長達十幾年間，蘋果 Mac 電腦的 CPU 一直依賴 Intel 供應（市場交易/外包）。但在 2020 年，蘋果宣布放棄 Intel，全面轉向自研的 M 系列晶片（Apple Silicon），這是一次重大的向後垂直整合。</li>
<li>為什麼選擇內部化？
<ul>
<li>高度資產專用性與績效瓶頸：蘋果對筆電的輕薄、續航與效能有極致要求，而 Intel 的通用型 x86 晶片在功耗控制上遭遇瓶頸（「擠牙膏」）。</li>
<li>敲竹槓風險（Hold-up Problem）：當蘋果的產品創新高度依賴 Intel 的晶片進度時，Intel 的研發延遲直接拖累了 Mac 的銷量。蘋果處於被動挨打的局面。</li>
<li>生態系整合：蘋果希望打通 Mac、iPhone、iPad 的底層架構（ARM 架構），這需要硬體與 iOS/macOS 軟體的深度協同，外部供應商無法提供這種專屬關係資產。</li>
<li>結果：蘋果透過向後整合自研晶片，不僅擺脫了對 Intel 的依賴，還實現了遠超競爭對手的能效比，並進一步鞏固了其軟硬體一體化的隔離機制。</li>
</ul>
</li>
</ul>

</section>

<h4 id="%E5%A5%97%E7%89%A2%E5%B0%8D%E4%BA%A4%E6%98%93%E6%88%90%E6%9C%AC%E7%9A%84%E5%BD%B1%E9%9F%BF">套牢對交易成本的影響</h4>

<ul>
<li>套牢問題提高了交易成本：
<ul>
<li>契約(合同)談判更加困難；</li>
<li>可能需投資以改善事後議價地位；</li>
<li>潛在套牢引發不信任；</li>
<li>關係專用性資產投資不足。</li>
</ul>
</li>
</ul>
<h4 id="%E5%A5%97%E7%89%A2%E8%88%87%E6%98%82%E8%B2%B4%E7%9A%84%E9%98%B2%E8%AD%B7%E6%8E%AA%E6%96%BD">套牢與昂貴的防護措施</h4>
<ul>
<li>為防範套牢風險，各方可能投資於低效的保護措施：
<ul>
<li>製造商為從市場企業採購的投入品建立 備用生產基地；</li>
<li>使用浮動式發電廠，以避免地點專用性投資。</li>
</ul>
</li>
</ul>

</section>
