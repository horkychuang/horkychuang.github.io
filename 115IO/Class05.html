<h5 id="%E7%B6%AD%E6%8C%81%E7%AB%B6%E7%88%AD%E5%84%AA%E5%8B%A2">維持競爭優勢</h5>

<footer>Designed by Wen-Bin 2026-09-05</footer>

<h4 id="%E7%B6%AD%E6%8C%81%E7%AB%B6%E7%88%AD%E5%84%AA%E5%8B%A2-1">維持競爭優勢</h4>

<ul>
<li><strong>長期</strong>維持競爭優勢並非易事。</li>
<li>競爭對手可以<code>模仿</code>成功的模式。</li>
<li>競爭對手可利用<code>新技術</code>、<code>新產品</code>和<code>新的商業模式</code>，削弱行業領導者的競爭優勢。</li>
<li>然而，一些企業（如可口可樂、戴爾電腦）成功長期維持其競爭優勢。而另一些企業則在競爭對手的壓力下逐漸喪失了競爭優勢(如 Nokia、Sony)</li>
</ul>
<p>Why?</p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-BLARPrHD="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E7%9B%88%E5%88%A9%E8%83%BD%E5%8A%9B%E7%9A%84%E6%8C%81%E7%BA%8C%E6%80%A7%E8%AD%89%E6%93%9A">盈利能力的持續性證據</h4>

<ul>
<li><strong>傳統理論</strong>上, <code>資產回報率（ROA）</code> 異常高的企業，其回報率會隨時間下降；資產回報率異常低的企業，其回報率會隨時間改善；
<ul>
<li><code>進入</code>、<code>模仿</code>和<code>價格競爭</code>最終會迫使經濟利潤趨於零；競爭力量會使資產回報率（ROA）趨近于資本成本；無論企業當前的盈利狀況如何，隨著時間推移，只要夠競爭, 其利潤終將向競爭性水準收斂。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-0Vie2emK="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E7%B6%AD%E6%8C%81%E7%AB%B6%E7%88%AD%E5%84%AA%E5%8B%A2-2">維持競爭優勢</h4>

<p>Dennis Mueller’s study對美國製造企業的研究發現：</p>
<ul>
<li>
<p>實際數據上, <code>高ROA</code>企業和<code>低ROA</code>企業並未趨同於一個共同的平均水準。意味著某些企業<strong>競爭優勢</strong> 能夠在競爭對手試圖複製或抵消它的努力下, 依然持續存在。</p>
</li>
<li>
<p>研究顯示: 可持續性可通過<strong>兩種方式</strong>實現：</p>
<ul>
<li>企業之間在<code>資源與能力</code>上存在持久差異；</li>
<li>存在<code>隔離機制</code>（isolating mechanisms）
<ul>
<li>類似於行業中的<code>進入障礙(壁壘)</code> ,保護企業的競爭優勢。</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-Mnt9RzZj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E4%BC%81%E6%A5%AD%E8%B3%87%E6%BA%90%E5%9F%BA%E7%A4%8E%E7%90%86%E8%AB%96resource-based-view-rbv">企業資源基礎理論(Resource Based View, RBV)</h4>

<ul>
<li>
<p>企業資源基礎理論從 <code>資源與能力的異質性</code> 角度解釋持續競爭優勢。</p>
</li>
<li>
<p>要支撐競爭優勢，<strong>資源與能力</strong> 必須具備以下特徵：</p>
<ul>
<li><strong>稀缺性</strong>,    <strong>不完全流動性</strong>,    <strong>無法在公開市場上獲得</strong>
<ul>
<li>對價值創造至關重要的 <code>稀缺資源與能力</code> 往往是 <code>不完全流動的</code>，無法在公開市場上輕易獲取。</li>
</ul>
</li>
<li>這些資源可能是不可交易的，也可能是<strong>專屬關係資產（relationship-specific assets）</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-2we2eafa="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E9%9A%94%E9%9B%A2%E6%A9%9F%E5%88%B6-isolating-mechanisms">隔離機制 (Isolating Mechanisms)</h4>

<ul>
<li>
<p><code>隔離機制</code>: 限制競爭對手<code>侵蝕</code>企業的競爭優勢。</p>
<ul>
<li>對企業而言，隔離機制的作用相當於行業中的<code>進入障礙(壁壘)</code>。</li>
</ul>
</li>
<li>
<p>兩種主要類型的隔離機制包括：</p>
<ul>
<li><strong>模仿障礙</strong></li>
<li><strong>先行者優勢</strong></li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-t1yhgySy="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E6%A8%A1%E4%BB%BF%E9%9A%9C%E7%A4%99">模仿障礙</h4>

<ul>
<li>
<p>這些機制阻礙 <code>潛在進入者</code> 複製在位企業的資源和能力。</p>
</li>
<li>
<p><code>五種</code>重要且常見的模仿障礙 包括：</p>
<ul>
<li><code>法律限制</code>: 例如專利、版權以及政府監管</li>
<li>對<strong>投入品</strong>或<strong>客戶</strong>的優先獲取管道</li>
<li>通過<code>垂直整合</code>、<code>長期合同</code>或<code>排他性交易條款</code>實現</li>
<li><code>市場規模</code>與<code>規模經濟</code></li>
<li><code>無形壁壘</code></li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-01kYeXQf="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E5%B8%82%E5%A0%B4%E8%A6%8F%E6%A8%A1%E8%88%87%E8%A6%8F%E6%A8%A1%E7%B6%93%E6%BF%9F">市場規模與規模經濟</h4>

<ul>
<li>
<p>當市場需求可由<code>單一生產者</code>滿足時（如專業產品市場），基於 <strong>規模經濟</strong> 形成的壁壘通常更有效。</p>
</li>
<li>
<p>如果<strong>市場增長</strong>使進入變得有利可圖，基於規模經濟的壁壘可能隨之削弱。</p>
</li>
</ul>
<h4 id="%E7%84%A1%E5%BD%A2%E6%A8%A1%E4%BB%BF%E5%A3%81%E5%A3%98">無形模仿壁壘</h4>
<ul>
<li>
<p>如果企業的優勢源於<code>獨特的組織能力</code>，則模仿壁壘往往是無形的。</p>
</li>
<li>
<p>此類無形壁壘主要包括以下三種：</p>
<ul>
<li>因果模糊性</li>
<li>歷史情境依賴</li>
<li>社會複雜性</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-8qNVZAQt="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E5%9B%A0%E6%9E%9C%E6%A8%A1%E7%B3%8A%E6%80%A7">因果模糊性</h4>

<ul>
<li>
<p>當企業的成功源於<code>複雜</code>、<code>相互依賴</code>的內部資源（如<code>獨特的管理風格</code>、<code>員工協作模式</code>、<code>隱性知識</code>），外部競爭者很難拆解出哪些要素是關鍵。這種「黑箱效應」使模仿變得極其困難。</p>
<ul>
<li>因果模糊性本身也可能成為規模不經濟的來源，因為企業可能無法在不同工廠之間複製其成功經驗。</li>
</ul>
</li>
</ul>
<p>「因果模糊性（Causal Ambiguity）」就像一把<strong>雙面刃</strong>：</p>
<ul>
<li><strong>正面（隔離機制）</strong>：因為競爭者看不懂你的「成功配方」，所以無法模仿，形成極強的護城河。</li>
<li><strong>負面（規模不經濟）</strong>：因為連企業自己都無法完全拆解這個「黑箱」，導致在跨國擴張、開設新廠或併購時，無法成功複製過去的輝煌，甚至因為強行複製而導致效率崩盤。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-V9Ui4QQw="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<p><strong>因果模糊性（Causal Ambiguity）<strong>為企業帶來了一個</strong>策略兩難（Strategic Dilemma）</strong>：</p>

<ol>
<li><strong>若要防止模仿</strong>：企業必須保持資源的複雜性與隱性化（維持黑箱）。</li>
<li><strong>若要追求成長</strong>：企業必須將知識標準化、顯性化（SOP化），以便複製到新工廠或新市場。</li>
</ol>
<p><strong>如何破解？</strong> 成功的企業通常不會強行「複製黑箱」，而是採用以下策略來<code>避免規模不經濟</code>：</p>
<ul>
<li><strong>內部孵化（Internal Venturing）</strong>：像蘋果或谷歌，當要進入新領域時，成立獨立的新部門，讓新的黑箱在內部自然生長，而不是把舊的黑箱強套上去。</li>
<li><strong>保持適度規模（Optimal Scale）</strong>：像西南航空或某些頂級精品品牌，主動放棄部分市場份額，將規模控制在「隱性文化與默契」能夠有效覆蓋的範圍內。</li>
<li><strong>收購而非複製</strong>：像迪士尼收購皮克斯，直接買下整個「黑箱團隊」並保持其獨立運作，而不是試圖把他們的基因抽出來注入自己體內。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-E8yMH9Fd="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="11" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E8%98%8B%E6%9E%9C%E5%85%AC%E5%8F%B8apple%E7%9A%84%E8%A8%AD%E8%A8%88%E8%88%87%E6%95%B4%E5%90%88%E5%93%B2%E5%AD%B8">蘋果公司（Apple）的設計與整合哲學</h4>

<ul>
<li><strong>因果模糊性（黑箱效應）：</strong> 三星或華為可以買到與蘋果相同規格的螢幕、晶片，甚至模仿 iOS 的介面，但始終無法複製蘋果的「無縫體驗」。
<ul>
<li>因為蘋果的成功源於賈伯斯留下的<strong>跨部門極度咬合的整合能力</strong>。在蘋果，<code>工業設計團隊</code>、<code>硬體工程團隊</code>、<code>軟體團隊</code>與<code>零售店體驗設計</code>是「同時且平行」開發的，這種<strong>高度封閉、極度控制、依賴少數天才決策者品味</strong>的協作模式，外部競爭者完全無法拆解，也無法從外部挖角來複製。</li>
</ul>
</li>
<li><strong>規模不經濟的爆發：</strong> 這種黑箱模式在蘋果規模較小時威力無窮，但當蘋果成為市值數兆美元的巨頭時，這種「高度中央集權、依賴隱性默契」的模式開始遭遇瓶頸。
<ul>
<li>例如在發展 <strong>Apple TV+（串流媒體內容）</strong> 或 <strong>Apple Car（已終止的造車計畫）</strong> 時，蘋果發現其封閉的整合文化與好萊塢的開放創意文化、或汽車產業的龐大供應鏈協作模式格格不入。</li>
<li>強行將「蘋果黑箱」套用在需要大規模開放協作的領域，導致了極高的內部溝通成本與決策延遲，這就是典型的規模/範圍不經濟。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-dSjTiUIS="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E8%B1%90%E7%94%B0%E6%B1%BD%E8%BB%8Atoyota%E8%88%87-tps-%E7%94%9F%E7%94%A2%E7%B3%BB%E7%B5%B1%E7%9A%84%E8%B7%A8%E5%9C%8B%E5%9B%B0%E5%A2%83">豐田汽車（Toyota）與 TPS 生產系統的跨國困境</h4>

<ul>
<li><strong>因果模糊性（黑箱效應）：</strong> 全球車廠都曾花費巨資去研究豐田的「TPS（豐田生產方式）」，模仿其<code>「看板（Kanban）」</code>、<code>「Just-in-Time（及時生產）」</code>和<code>「零庫存」</code>，但所有人都失敗了。
<ul>
<li>因為豐田真正的核心競爭力不是這些「看得見的工具」，而是<strong>隱性知識與社會複雜性</strong>：</li>
<li>例如基層員工被賦予「隨時拉下停線繩（Andon Cord）」的權力、供應商之間長達數十年的信任與知識共享、以及深植於企業員工DNA的「持續改善（Kaizen）」文化。競爭者只學到了<strong>形</strong>，沒學到<strong>神</strong>。</li>
</ul>
</li>
<li><strong>規模不經濟的爆發：</strong> 2000年代後期，豐田為了追求「全球第一」的規模，急速在美國、歐洲和中國擴張建廠。然而，TPS 高度依賴「人與人之間的默契」和「隱性文化傳承」。當工廠規模過大、跨國文化差異增加時，這種黑箱經驗<strong>無法被標準化複製</strong>到新工廠。 <strong>結果：</strong> 新工廠的品質管控失靈，導致 2009-2010 年爆發震驚全球的「大規模召回事件」（煞車與油門踏板問題）。這證明了當因果模糊性過高時，企業的擴張邊際成本會急劇上升，產生嚴重的規模不經濟。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-HAlvtLdy="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="13" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E6%AD%B7%E5%8F%B2%E6%83%85%E5%A2%83%E4%BE%9D%E8%B3%B4">歷史情境依賴</h4>

<ul>
<li>
<p>也常被稱為 <strong>「路徑依賴」（Path Dependence）</strong>。這是一個極具哲學意味的商業概念：</p>
<ul>
<li>
<p>企業今天的競爭力，是由<code>過去一連串</code>「獨特的選擇、偶然的機遇與歷史積累」所塑造的。</p>
</li>
<li>
<p>獨特的能力可能與企業的發展歷史密不可分，難以被後來者複製。</p>
</li>
<li>
<p>對歷史情境的依賴可能限制企業的增長潛力。</p>
</li>
</ul>
</li>
<li>
<p>歷史依賴也可能意味著這些策略略僅在<code>有限時間內</code>有效。</p>
</li>
<li>
<p>「為什麼成功」的答案，常常寫在<code>過去的選擇</code>與<strong>偶然</strong>之中</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-NiMi4u5Z="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<p>「歷史情境依賴」告訴我們一個殘酷的現實：<strong>企業過去成功的基因，往往就是未來失敗的種子。</strong>（即學者 Dorothy Leonard-Barton 提出的<strong>核心剛性 Core Rigidity</strong>）。</p>
<p>建議企業採取以下做法：</p>
<ol>
<li><strong>建立「雙元性組織」（Ambidextrous Organization）：</strong> 在維持核心業務（利用歷史優勢）的同時，必須成立<code>完全獨立的創新部門</code>（探索新情境），賦予其不同的 KPI、文化和資源，避免新業務被舊有的歷史慣性扼殺。</li>
<li><strong>定期进行「零基思考」（Zero-Based Thinking）：</strong> 高層應定期質問：「如果我們今天才剛創立這家公司，沒有任何歷史包袱，我們會怎麼做現在的業務？」這有助於識別哪些是真正的核心能力，哪些只是歷史遺留下來的累贅。</li>
<li><strong>警惕「成功者的詛咒」：</strong> 當一個策略在過去 10 年都非常成功時，管理者最該警惕的不是競爭者，而是「這個策略的<code>有效期限</code>是否已經到了」。</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-K9uE2cez="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E7%99%BE%E8%A6%96%E9%81%94blockbuster%E7%9A%84%E9%80%BE%E6%9C%9F%E7%BD%B0%E6%AC%BE%E5%8C%85%E8%A2%B1">百視達（Blockbuster）的「逾期罰款」包袱</h4>

<ul>
<li><strong>歷史情境的積累：</strong> 百視達在 1990 年代至 2000 年代初的絕對成功，建立在兩個歷史選擇上：
<ul>
<li>大規模擴張實體店面，以及<strong>高度依賴「影片逾期罰款」</strong>（這曾佔其總利潤的 15% 以上）。這種模式在錄影帶/DVD 租賃的「歷史情境」下非常成功。</li>
</ul>
</li>
<li><strong>難以被後來者複製（正面）：</strong> 當時的競爭者很難在短時間內複製百視達龐大的實體店面網絡和供應鏈。</li>
<li><strong>限制增長與策略失效（負面）：</strong> 當 Netflix 提出「無逾期罰款、郵寄租賃、後來轉向串流」的商業模式時，百視達其實有機會收購 Netflix 或跟進。
<ul>
<li>但百視達<strong>無法複製這個新模式</strong>，因為他們的整個組織結構、KPI 考核、甚至營收預測，都<strong>歷史性地依賴</strong>於實體店面和逾期罰款。</li>
<li>如果轉向無罰款模式，等於親手摧毀自己過去 20 年建立的獲利引擎（即「蠶食效應」Cannibalization）。</li>
</ul>
</li>
<li><strong>結果：</strong> <code>過去</code>的成功路徑成為了<code>今天</code>的致命傷，百視達於 2010 年破產。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-YD0REDZr="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="16" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E6%9F%AF%E9%81%94kodak%E8%88%87%E6%95%B8%E4%BD%8D%E7%9B%B8%E6%A9%9F%E7%9A%84%E6%82%96%E8%AB%96">柯達（Kodak）與數位相機的悖論</h4>

<ul>
<li><strong>歷史情境的積累：</strong> 柯達在<code>底片時代</code>的成功，建立在龐大的「化學製造資產」、「全球沖洗相片網絡」以及「剃刀與刀片（賣相機賺底片錢）」的商業模式上。</li>
<li><strong>過去的選擇與偶然：</strong> 鮮為人知的是，<strong>世界上第一台數位相機其實是柯達工程師在 1975 年發明的</strong>，柯達完全擁有這項技術。</li>
<li><strong>策略僅在有限時間內有效：</strong> 然而，柯達的管理層陷入了歷史依賴的盲點。
<ul>
<li>他們過去的成功經驗告訴他們：「數位相機會蠶食我們高利潤的底片業務」。因為企業的資源分配、高層晉升、甚至企業認同感，都與「化學底片」的歷史情境綁定，他們選擇將數位技術雪藏，試圖延長底片時代的壽命。</li>
</ul>
</li>
<li><strong>結果：</strong> 歷史情境改變（數位化浪潮），過去的成功公式瞬間失效，柯達最終因無法擺脫歷史包袱而走向衰敗。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-vb5YIQc7="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E5%BE%AE%E8%BB%9Fmicrosoft%E7%9A%84%E8%BB%9F%E9%AB%94%E6%8E%88%E6%AC%8A%E8%B7%AF%E5%BE%91%E4%BE%9D%E8%B3%B4">微軟（Microsoft）的「軟體授權」路徑依賴</h4>

<ul>
<li><strong>歷史情境的積累：</strong> 微軟過去 30 年的巨大成功，建立在「開發軟體 ➔ 銷售<strong>永久授權（License）</strong>」的商業模式上。這種模式利潤極高，塑造了微軟以「產品為中心」的銷售文化和組織架構。</li>
<li><strong>限制增長潛力：</strong> 當 2010 年代雲端運算（Cloud）和開源軟體崛起時，市場需要的是<strong>訂閱制（SaaS）</strong> 和<strong>跨平台服務</strong>。
<ul>
<li>但微軟內部深受歷史依賴影響：銷售團隊習慣了一次性賣出高額授權，工程師習慣了將 Windows 視為封閉的搖錢樹。這導致微軟在行動裝置（Windows Phone）和早期雲端市場錯失良機，因為他們無法放棄歷史的獲利模式。</li>
</ul>
</li>
<li><strong>打破依賴：</strong> 直到 2014 年 Satya Nadella 接任 CEO，他進行了痛苦的「零基思考」，強行將公司歷史依賴的「Windows 優先」策略，扭轉為「雲端優先（Cloud First）」，甚至將 Office 軟體開放給競爭對手蘋果的 iOS 系統。微軟花了近十年時間，才勉強擺脫了歷史情境的引力，重新獲得增長。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-sFtEMjPQ="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E7%A4%BE%E6%9C%83%E8%A4%87%E9%9B%9C%E6%80%A7">社會複雜性</h4>

<ul>
<li>
<p>企業的競爭優勢如果建立在<strong>人與人之間的互動、信任、文化與關係網絡</strong>上，那麼競爭者就無法透過「購買設備」或「挖角單個人材」來複製它。</p>
<ul>
<li>因為你無法買下一個團隊的<code>默契</code>，也無法用合約強制規定「信任」。</li>
</ul>
</li>
<li>
<p>如果競爭優勢根植於<code>社會複雜的過程</code>，則很難被複製。</p>
</li>
<li>
<p>包括<code>管理者之間的互動</code>、<code>企業與供應商</code>及<code>客戶之間</code>複雜的社會關係網路，這些過程難以被外部觀察或模仿。</p>
</li>
<li>
<p>即使這些複雜的社會互動被理解，也難以被模仿。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-sHwi8mzg="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<p><strong>社會複雜性</strong>告訴我們：最堅固的競爭優勢，往往不是專利技術或獨家配方，而是「人與人之間如何協作」的無形網絡。對於管理者而言，這帶來兩個重要啟示：</p>
<ol>
<li><strong>警惕「抄襲 SOP」的迷思：</strong> 當企業看到競爭對手的成功做法時，不要只盯著表面的流程（SOP）或組織圖。必須深入思考：支撐這個流程的「社會規範、信任基礎與互動模式」是什麼？如果自身企業不具備這種社會土壤，盲目抄襲只會導致「橘逾淮為枳」。</li>
<li><strong>投資於「社會資本（Social Capital）」：</strong> 企業應將建立內部信任、促進跨部門溝通、培養與供應商/客戶的長期夥伴關係，視為與投資研發（R&amp;D）同等重要的戰略任務。因為技術會被迭代，但深厚的社會關係網絡是時間的朋友，極難被後來者超越。</li>
</ol>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-GXCrds3g="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E7%9A%AE%E5%85%8B%E6%96%AFpixar%E7%9A%84%E6%99%BA%E5%9B%8A%E5%9C%98braintrust%E6%A9%9F%E5%88%B6">皮克斯（Pixar）的「智囊團（Braintrust）」機制</h4>

<ul>
<li><strong>社會複雜性的體現：</strong> 皮克斯能持續推出高品質動畫，核心在於其「智囊團」機制：
<ul>
<li>一群資深導演和編劇定期聚會，對正在開發的電影進行「極度坦誠、甚至殘酷的批評」。關鍵在於，這種批評<strong>沒有強制命令權，只有建議權</strong>，且導演有權決定是否採納。這需要極高的「心理安全感（Psychological Safety）」，參與者必須深信批評是針對作品而非個人，且不會影響自己的職位。</li>
</ul>
</li>
<li><strong>即使理解也難以模仿的實證：</strong> 2006 年迪士尼收購皮克斯後，迪士尼高層完全理解了「智囊團」的運作規則，並試圖將其複製到迪士尼動畫本部，以拯救當時陷入僵局的迪士尼動畫。
<ul>
<li><strong>結果卻慘遭滑鐵盧。</strong> 因為迪士尼原有的組織文化充滿了官僚層級、政治鬥爭和嚴格的績效考核。在這種社會環境下，員工不敢說真話，害怕得罪高層。</li>
<li>結果，迪士尼的「智囊團」退化成了形式主義的「互相表揚大會」，完全失去了皮克斯那種銳利、建設性的批判力量。這完美印證了：<strong>你可以複製會議的流程，但無法複製支撐該流程的社會互動規範。</strong></li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-bPtcuAWT="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E8%AB%BE%E5%BE%B7%E6%96%AF%E7%89%B9%E9%BE%8Dnordstrom%E7%9A%84%E6%A5%B5%E8%87%B4%E5%AE%A2%E6%88%B6%E6%9C%8D%E5%8B%99">諾德斯特龍（Nordstrom）的極致客戶服務</h4>

<ul>
<li>
<p><strong>社會複雜性的體現：</strong> 美國高端百貨<code>諾德斯特龍</code>以其「無條件退貨政策」和極致服務聞名（甚至有傳說員工接受客戶退還非該店銷售的輪胎）。</p>
<ul>
<li>這背後依賴的是一種微妙的社會複雜性：公司給予<code>第一線員工</code>極大的「自由裁量權（Discretion）」來解決客戶問題，這建立在<strong>公司對員工的絕對信任</strong>，以及<strong>員工對公司的忠誠與責任感</strong>之上。</li>
</ul>
</li>
<li>
<p>為何難以模仿：許多競爭者（如 JCPenney 或梅西百貨）曾試圖模仿這種「授權員工取悅客戶」的策略。但由於這些公司內部缺乏長期的信任網絡，往往導致兩種失敗結果：</p>
<ol>
<li>員工濫用權力，導致退貨成本暴增，公司被迫收緊政策。</li>
<li>管理層骨子裡不信任員工，表面授權，實則設置繁瑣的審批流程，導致員工無法及時解決客戶問題，服務體驗大打折扣。</li>
</ol>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-6R8i3MIP="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E5%85%88%E7%99%BC%E5%84%AA%E5%8B%A2-early-mover-advantage">先發優勢 Early-Mover Advantage</h4>

<p>先發優勢包含以下四種隔離機制：</p>
<ul>
<li>
<p>學習曲線</p>
<ul>
<li>先行者通過<code>經驗累積</code> 降低成本，後進者難以追趕</li>
</ul>
</li>
<li>
<p>聲譽與買家不確定性</p>
</li>
<li>
<p>轉換成本</p>
</li>
<li>
<p>網路效應</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-qH9NGlB3="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="25" data-size="16:9">
<h4 id="%E8%81%B2%E8%AD%BD%E8%88%87%E8%B2%B7%E5%AE%B6%E4%B8%8D%E7%A2%BA%E5%AE%9A%E6%80%A7">聲譽與買家不確定性</h4>

<ul>
<li>
<p>對於<code>體驗型商品</code>，企業良好的品質聲譽可帶來顯著的先發優勢。</p>
<ul>
<li><code>搜尋型商品（Search Good）</code>: 購買<strong>前</strong>就能評估其品質、特徵或價值的商品,</li>
<li><code>體驗型商品（Experience Good）</code>: 必須實際使用或消費<strong>後</strong>，才能判斷其品質好壞的商品</li>
</ul>
</li>
<li>
<p><code>先驅品牌</code>能影響消費者<strong>偏好的形成</strong>，並將自身品牌屬性塑造為該產品類別的理想標準。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="%E8%BD%89%E6%8F%9B%E6%88%90%E6%9C%AC">轉換成本</h4>

<p>在某些情況下，買家若<code>更換供應商</code>將產生顯著的轉換成本，例如：</p>
<ul>
<li>消費者在特定品牌上進行<code>專用性投資</code>（如學習使用某軟體)後，轉換品牌的成本很高；
<ul>
<li>賣方累積了針對特定買家的知識（如銀行業務）；</li>
<li>顧客加入超市的忠誠計畫或航空公司的白金旅客計畫。</li>
</ul>
</li>
</ul>
<h4 id="%E7%B6%B2%E8%B7%AF%E6%95%88%E6%87%89">網路效應</h4>
<ul>
<li>
<p>當顧客對產品的價值評估取決於使用該產品的其他<code>使用者數量</code>時，該產品即具有<code>網路效應</code>。</p>
</li>
<li>
<p>實際網路的價值取決於已有用戶數量（如電話網絡、社交網路）；</p>
</li>
<li>
<p>虛擬網路則源於互補品的使用（如軟體與個人電腦）。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="%E5%85%88%E7%99%BC%E5%8A%A3%E5%8B%A2-early-mover-disadvantages">先發劣勢 Early Mover Disadvantages</h4>

<ul>
<li>
<p>先發者可能缺乏使產品成功的<code>互補性資產</code>；</p>
</li>
<li>
<p>先發者可能被鎖定在<code>劣質技術路徑</code>上，</p>
<ul>
<li>而競爭對手可從其錯誤中學習（例如：王安實驗室）。</li>
</ul>
</li>
<li>
<p>前浪死在沙灘上</p>
</li>
</ul>
