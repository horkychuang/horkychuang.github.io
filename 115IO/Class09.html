<h4 id="power-and-culture">Power and Culture</h4>
<h5 id="%E6%AC%8A%E5%8A%9B%E8%88%87%E6%96%87%E5%8C%96">權力與文化</h5>
<p><strong>國企 Wen-Bin Chuang</strong><br />
<strong>2026-09-14</strong></p>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>

<h4 id="%E4%BC%81%E6%A5%AD%E8%A1%8C%E7%82%BA%E7%9A%84%E7%A4%BE%E6%9C%83%E8%84%88%E7%B5%A1">企業行為的社會脈絡</h4>

<ul>
<li>企業做生意，不是只看冷冰冰的數字，而是要看它身處的 <strong>「大環境規則（社會脈絡）」</strong>。企業必須同時看懂 <strong>「政府規定的明規則」</strong>、<strong>「同行默契的潛規則」</strong>，並且處理好 <strong>「對外的市場環境」</strong> 與 <strong>「對內的公司文化與權力」</strong>, 這包含了政府規定的法律，以及同行之間心照不宣的「潛規則」。</li>
<li>企業的兩個生存戰場：
<ul>
<li>外部（企業採取行動的脈絡）: 同一個市場裡，彼此的行為會互相影響</li>
<li><strong>內部</strong>（管理者進行決策的脈絡）: <code>內部脈絡</code>是指管理者與員工在企業內部工作的政治與文化環境。。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-nC5sdrWm="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="3" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E5%A4%96%E9%83%A8%E8%84%88%E7%B5%A1">外部脈絡</h4>

<ul>
<li>企業<code>對外</code>的<strong>社會脈絡</strong>包含企業所受的<strong>正式</strong>與<strong>非正式規範</strong>。
<ul>
<li>正式：由政府官員制定並執行
<ul>
<li>企業在「市場」中與其他公司競爭、合作的環境。大家都在同一個市場裡混，彼此的行為會互相影響</li>
</ul>
</li>
<li>非正式：市場的文化與認知秩序
<ul>
<li>市場的文化與認知秩序，是同行企業間的「共同價值觀與共識」</li>
</ul>
</li>
</ul>
</li>
<li>非正式規範源自於<code>產業內</code>企業間的共同價值觀與共識</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-FV3Bmw8h="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="4" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E5%85%A7%E9%83%A8%E8%84%88%E7%B5%A1">內部脈絡</h4>

<ul>
<li>
<p><code>權力</code>與<code>文化</code>是內部脈絡的兩個主要面向。</p>
</li>
<li>
<p>正式結構<code>無法完全解釋</code>複雜組織的運作。</p>
<ul>
<li><strong>為什麼需要它們？</strong> 因為公司太複雜了，不能什麼事都寫進死板的「公司規定（正式結構）」裡。</li>
</ul>
</li>
<li>
<p>通常，來自不同部門的管理者需要在沒有<code>正式規範</code>要求的情況下進行合作。當<code>正式控制</code>與<code>契約不可行</code>時，<strong>權力與文化</strong>在解決衝突方面扮演著重要角色。</p>
<ul>
<li>當不同部門需要合作，或是發生吵架（衝突）時，往往沒有明確的合約可以依循。這時候，靠的就是公司的 <strong>「文化（大家習慣怎麼做事）」</strong> 和 <strong>「權力（誰說話比較有分量）」</strong> 來解決問題。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-VikZmGm9="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="5" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%AC%8A%E5%8A%9B">權力</h4>

<ul>
<li><strong>真正的「權力」不一定來自你的頭銜有多大，而是看在「人脈網絡」中站在什麼位置！</strong>
<ul>
<li>權力是透過<code>非契約的交換關係</code>來實現個人目標的能力</li>
<li><code>權力</code>不同於<code>權威</code>，權威包含了明確授予的決策權。</li>
<li><code>影響力</code>是個人在特定情境下對權力的運用, <strong>權力 = 別人對你的「依賴程度」</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-wamr0ZCC="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="6" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%AC%8A%E5%8A%9B%E7%9A%84%E4%BE%86%E6%BA%90">權力的來源</h4>

<ul>
<li><code>權力基礎</code>是有助於行動者獲得權力的特質
<ul>
<li>基於<strong>正式權威</strong>的合法權力: 來自於你的「職位」與「頭銜」
<ul>
<li>基於<code>獎懲能力</code>的獎賞/<code>強制權力</code></li>
</ul>
</li>
<li><strong>非正式權力</strong>
<ul>
<li>基於<code>個人地位</code>、<code>形象或聲望</code>的權力</li>
<li><strong>魅力/人脈權</strong>, <strong>專家權</strong></li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-bGvIPlZp="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="7" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%AC%8A%E5%8A%9B%E7%9A%84%E7%A4%BE%E6%9C%83%E4%BA%A4%E6%8F%9B">權力的社會交換</h4>

<ul>
<li>組織中的權力通常基於<strong>社會交換</strong>。</li>
<li>與市場交換不同，社會交換可能導致雙方資源的<strong>不對等轉移</strong>。</li>
<li>如果雙方反覆進行的社會交換條件不對等，其中一方就會對另一方擁有權力。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-NRvuni58="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="8" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E7%A4%BE%E6%9C%83%E4%BA%A4%E6%8F%9B%E8%88%87%E8%B3%87%E6%BA%90%E4%BE%9D%E8%B3%B4">社會交換與資源依賴</h4>

<ul>
<li>
<p>如果A控制了B所需的資源，B就會依賴A;</p>
</li>
<li>
<p>如果A與B相互依賴，則雙方都無法控制對方</p>
<ul>
<li>如果B對A的依賴程度高於A對B的依賴程度，A就對B擁有<code>權力(影響力)</code>。</li>
</ul>
</li>
<li>
<p>個人或企業可以透過減少對他人的依賴，並增加他人對自己的依賴來提升權力（權力的資源依賴觀點）。</p>
</li>
<li>
<p>資源依賴觀點也預測，<strong>權力</strong>將會集中在<strong>控制關鍵資源</strong>的人，以及其<code>技能</code>對企業不可或缺的人手中。。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-hsPRogWm="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="9" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="intelintel-inside-%E6%8E%A7%E5%88%B6%E9%97%9C%E9%8D%B5%E8%B3%87%E6%BA%90%E5%8F%8D%E8%BD%89%E4%BE%9D%E8%B3%B4%E9%97%9C%E4%BF%82">Intel「Intel Inside」—— 控制關鍵資源、反轉依賴關係</h4>

<ul>
<li>1991 年之前，Intel 只是 PC 大廠（如 IBM）背後的<code>零組件供應商</code>，權力掌握在 <code>OEM</code> 手中。</li>
<li>策略：透過「Intel Inside」廣告直接建立終端消費者品牌認知，消費者主動指定要 Intel 晶片，PC 大廠反而必須採用 Intel 並分攤廣告費。</li>
<li>理論對應：
<ul>
<li>「減少自己對他人的依賴、增加他人對自己的依賴」→ Intel 不再依賴單一 OEM，OEM 卻深度依賴 Intel。</li>
<li>「權力累積於控制關鍵資源、技能不可或缺者」→ 晶片品牌成為不可或缺資源。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-fsetli6Z="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="10" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%AC%8A%E5%8A%9B%E7%9A%84%E7%B5%90%E6%A7%8B%E8%A7%80%E9%BB%9E">權力的結構觀點</h4>

<ul>
<li>除了<code>資源依賴</code>之外，權力也可追溯至<code>組織結構</code>。
<ul>
<li>在結構中佔據<code>某些職位</code>的人可能擁有權力。</li>
<li>權力也可透過企業內部的<code>資訊網絡</code>與<code>社會關係</code>與結構產生關聯。。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-ulyR28UR="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="11" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="apple-%E8%88%87%E5%AF%8C%E5%A3%AB%E5%BA%B7--%E4%B8%8D%E5%B0%8D%E7%AD%89%E4%BE%9D%E8%B3%B4%E7%94%A2%E7%94%9F%E6%AC%8A%E5%8A%9B">Apple 與富士康 —— 不對等依賴產生權力</h4>

<ul>
<li>Apple 控制品牌、設計、生態系與訂單（關鍵資源）；</li>
<li>富士康營收<code>高度依賴</code> Apple 訂單。</li>
<li>「B 依賴 A 的程度大於 A 依賴 B → A 對 B 擁有權力」：
<ul>
<li>Apple 在價格、品質、交期上擁有極強話語權。</li>
</ul>
</li>
<li>Apple 同時培養多家供應商（第二來源），進一步降低自身依賴。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-bkHyWOMR="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="12" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E7%B5%90%E6%A7%8B%E6%B4%9E%E7%90%86%E8%AB%96">結構洞理論</h4>

<ul>
<li>
<p><strong>Ronald Burt（羅納德·伯特</strong>利用結構洞的概念來解釋<code>結構權力</code>。</p>
<ul>
<li>在網絡中，如果兩個個體（或群體）之間沒有連結，就會<code>存在結構洞</code>。</li>
<li>當<code>某個個體</code>成為兩個個體（或群體）之間唯一的連結時，該個體就跨越了結構洞。</li>
</ul>
</li>
<li>
<p>誰能連結互不相識的兩群人，誰就掌握最大的權力。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-nQCZIZRb="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="13" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E7%B5%90%E6%A7%8B%E6%B4%9E%E7%90%86%E8%AB%96-1">結構洞理論</h4>

<ul>
<li>
<p>跨越結構洞的個體因為<code>控制了資訊流</code>而擁有權力。當原本未連結的兩個個體<code>直接進行互動</code>，從而消除了結構洞時，該<code>焦點人物</code>就會失去其權力。。</p>
</li>
<li>
<p><strong>「只懂寫程式的工程部」</strong> 和 <strong>「只懂賣東西的業務部」</strong></p>
<ul>
<li>兩個群體之間的那道 <strong>「鴻溝」或「斷層」</strong>，就叫做 <strong>「結構洞 (Structural Hole)」</strong></li>
<li>IF 你剛好是工程部裡最懂業務的人，同時也是業務部裡最懂技術的人</li>
<li><strong>你填補了這個洞：</strong> 你變成了連接這兩個孤島的「橋樑」。<strong>你因此獲得了「權力」：</strong> 當業務部需要評估技術可行性，或工程部需要知道客戶真正想要什麼時，<strong>雙方都必須「透過你」來溝通</strong>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-r5uhuSNY="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="14" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E7%B5%90%E6%A7%8B%E6%B4%9E%E6%9C%83%E5%B8%B6%E4%BE%86%E6%AC%8A%E5%8A%9B">結構洞會帶來「權力」?</h4>

<p>學術上稱為<strong>仲介利益 (Brokerage Benefits)</strong>，簡單來說有兩大超能力：</p>
<ul>
<li><strong>資訊優勢 (看得比別人遠)：</strong> 因為你同時混兩個不同的圈子，你能得到「不重複的資訊」。當別人只知道 A 圈子的八卦時，你已經知道 B 圈子的情報，你能把兩邊的想法結合，產生最具創意的點子。</li>
<li><strong>控制優勢 (成為必經之路)：</strong> 因為 A 和 B 沒有直接連線，他們要合作、交易或交換資源，都<strong>必須經過你</strong>。你掌握了「誰能認識誰」以及「資訊怎麼傳遞」的控制權。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-Nvn0ATzk="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="15" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E5%88%A9%E8%B1%90%E9%9B%86%E5%9C%98li--fung-%E8%B7%A8%E8%B6%8A%E7%B5%90%E6%A7%8B%E6%B4%9E%E7%9A%84%E8%88%88%E8%A1%B0">利豐集團（Li &amp; Fung）—— 跨越結構洞的興衰</h4>

<ul>
<li>全球知名的<code>跨國供應鏈管理公司</code>，專門為全球的零售商和品牌管理服飾、鞋類、玩具等消費品的生產與出口貿易，</li>
<li>興起：利豐長期作為西方零售商與亞洲工廠之間的<code>「唯一連結」</code>，跨越雙方資訊不對稱的結構洞，靠控制資訊流獲取權力與利潤（漁翁得利）。</li>
<li>衰落：2010 年代後，網際網路、快時尚（Zara）與<code>電商</code>讓買主與<code>工廠</code>直接对接，結構洞被消除 → 利豐的<code>仲介權力</code>與利潤空間萎縮，最終重整、私有化。</li>
<li>理論對應：「跨越結構洞者因控制資訊流而擁有權力」；「當結構洞被消除，焦點人物便失去權力」——此案例完美印證兩張投影片。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-RirKd8r9="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="16" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E7%B5%84%E7%B9%94%E6%88%90%E5%8A%9F%E8%88%87%E7%AE%A1%E7%90%86%E6%AC%8A%E5%8A%9B">組織成功與管理權力</h4>

<ul>
<li>管理者需要<code>權力</code>才能取得成功。</li>
<li>然而，管理者行使的權力不一定會帶來組織的成功。</li>
<li>每位管理者都扮演著<code>代理人</code>的角色，而權力會加劇<code>代理問題</code>。。</li>
</ul>
<h4 id="%E6%AC%8A%E5%8A%9B%E6%98%AF%E4%B8%80%E6%8A%8A%E9%9B%99%E9%9D%A2%E5%88%83">權力是一把雙面刃</h4>
<ul>
<li>管理者<code>累積權力</code>對企業有利（有害），如果
<ul>
<li>管理者與其下屬（上級）之間的<code>代理問題嚴重</code></li>
<li>企業的環境相對穩定（不穩定）。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-DnqWwX6K="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="17" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%AD%A3%E5%BC%8F%E6%AC%8A%E5%8A%9B%E7%9A%84%E5%88%86%E9%85%8D">正式權力的分配</h4>

<ul>
<li>
<p>一個關鍵的管理議題是如何在組織內分配<strong>正式權力</strong>。</p>
<ul>
<li>如果要有效地運用權力，其分配應該基於個人所擁有的<strong>知識</strong>。</li>
<li>除了知識之外，企業在分配正式權力之前，還應該考慮<code>個人的利益</code>是否與<code>企業的利益</code>一致。</li>
<li>另一個考量因素可能是該個體預計會在企業<code>待多久</code>。</li>
<li>企業還應該考慮權力接收者對權力的重視程度。</li>
</ul>
</li>
<li>
<p>企業或許可以提供更多的正式權力而非更高的薪水，以降低離職率。。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-E1Al9GAc="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="18" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96">文化</h4>

<ul>
<li>
<p>文化是一套<code>共享的價值觀</code>、<code>信念與規範</code>，會影響員工的偏好與行為。</p>
<ul>
<li>文化為組織成員間的<code>隱性契約</code>設定了脈絡。</li>
<li>當<code>正式契約</code>與<code>手冊</code>無法發揮作用時，文化可作為適當行為的<code>非正式指標</code>。</li>
</ul>
</li>
<li>
<p>文化，就是公司裡 <strong>「大家心照不宣的做事方式」</strong>，它是沒有寫在員工手冊上，但每個人都知道該遵守的「潛規則」。。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-bVBkY97e="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="19" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96%E8%BC%94%E5%8A%A9%E6%AD%A3%E5%BC%8F%E6%8E%A7%E5%88%B6">文化輔助正式控制</h4>

<ul>
<li>
<p>文化可以限制管理者的自由, <strong>你看不見它，但它無所不在</strong>。</p>
</li>
<li>
<p>如果文化規範支持企業的策略，文化也能協助管理者,</p>
<ul>
<li><strong>水質(文化)決定了魚(公司) 的狀態</strong>, 這缸水（文化）是充滿毒素、互相猜忌的，再兇猛的魚（優秀員工）也會生病、想逃跑；</li>
<li>如果這缸水是溫暖、互相支持的，平凡的魚也能長得很好</li>
</ul>
</li>
<li>
<p>文化、結構、實務做法與人員共同影響企業的績效。。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-tm1RzbEj="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="20" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96%E8%88%87%E7%B8%BE%E6%95%88">文化與績效</h4>

<ul>
<li>
<p>文化常被用來解釋為何兩個在其他方面相同的企業（國家）似乎表現不同。</p>
</li>
<li>
<p>要使文化有助於實現競爭優勢</p>
<ul>
<li>文化必須是<code>獨特</code>且<code>難以模仿的</code>，並且</li>
<li>文化必須對企業<code>有價值</code>。</li>
</ul>
</li>
<li>
<p>如果文化很容易被複製，競爭對手就會複製成功企業的文化，這樣就不會有相關的競爭優勢。</p>
</li>
<li>
<p>文化可能很容易被記錄和描述，但無法輕易被複製。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-pOZKPZV5="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="21" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96%E8%88%87%E7%B8%BE%E6%95%88-1">文化與績效</h4>

<ul>
<li>
<p>文化對企業有價值，是因為</p>
<ul>
<li>透過<code>補充</code>正式控制系統來降低監督成本，以及</li>
<li>透過塑造個人偏好以符合企業目標。</li>
</ul>
</li>
<li>
<p>降低<code>談判與協商成本</code>。</p>
</li>
<li>
<p>無須使用明確的手段即可達成合作。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-SXw3UnP0="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="22" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96%E8%88%87%E6%AD%A3%E5%BC%8F%E5%A5%91%E7%B4%84">文化與正式契約</h4>

<ul>
<li>文化可以將個人的目標與行為和企業的目標對齊.</li>
<li>文化比正式契約能更有效地控制個人活動。</li>
<li>擁有<code>正確的文化</code>，可以降低監督成本並將投機行為降至最低。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-RAkuyE71="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="23" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96%E8%88%87%E5%90%88%E4%BD%9C">文化與合作</h4>

<ul>
<li>
<p>文化創造了<code>相互強化</code>的規範，使自利的行動者參與互惠的活動。</p>
<ul>
<li>根據無名氏定理 (Folk Theorem)，合作是許多可能結果中的一種。</li>
</ul>
</li>
<li>
<p><code>降低內部交易成本</code>：當內部充滿信任且價值觀一致時，就不需要制定厚厚的員工手冊和繁瑣的審批流程，組織運行效率極高。。</p>
</li>
<li>
<p><code>合作的文化</code>塑造了個人的期望，使其預期他人會合作，並解決困難的代理問題。</p>
</li>
<li>
<p><code>知行合一（Alignment）</code>：文化不是口號，而是與 KPI、晉升機制和資源分配掛鉤。。</p>
</li>
<li>
<p><code>文化與策略適配</code>：當內部脈絡完美支撐了外部策略時，好結果就會自然發生</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-0mXsylBe="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="24" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="netflix%E8%87%AA%E7%94%B1%E8%88%87%E8%B2%AC%E4%BB%BB%E8%88%87%E6%A5%B5%E8%87%B4%E5%9D%A6%E8%AA%A0">Netflix：「自由與責任」與極致坦誠</h4>
<ul>
<li>
<p><strong>內部脈絡 / 文化</strong>：Netflix 的文化脈絡建立在 <strong>「極高的人才密度」</strong> 之上。</p>
<ul>
<li>他們取消了一切繁文縟節（沒有休假天數限制、沒有差旅審批流程），並推崇「極致的坦誠」（Radical Candor）。內部脈絡默認：只要你是成年人且為了公司好，你就應該擁有最大的決策自由，但同時必須承擔極高的績效責任。</li>
</ul>
</li>
<li>
<p>帶來的好結果：這種反傳統的內部脈絡極大地降低了組織內部的<strong>交易與監督成本</strong>。它賦予了員工極高的敏捷性與決策速度，使 Netflix 能夠屢次成功自我顛覆（從 DVD 租賃到串流媒體，再到原創內容霸主），並持續產出現象級的影視作品。</p>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-qDnA3vhR="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="25" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="toyota%E8%B1%90%E7%94%B0%E6%B1%BD%E8%BB%8A%E6%8C%81%E7%BA%8C%E6%94%B9%E5%96%84%E8%88%87%E8%B3%A6%E6%AC%8A%E7%AC%AC%E4%B8%80%E7%B7%9A">Toyota（豐田汽車）：「持續改善」與賦權第一線</h4>
<ul>
<li>內部脈絡 / 文化：豐田模式（The Toyota Way）的核心內部脈絡是 <strong>「持續改善」</strong>（Kaizen） 與 <strong>「尊重人性」</strong>。</li>
<li>在傳統製造業中，停止生產線是嚴重的失誤；但在豐田，任何一位第一線員工只要發現瑕疵或異常，都有權利且有義務拉下頭上的「安燈」（Andon）繩索，直接停止整條生產線，且不會受到懲罰，反而會得到團隊的協助來解決根本問題。</li>
<li>帶來的好結果：這種賦權基層的文化脈絡，造就了豐田舉世聞名的精益生產系統（TPS）。它讓豐田在生產品質、成本控制和庫存管理上長期領先全球，使其成為全球利潤最高、韌性最強的汽車製造商之一。</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-V2TD6FzR="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="26" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="%E6%96%87%E5%8C%96%E8%88%87%E6%85%A3%E6%80%A7">文化與慣性</h4>

<ul>
<li>文化的缺點是它可能會<code>阻礙變革</code>。</li>
<li>當企業的策略與環境契合時，文化規範可以是一項資產。</li>
<li>當企業必須在面臨快速環境變遷的情況下適應以求生存時，文化可能會拖累績效。</li>
</ul>
<h4 id="%E5%B0%8D%E6%96%87%E5%8C%96%E7%9A%84%E8%AD%A6%E6%83%95">對文化的警惕</h4>
<ul>
<li>文化會以多種方式造成<code>慣性</code>
<ul>
<li>任期較長的高階主管是在不同條件下學習其工作的，可能無法<code>應對變革</code>。</li>
<li>企業內的<code>權力基礎</code>可能會受到變革的威脅，導致這些群體阻礙變革。</li>
<li>組織常規可能存在<code>保守偏誤</code>。</li>
</ul>
</li>
</ul>
<footer>Designed by Wen-Bin 2026-09-05</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-oZaiAEZY="" data-color="#000" data-background-color="#fef9e7;" data-background-image="url('images/background_1.JPG')" data-footer="Designed by Wen-Bin 2026-09-05" data-paginate="true" data-theme="gaia" lang="zh-TW" data-marpit-pagination="27" style="--color:#000;--background-color:#fef9e7;;--background-image:url('images/background_1.JPG');--footer:Designed by Wen-Bin 2026-09-05;--paginate:true;--theme:gaia;color:#000;background-color:#fef9e7;;background-image:url('images/background_1.JPG');background-position:center;background-repeat:no-repeat;background-size:cover;" data-marpit-pagination-total="28" data-size="16:9">
<h4 id="nokia--%E6%96%87%E5%8C%96%E9%98%BB%E7%A4%99%E6%BF%80%E9%80%B2%E8%AE%8A%E9%9D%A9">Nokia —— 文化阻礙激進變革</h4>

<ul>
<li>研究（Vuori &amp; Huy）指出 Nokia 內部存在<code>共享恐懼</code>文化：
<ul>
<li>高層威壓、中層隱藏壞消息、報喜不報憂，Symbian 的問題長期被掩蓋。</li>
<li>資深主管在<code>舊條件</code>下成功、權力基礎（硬體/Symbian 部門）受變革威脅而阻撓變革、組織慣例保守偏誤。</li>
</ul>
</li>
<li>結果：2007 年 iPhone 崛起後迅速衰落，2013 年將手機事業賣給 Microsoft。</li>
<li>理論對應：<code>文化可能拖累績效</code>的慣性機制全部命中。</li>
</ul>
